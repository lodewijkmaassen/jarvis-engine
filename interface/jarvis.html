<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Eén visuele wereld, bewust: een donkere HUD. Beide hostthema's krijgen dezelfde grond. */
:root{
  --grond:#060A10; --grond2:#0B121B; --vlak:rgba(11,19,29,.86); --vlak2:rgba(18,30,44,.9); --lijn:rgba(95,227,255,.16); --lijn2:rgba(95,227,255,.34);
  --inkt:#D9E6F2; --gedempt:#8CA2B8; --zacht:#5D7288;
  --cyaan:#5FE3FF; --cyaan-zacht:rgba(95,227,255,.12); --cyaan-gloed:0 0 18px rgba(95,227,255,.35);
  --hoog:#FF5C6C; --hoog-zacht:rgba(255,92,108,.14); --midden:#FFB454; --midden-zacht:rgba(255,180,84,.14); --laag:#6F86A0; --laag-zacht:rgba(111,134,160,.16);
  --ok:#3DDC97; --ok-zacht:rgba(61,220,151,.14);
  --display:"Rajdhani","Bahnschrift","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--grond);color:var(--inkt);font:15px/1.5 var(--body);min-height:100vh;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(95,227,255,.10),transparent 60%),
    linear-gradient(rgba(95,227,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(95,227,255,.035) 1px,transparent 1px);
  background-size:100% 100%,28px 28px,28px 28px;background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,textarea:focus-visible{outline:2px solid var(--cyaan);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em}

/* ---- skelet ---- */
.app{display:grid;grid-template-columns:1fr;max-width:1180px;margin:0 auto;padding:0 0 56px}
.kaartkolom{padding:8px 12px 0}
.inhoud{padding:0 12px}
@media(min-width:900px){
  .app{grid-template-columns:420px 1fr;gap:28px;padding:20px 24px 60px}
  .kaartkolom{position:sticky;top:20px;align-self:start;padding:0}
  .inhoud{padding:0}
}

/* ---- paneel met hoekbeugels ---- */
.paneel{position:relative;background:var(--vlak);border:1px solid var(--lijn);backdrop-filter:blur(6px)}
.paneel::before,.paneel::after{content:"";position:absolute;width:12px;height:12px;border-color:var(--cyaan);border-style:solid;opacity:.8}
.paneel::before{left:-1px;top:-1px;border-width:2px 0 0 2px}
.paneel::after{right:-1px;bottom:-1px;border-width:0 2px 2px 0}

/* ---- kop + kaart ---- */
.kop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 4px 8px}
.kop h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 0 14px rgba(95,227,255,.55)}
.kop h1 small{font:600 11px/1 var(--display);color:var(--cyaan);margin-left:10px;letter-spacing:.2em}
.status{font-family:var(--mono);font-size:11.5px;color:var(--gedempt);text-align:right;line-height:1.5}
.status b{font-weight:500;color:var(--cyaan)}
.status .oud{color:var(--midden)}
.status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);margin-right:6px;vertical-align:1px}
.status .dot.uit{background:var(--hoog);box-shadow:0 0 8px var(--hoog)}
.status .dot.bezig{background:var(--midden);box-shadow:0 0 8px var(--midden)}
@media(prefers-reduced-motion:no-preference){.status .dot.bezig{animation:knip 1.2s ease-in-out infinite}}
@keyframes knip{50%{opacity:.35}}
.kaart{padding:6px 6px 2px}
.kaart svg{display:block;width:100%;height:auto;max-height:270px}
@media(min-width:900px){.kaart svg{max-height:360px}}
.kaart .ring{fill:none;stroke:var(--lijn);stroke-width:1}
.kaart .ring.tik{stroke-dasharray:2 10;stroke:var(--lijn2)}
.kaart .knoop{cursor:pointer}
.kaart .knoop circle.schijf{fill:rgba(11,19,29,.92);stroke:var(--lijn2);stroke-width:1.2;transition:stroke .15s,fill .15s}
.kaart .knoop circle.buiten{fill:none;stroke:var(--cyaan);stroke-width:1;opacity:.35;stroke-dasharray:6 4}
.kaart .knoop.los circle.schijf{stroke-dasharray:4 3}
.kaart .knoop.actief circle.schijf{stroke:var(--cyaan);stroke-width:1.8;fill:rgba(95,227,255,.10);filter:drop-shadow(0 0 8px rgba(95,227,255,.45))}
.kaart .knoop text{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;fill:var(--inkt);pointer-events:none}
.kaart .knoop text.sub{font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:0;text-transform:none;fill:var(--gedempt)}
.kaart .centrum circle.kern{fill:rgba(95,227,255,.14);stroke:var(--cyaan);stroke-width:2;filter:drop-shadow(0 0 12px rgba(95,227,255,.6))}
.kaart .centrum circle.kern2{fill:none;stroke:var(--cyaan);stroke-width:1;opacity:.6}
.kaart .centrum.actief circle.kern{fill:rgba(95,227,255,.28)}
.kaart .centrum text{fill:#fff;font-weight:700;font-size:15px;letter-spacing:.16em}
.kaart .centrum text.sub{fill:var(--cyaan)}
.kaart .draai{fill:none;stroke:var(--cyaan);stroke-width:1.5;stroke-dasharray:40 26 8 26;opacity:.7;transform-origin:center;transform-box:fill-box}
@media(prefers-reduced-motion:no-preference){.kaart .draai{animation:draai 24s linear infinite}.kaart .draai.terug{animation-direction:reverse;animation-duration:38s}}
@keyframes draai{to{transform:rotate(360deg)}}
.kaart line{stroke:var(--lijn2);stroke-linecap:round}
.kaart line.los{stroke-dasharray:3 6}
.kaart .badge circle{fill:var(--hoog);filter:drop-shadow(0 0 6px rgba(255,92,108,.7))}
.kaart .badge text{fill:#fff;font-family:var(--mono);font-size:10.5px;font-weight:500;pointer-events:none}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 8px 8px;font-family:var(--mono);font-size:11px;color:var(--gedempt)}
.legenda span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--lijn2)}
.legenda .l-jou::before{background:var(--hoog);box-shadow:0 0 6px var(--hoog)}
.legenda .l-los::before{background:none;border:1px dashed var(--zacht);width:6px;height:6px}

/* ---- secties ---- */
.sectie{margin-top:20px}
.sectiekop{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 4px 8px;border-bottom:1px solid var(--lijn);margin-bottom:10px}
.sectiekop h2{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:#fff}
.sectiekop h2::before{content:"// ";color:var(--cyaan);font-weight:500}
.sectiekop .tel{font-family:var(--mono);font-size:11.5px;color:var(--gedempt)}
.eyebrow{font-family:var(--display);font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--cyaan)}

/* ---- items ---- */
.lijst{display:flex;flex-direction:column;gap:8px}
.item{position:relative;background:var(--vlak);border:1px solid var(--lijn);border-left-width:3px;border-left-color:var(--laag)}
.item.u-hoog{border-left-color:var(--hoog);box-shadow:inset 3px 0 12px -6px var(--hoog)}
.item.u-midden{border-left-color:var(--midden)}
.item.beantwoord{border-left-color:var(--ok);opacity:.8}
.item.open{border-color:var(--lijn2)}
.item > .kopknop{display:block;width:100%;text-align:left;padding:12px 14px;min-height:44px}
.itemmeta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:5px}
.chip{display:inline-flex;align-items:center;font-family:var(--display);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:1px 7px;border:1px solid var(--lijn2);color:var(--gedempt);line-height:1.5}
.chip.soort-beslissing,.chip.soort-conflict,.chip.soort-blokkade{border-color:var(--hoog);color:var(--hoog)}
.chip.soort-actie{border-color:var(--midden);color:var(--midden)}
.chip.project{border-color:var(--cyaan);color:var(--cyaan)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.wacht{border-color:var(--midden);color:var(--midden)}
.itemtitel{font-weight:500;font-size:15.5px;line-height:1.35;color:#fff}
.itemuit{padding:2px 14px 14px;border-top:1px solid var(--lijn)}
.blok{margin-top:12px}
.blok .eyebrow{display:block;margin-bottom:3px}
.blok p{color:var(--gedempt);max-width:64ch}
.blok p strong{color:var(--inkt)}
.bron{font-family:var(--mono);font-size:11px;color:var(--zacht);margin-top:10px}
.opties{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.optie{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:10px 12px;background:var(--vlak2);border:1px solid var(--lijn);text-align:left;min-height:44px;width:100%}
.optie:hover,.optie:focus-visible{border-color:var(--lijn2)}
.optie.advies{border-color:var(--cyaan);box-shadow:var(--cyaan-gloed)}
.optie .lbl{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.optie .lbl .adv{font-size:10.5px;color:var(--cyaan);margin-left:8px;letter-spacing:.18em}
.optie .gevolg{grid-column:1;font-size:13.5px;color:var(--gedempt);line-height:1.45}
.optie .kies{grid-column:2;grid-row:1/3;font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyaan);border:1px solid var(--cyaan);padding:6px 10px;white-space:nowrap}
.optie:disabled{opacity:.45;cursor:default}
.adviestekst{margin-top:10px;padding:10px 12px;border:1px solid var(--cyaan);border-left-width:3px;background:var(--cyaan-zacht);font-size:14px;color:var(--inkt)}
.adviestekst .eyebrow{display:block;margin-bottom:2px}
.antwoordvak{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.antwoordvak textarea{width:100%;min-height:60px;resize:vertical;padding:8px 10px;border:1px solid var(--lijn2);background:rgba(6,10,16,.7);color:var(--inkt);font:inherit;font-size:14px}
.antwoordvak textarea::placeholder{color:var(--zacht)}
.knop{min-height:40px;padding:0 14px;border:1px solid var(--lijn2);background:var(--vlak2);font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.knop.stil{background:none;border-color:transparent;color:var(--gedempt)}
.knop:disabled{opacity:.5;cursor:default}
.antwoordstatus{margin-top:12px;padding:10px 12px;border:1px solid var(--lijn);background:var(--vlak2);font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.antwoordstatus .rij{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.antwoordstatus .mono{color:var(--zacht);font-size:11.5px}
.antwoordstatus .verw{color:var(--inkt)}
.antwoordstatus .verw::before{content:"Jarvis: ";color:var(--cyaan);font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;font-size:12px}
.leeg{padding:22px 16px;color:var(--gedempt);text-align:center}
.leeg strong{display:block;color:#fff;font-family:var(--display);font-size:18px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}

/* ---- projectpaneel ---- */
.terug{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 6px;color:var(--cyaan);font-family:var(--display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin:6px 0 4px}
.projkop{padding:0 4px 10px}
.projkop h2{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.12em;text-transform:uppercase;color:#fff;text-shadow:0 0 12px rgba(95,227,255,.35)}
.projkop .sub{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:4px;font-family:var(--mono);font-size:12px;color:var(--gedempt)}
.tegels{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:4px}
.tegel{padding:10px 12px}
.tegel .eyebrow{display:block;margin-bottom:2px}
.tegel .n{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.05;color:#fff}
.tegel .n small{font:400 11px/1 var(--mono);color:var(--gedempt);margin-left:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--lijn);margin:16px 0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{min-height:44px;padding:0 12px;font-family:var(--display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gedempt);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--cyaan);text-shadow:0 0 10px rgba(95,227,255,.5)}
.tab .tel{font-family:var(--mono);font-size:11px;margin-left:5px;color:var(--zacht);letter-spacing:0}
details.stand{background:var(--vlak);border:1px solid var(--lijn);margin-bottom:8px}
details.stand summary{cursor:pointer;list-style:none;padding:12px 14px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:#fff;display:flex;justify-content:space-between;align-items:center;min-height:44px}
details.stand summary::-webkit-details-marker{display:none}
details.stand summary::after{content:"+";font-family:var(--mono);color:var(--cyaan);font-weight:400}
details.stand[open] summary::after{content:"–"}
.md{padding:0 14px 14px;max-width:66ch;color:var(--inkt)}
.md p{margin:0 0 10px}
.md ul{margin:0 0 10px;padding-left:20px}
.md li{margin:4px 0}
.md code{font-family:var(--mono);font-size:.88em;background:var(--vlak2);padding:1px 5px;color:var(--cyaan)}
.md em{color:var(--gedempt)}
.dag{margin-top:14px}
.dag .eyebrow{padding:0 4px 6px;display:block}
.commit{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 12px;background:var(--vlak);border:1px solid var(--lijn);margin-bottom:6px;align-items:baseline}
.commit .hash{font-family:var(--mono);font-size:12px;color:var(--cyaan);padding-top:2px}
.commit .ond{font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.commit .rol{grid-column:2;display:flex;gap:6px;flex-wrap:wrap}
.commit.merge .ond{color:var(--gedempt)}
.taak{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--vlak);border:1px solid var(--lijn);margin-bottom:8px}
.taak .id{font-family:var(--mono);font-size:11.5px;color:var(--zacht)}
.taak .t{font-weight:500;color:#fff}
.taak .r{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.meer{display:block;width:100%;text-align:center;min-height:44px;color:var(--cyaan);font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.melding{background:var(--midden-zacht);color:var(--inkt);border:1px solid var(--midden);padding:12px 14px;margin:10px 0;font-size:14px}
.melding.fout{background:var(--hoog-zacht);border-color:var(--hoog)}

/* ---- taken met voortgang ---- */
.taak{flex-wrap:wrap}
.taak .kopregel{display:flex;gap:10px;align-items:center;width:100%}
.voortgang{width:100%;margin-top:8px}
.balk{height:4px;background:var(--lijn);position:relative;margin:6px 0 8px}
.balk i{position:absolute;left:0;top:0;bottom:0;background:var(--cyaan);box-shadow:0 0 8px var(--cyaan)}
.stap{display:grid;grid-template-columns:18px 1fr;gap:8px;padding:3px 0;font-size:13.5px;color:var(--gedempt);align-items:start}
.stap.gedaan{color:var(--zacht);text-decoration:line-through;text-decoration-color:var(--zacht)}
.stap .vink{font-family:var(--mono);color:var(--ok)}
.stap.open .vink{color:var(--midden)}
.stap.nu .vink{color:var(--cyaan)}
.stap.nu{color:var(--inkt)}
.taak .gast{font-family:var(--mono);font-size:11px;color:var(--zacht);width:100%}
/* ---- Jarvis: activiteit ---- */
.agent{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 12px;background:var(--vlak);border:1px solid var(--lijn);margin-bottom:8px;align-items:center}
.agent .naam{font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff}
.agent .naam .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--zacht);vertical-align:1px}
.agent.actief .naam .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.agent.bezig .naam .dot{background:var(--cyaan);box-shadow:0 0 8px var(--cyaan)}
@media(prefers-reduced-motion:no-preference){.agent.bezig .naam .dot{animation:knip 1.2s ease-in-out infinite}}
.agent .wat{grid-column:1/3;font-size:14px;color:var(--inkt)}
.agent .meta{grid-column:1/3;font-family:var(--mono);font-size:11px;color:var(--zacht)}
.rolrij{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;padding:8px 12px;border:1px solid var(--lijn);background:var(--vlak);margin-bottom:6px;align-items:baseline}
.rolrij .rol{font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cyaan)}
.rolrij .n{font-family:var(--mono);font-size:12px;color:var(--gedempt)}
.rolrij .ond{grid-column:1/4;font-size:13.5px;color:var(--gedempt)}
/* ---- gesprek ---- */
.gesprek{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.bericht{max-width:64ch;padding:10px 12px;border:1px solid var(--lijn);background:var(--vlak);font-size:14.5px;line-height:1.5}
.bericht.jarvis{border-left:3px solid var(--cyaan);align-self:flex-start}
.bericht.eigenaar{border-right:3px solid var(--midden);align-self:flex-end;background:var(--vlak2)}
.bericht .van{font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyaan);display:block;margin-bottom:2px}
.bericht.eigenaar .van{color:var(--midden)}
.bericht .tijd{font-family:var(--mono);font-size:10.5px;color:var(--zacht);margin-left:8px}
.bericht.wacht{opacity:.7}
.invoer{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:end}
.invoer textarea{min-height:48px;resize:vertical;padding:10px;border:1px solid var(--lijn2);background:rgba(6,10,16,.7);color:var(--inkt);font:inherit;font-size:14.5px}
.invoer .knop{min-height:48px}
.knop.mic.aan{border-color:var(--hoog);color:var(--hoog);box-shadow:0 0 10px rgba(255,92,108,.5)}
.stemregel{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:10px;font-family:var(--mono);font-size:11.5px;color:var(--gedempt)}
.stemregel label{display:inline-flex;gap:6px;align-items:center;min-height:32px;cursor:pointer}
.stemregel select{background:var(--vlak2);color:var(--inkt);border:1px solid var(--lijn2);font:inherit;font-size:12px;padding:4px 6px;max-width:100%}
.voet{margin-top:28px;padding:0 4px;font-family:var(--mono);font-size:11px;color:var(--zacht);line-height:1.7}
</style>

<div class="app">
  <div class="kaartkolom">
    <div class="kop">
      <h1>Jarvis<small id="kop-versie"></small></h1>
      <div class="status" id="status">laden…</div>
    </div>
    <div class="paneel kaart">
      <svg id="kaart" viewBox="0 0 360 200" role="group" aria-label="Projectkaart"></svg>
      <div class="legenda"><span class="l-jou">ligt bij jou</span><span>grootte = beweging, 14 dagen</span><span class="l-los">niet aangesloten</span></div>
    </div>
  </div>
  <div class="inhoud" id="inhoud">
    <div class="paneel leeg" style="margin-top:18px"><strong>Jarvis laadt</strong>De stand van zaken wordt opgehaald.</div>
  </div>
</div>

<script>
(() => {
"use strict";
const $inhoud = document.getElementById("inhoud");
const $kaart = document.getElementById("kaart");
const $status = document.getElementById("status");
const RECENT_DAGEN = 14;

const staat = { overzicht: null, antwoorden: new Map(), berichten: [], jarvis: null, db: null, artifact: null, zicht: { soort: "jou" }, open: new Set(), toonAlles: new Set(), dbFout: null, signaal: "", stem: { aan: false, naam: "" }, luistert: false, laatstVoorgelezen: "" };
try { const st = localStorage.getItem("jarvis.stem"); if (st) staat.stem = JSON.parse(st); } catch { /* geen opslag */ }
const bewaarStem = () => { try { localStorage.setItem("jarvis.stem", JSON.stringify(staat.stem)); } catch { /* geen opslag */ } };
try { const z = sessionStorage.getItem("jarvis.zicht"); if (z) staat.zicht = JSON.parse(z); } catch { /* geen opslag */ }
const bewaarZicht = () => { try { sessionStorage.setItem("jarvis.zicht", JSON.stringify(staat.zicht)); } catch { /* geen opslag */ } };

/* ---------- hulpjes ---------- */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MAANDEN = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
function datumKort(iso) { const d = new Date(iso); if (isNaN(d)) return esc(iso); return `${d.getDate()} ${MAANDEN[d.getMonth()]}`; }
function tijd(iso) { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" }); }
function dagLabel(iso) {
  const d = new Date(iso), nu = new Date();
  const dag = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const verschil = Math.round((dag(nu) - dag(d)) / 864e5);
  if (verschil === 0) return "Vandaag"; if (verschil === 1) return "Gisteren";
  if (verschil < 7) return d.toLocaleDateString("nl-NL", { weekday: "long" }).replace(/^./, (c) => c.toUpperCase());
  return `${d.getDate()} ${MAANDEN[d.getMonth()]}`;
}
function relatief(iso) {
  const ms = Date.now() - new Date(iso).getTime();
  const m = Math.round(ms / 6e4), u = Math.round(ms / 36e5), d = Math.round(ms / 864e5);
  if (m < 2) return "zojuist"; if (m < 60) return `${m} min geleden`;
  if (u < 24) return `${u} uur geleden`; if (d === 1) return "gisteren"; return `${d} dagen geleden`;
}
const SOORT = { beslissing: "beslissing", conflict: "conflict", actie: "actie", risico: "risico", blokkade: "blokkade" };

/* Minimale, veilige Markdown: eerst escapen, dan alleen wat de bron gebruikt. */
function md(tekst) {
  const regels = String(tekst).replace(/\r\n/g, "\n").replace(/<!--[\s\S]*?-->/g, "").split("\n");
  const uit = []; let para = []; let lijst = null;
  const inline = (t) => esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])_([^_]+)_(?=[\s.,;:)]|$)/g, "$1<em>$2</em>");
  const sluitPara = () => { if (para.length) { uit.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
  const sluitLijst = () => { if (lijst) { uit.push(`<ul>${lijst.map((l) => `<li>${inline(l)}</li>`).join("")}</ul>`); lijst = null; } };
  for (const r of regels) {
    const punt = /^\s*[-*]\s+(.*)$/.exec(r);
    if (punt) { sluitPara(); (lijst ??= []).push(punt[1]); continue; }
    if (/^\s{2,}\S/.test(r) && lijst) { lijst[lijst.length - 1] += " " + r.trim(); continue; }
    if (r.trim() === "") { sluitPara(); sluitLijst(); continue; }
    if (/^\|/.test(r)) continue;
    sluitLijst(); para.push(r.trim());
  }
  sluitPara(); sluitLijst();
  return uit.join("");
}
const inlineMd = (t) => md(t).replace(/^<p>|<\/p>$/g, "").replace(/<\/p><p>/g, " ");

/* ---------- kaart ---------- */
function tekenKaart() {
  const o = staat.overzicht; if (!o) return;
  const W = 360, H = 200, cx = W / 2, cy = H / 2 - 4;
  const projecten = o.projecten;
  const n = projecten.length;
  const R = n <= 2 ? 120 : 104;
  const start = n <= 2 ? 180 : -90;
  const maxRecent = Math.max(1, ...projecten.map((p) => p.recent.length));
  const zicht = staat.zicht;
  let s = `<circle class="ring" cx="${cx}" cy="${cy}" r="62"/><circle class="ring tik" cx="${cx}" cy="${cy}" r="88"/><circle class="ring" cx="${cx}" cy="${cy}" r="150"/>`;
  const knopen = projecten.map((p, i) => {
    const hoek = ((start + (360 / n) * i) * Math.PI) / 180;
    const x = cx + R * Math.cos(hoek), y = cy + (R * 0.58) * Math.sin(hoek);
    const activiteit = p.recent.length / maxRecent;
    const r = 22 + Math.round(activiteit * 12);
    return { p, x, y, r, activiteit };
  });
  for (const k of knopen) {
    const dikte = 0.8 + k.activiteit * 2.2;
    s += `<line x1="${cx}" y1="${cy}" x2="${k.x.toFixed(1)}" y2="${k.y.toFixed(1)}" stroke-width="${dikte.toFixed(1)}" class="${k.p.aangesloten ? "" : "los"}"/>`;
  }
  const centrumActief = zicht.soort === "jarvis";
  const openTotaal = o.voor_jou.filter((a) => !staat.antwoorden.has(a.id)).length;
  s += `<g class="centrum knoop ${centrumActief ? "actief" : ""}" data-doel="jou" tabindex="0" role="button" aria-label="Jarvis, alles wat bij jou ligt">
    <circle class="draai" cx="${cx}" cy="${cy}" r="44"/>
    <circle class="draai terug" cx="${cx}" cy="${cy}" r="50" style="stroke-dasharray:14 30;opacity:.35"/>
    <circle class="kern2" cx="${cx}" cy="${cy}" r="38"/>
    <circle class="kern" cx="${cx}" cy="${cy}" r="32"/>
    <text x="${cx}" y="${cy - 2}" text-anchor="middle">Jarvis</text>
    <text class="sub" x="${cx}" y="${cy + 12}" text-anchor="middle">${openTotaal} voor jou</text>
  </g>`;
  for (const k of knopen) {
    const actief = zicht.soort === "project" && zicht.id === k.p.id;
    const aantal = k.p.aandacht.filter((a) => !staat.antwoorden.has(a.id)).length;
    const labelY = k.y + k.r + 16;
    const naam = k.p.naam.length > 11 ? k.p.naam.slice(0, 10) + "…" : k.p.naam;
    s += `<g class="knoop ${actief ? "actief" : ""} ${k.p.aangesloten ? "" : "los"}" data-doel="project" data-id="${esc(k.p.id)}" tabindex="0" role="button" aria-label="${esc(k.p.naam)}, ${aantal} voor jou">
      <circle class="buiten" cx="${k.x.toFixed(1)}" cy="${k.y.toFixed(1)}" r="${k.r + 5}"/>
      <circle class="schijf" cx="${k.x.toFixed(1)}" cy="${k.y.toFixed(1)}" r="${k.r}"/>
      <text x="${k.x.toFixed(1)}" y="${k.y + 4.5}" text-anchor="middle" style="font-size:${k.r > 30 ? 12 : 11}px">${esc(naam)}</text>
      <text class="sub" x="${k.x.toFixed(1)}" y="${labelY}" text-anchor="middle">${k.p.recent.length} commits</text>
      ${k.p.aangesloten ? "" : `<text class="sub" x="${k.x.toFixed(1)}" y="${labelY + 12}" text-anchor="middle">niet aangesloten</text>`}
      ${aantal ? `<g class="badge"><circle cx="${(k.x + k.r * 0.72).toFixed(1)}" cy="${(k.y - k.r * 0.72).toFixed(1)}" r="9.5"/><text x="${(k.x + k.r * 0.72).toFixed(1)}" y="${(k.y - k.r * 0.72 + 3.5).toFixed(1)}" text-anchor="middle">${aantal}</text></g>` : ""}
    </g>`;
  }
  $kaart.innerHTML = s;
}
$kaart.addEventListener("click", (e) => { const g = e.target.closest(".knoop"); if (g) navigeer(g); });
$kaart.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { const g = e.target.closest(".knoop"); if (g) { e.preventDefault(); navigeer(g); } } });
function navigeer(g) {
  staat.zicht = g.dataset.doel === "jou" ? { soort: "jarvis", tab: "jou" } : { soort: "project", id: g.dataset.id, tab: "jou" };
  bewaarZicht(); render();
  if (window.innerWidth < 900) $inhoud.scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ---------- items ---------- */
const VRIJ_VERPLICHT = new Set(["beslist"]);

function antwoordStatusHtml(antwoord) {
  const verwerkt = antwoord.status === "verwerkt";
  const keuzeLabel = antwoord.keuze_label ?? antwoord.keuze;
  return `<div class="antwoordstatus">
    <div class="rij"><span class="chip ${verwerkt ? "ok" : "wacht"}">${verwerkt ? "verwerkt" : "wacht op Jarvis"}</span><strong>${esc(keuzeLabel)}</strong>${antwoord.notitie ? `<span>— ${esc(antwoord.notitie)}</span>` : ""}<span class="mono">${esc(datumKort(antwoord.op))} ${esc(tijd(antwoord.op))}</span></div>
    ${verwerkt && antwoord.verwerking ? `<div class="verw">${inlineMd(antwoord.verwerking)}${antwoord.verwerkt_op ? ` <span class="mono">${esc(datumKort(antwoord.verwerkt_op))} ${esc(tijd(antwoord.verwerkt_op))}</span>` : ""}</div>` : ""}
    ${!verwerkt ? `<div class="rij"><span style="color:var(--gedempt);font-size:13px">Opgeslagen. Jarvis pakt dit op zodra een sessie draait; het resultaat verschijnt hier.</span></div>` : ""}
    <div class="rij"><button class="knop stil" data-actie="ongedaan" data-id="${esc(antwoord.item_id)}">${verwerkt ? "Verwijderen uit overzicht" : "Ongedaan maken"}</button></div>
  </div>`;
}

function itemHtml(item, metProject) {
  const antwoord = staat.antwoorden.get(item.id);
  const open = staat.open.has(item.id);
  const project = staat.overzicht.projecten.find((p) => p.id === item.project);
  const opties = item.opties ?? [];
  const adviesKeuze = item.advies ? (opties.find((o) => new RegExp(`^${o.keuze.replace(/-/g, "[ -]")}\\b`, "i").test(item.advies.normalize("NFD").replace(/[̀-ͯ]/g, ""))) ?? null) : null;
  let uit = "";
  if (open) {
    uit += `<div class="itemuit">
      ${item.toelichting ? `<div class="blok"><span class="eyebrow">Wat er speelt</span><p>${inlineMd(item.toelichting)}</p></div>` : ""}
      ${item.waarom ? `<div class="blok"><span class="eyebrow">Waarom dit bij jou ligt</span><p>${inlineMd(item.waarom)}</p></div>` : ""}`;
    if (antwoord) {
      uit += antwoordStatusHtml(antwoord);
    } else if (!staat.db) {
      uit += `<div class="antwoordstatus"><span style="color:var(--gedempt)">Antwoorden kan alleen met verbinding met de Jarvis-gegevens.</span></div>`;
    } else {
      uit += `<div class="blok"><span class="eyebrow">Je keuzes, en wat er dan gebeurt</span>
        <div class="opties">${opties.map((o) => `<button class="optie ${adviesKeuze && adviesKeuze.keuze === o.keuze ? "advies" : ""}" data-actie="antwoord" data-id="${esc(item.id)}" data-keuze="${esc(o.keuze)}" data-label="${esc(o.label)}" ${VRIJ_VERPLICHT.has(o.keuze) ? 'data-vereist="1"' : ""}>
            <span class="lbl">${esc(o.label)}${adviesKeuze && adviesKeuze.keuze === o.keuze ? `<span class="adv">advies</span>` : ""}</span>
            <span class="kies">kies</span>
            <span class="gevolg">${inlineMd(o.gevolg)}</span>
          </button>`).join("")}</div>
        ${item.advies ? `<div class="adviestekst"><span class="eyebrow">Advies van Jarvis</span>${inlineMd(item.advies)}</div>` : ""}
        <div class="antwoordvak"><textarea placeholder="${opties.some((o) => VRIJ_VERPLICHT.has(o.keuze)) ? "Je beslissing in je eigen woorden (verplicht bij 'Beslissing vastleggen')" : "Toelichting voor Jarvis (optioneel)"}" data-notitie="${esc(item.id)}" aria-label="Toelichting"></textarea></div>
      </div>`;
    }
    uit += `<div class="bron">bron: ${esc(item.bron)}</div></div>`;
  }
  return `<article class="item u-${esc(item.urgentie)} ${antwoord ? "beantwoord" : ""} ${open ? "open" : ""}" id="item-${esc(item.id)}">
    <button class="kopknop" data-actie="toggle" data-id="${esc(item.id)}" aria-expanded="${open}">
      <div class="itemmeta"><span class="chip soort-${esc(item.soort)}">${esc(SOORT[item.soort] ?? item.soort)}</span>${metProject && project ? `<span class="chip project">${esc(project.naam)}</span>` : ""}${antwoord ? `<span class="chip ${antwoord.status === "verwerkt" ? "ok" : "wacht"}">${antwoord.status === "verwerkt" ? "verwerkt" : "wacht op Jarvis"}</span>` : ""}</div>
      <div class="itemtitel">${esc(item.titel)}</div>
    </button>${uit}</article>`;
}

function voorJouHtml(items, metProject) {
  const openItems = items.filter((i) => !staat.antwoorden.has(i.id));
  const klaar = items.filter((i) => staat.antwoorden.has(i.id));
  let s = openItems.length
    ? `<div class="lijst">${openItems.map((i) => itemHtml(i, metProject)).join("")}</div>`
    : `<div class="paneel leeg"><strong>Niets open</strong>Er ligt op dit moment geen beslissing of actie bij jou.</div>`;
  if (klaar.length) s += `<div class="sectie"><div class="sectiekop"><h2 style="font-size:15px">Beantwoord</h2><span class="tel">${klaar.filter((i) => staat.antwoorden.get(i.id).status !== "verwerkt").length} wachten · ${klaar.filter((i) => staat.antwoorden.get(i.id).status === "verwerkt").length} verwerkt</span></div><div class="lijst">${klaar.map((i) => itemHtml(i, metProject)).join("")}</div></div>`;
  return s;
}

/* ---------- overzicht (Jarvis centraal) ---------- */
function overzichtHtml() {
  const o = staat.overzicht;
  const open = o.voor_jou.filter((i) => !staat.antwoorden.has(i.id));
  const hoog = open.filter((i) => i.urgentie === "hoog").length;
  const totaalCommits = o.projecten.reduce((n, p) => n + p.recent.length, 0);
  return `
    <div class="sectie">
      <div class="sectiekop"><h2>Voor jou</h2><span class="tel">${open.length} open${hoog ? ` · ${hoog} hoog` : ""}</span></div>
      ${voorJouHtml(o.voor_jou, true)}
    </div>
    <div class="sectie">
      <div class="sectiekop"><h2>Beweging</h2><span class="tel">${totaalCommits} commits · ${RECENT_DAGEN} dagen</span></div>
      <div class="lijst">${o.projecten.map((p) => {
        const laatste = p.recent[0];
        const taken = p.taken.filter((t) => t.status !== "afgerond");
        return `<article class="item">
          <button class="kopknop" data-actie="project" data-id="${esc(p.id)}">
            <div class="itemmeta"><span class="chip project">${esc(p.naam)}</span>${p.aangesloten ? "" : `<span class="chip">niet aangesloten</span>`}${taken.length ? `<span class="chip">${taken.length} ${taken.length === 1 ? "taak" : "taken"}</span>` : ""}</div>
            <div class="itemtitel">${laatste ? esc(laatste.onderwerp) : "Geen beweging in de laatste 14 dagen"}</div>
            ${laatste ? `<div class="bron">${esc(dagLabel(laatste.datum))} ${esc(tijd(laatste.datum))} · ${p.recent.length} commits · ${p.hoofdbranch ? esc(p.hoofdbranch.naam) + " @ " + esc(p.hoofdbranch.commit) : "geen hoofdbranch"}</div>` : ""}
          </button></article>`;
      }).join("")}</div>
    </div>`;
}

/* ---------- projectpaneel ---------- */
function projectHtml(p, tab) {
  const open = p.aandacht.filter((a) => !staat.antwoorden.has(a.id)).length;
  const stand = p.stand;
  const taken = p.taken;
  const kennis = Object.entries(p.kennis ?? {}).filter(([, n]) => n > 0);
  const tabs = [["jou", "Voor jou", open], ["stand", "Stand", stand.length], ["recent", "Recent", p.recent.length], ["taken", "Taken", taken.length]];
  let lichaam = "";
  if (tab === "jou") lichaam = voorJouHtml(p.aandacht, false);
  else if (tab === "stand") {
    lichaam = stand.length
      ? stand.map((s, i) => `<details class="stand" ${i === 0 ? "open" : ""}><summary>${esc(s.kop)}</summary><div class="md">${md(s.tekst)}</div></details>`).join("")
      : `<div class="paneel leeg"><strong>Geen statusdocument</strong>${p.aangesloten ? "Dit project heeft nog geen CURRENT_STATE." : "Sluit dit project op Jarvis aan om hier de stand van zaken te zien."}</div>`;
    if (p.feiten?.length) lichaam += `<div class="tegels" style="margin-top:12px">${p.feiten.filter((f) => f.feit !== "Hoofdbranch").map((f) => `<div class="paneel tegel"><span class="eyebrow">${esc(f.feit)}</span><div class="mono" style="font-size:13px;overflow-wrap:anywhere">${esc(f.waarde)}</div></div>`).join("")}</div>`;
  } else if (tab === "recent") {
    const alles = staat.toonAlles.has(p.id);
    const lijst = alles ? p.recent : p.recent.slice(0, 30);
    let dag = null;
    lichaam = lijst.map((c) => {
      const label = dagLabel(c.datum);
      const kop = label !== dag ? `<div class="dag"><span class="eyebrow">${esc(label)}</span></div>` : "";
      dag = label;
      return `${kop}<div class="commit ${c.soort === "merge" ? "merge" : ""}"><span class="hash">${esc(c.hash)}</span><span class="ond">${esc(c.onderwerp)}</span>${c.rol || c.soort === "merge" ? `<span class="rol">${c.rol ? `<span class="chip">${esc(c.rol)}</span>` : ""}${c.soort === "merge" ? `<span class="chip">merge</span>` : ""}</span>` : ""}</div>`;
    }).join("");
    if (!lijst.length) lichaam = `<div class="paneel leeg"><strong>Geen beweging</strong>Niets in de laatste ${RECENT_DAGEN} dagen.</div>`;
    else if (!alles && p.recent.length > 30) lichaam += `<button class="meer" data-actie="alles" data-id="${esc(p.id)}">Toon alle ${p.recent.length} commits</button>`;
  } else if (tab === "taken") {
    lichaam = taken.length
      ? taken.map((t) => taakHtml(t, p.id)).join("")
      : `<div class="paneel leeg"><strong>Geen taakdossiers</strong>${p.aangesloten ? "Er staat geen taak open." : "Taken bestaan pas als dit project op Jarvis is aangesloten."}</div>`;
  }
  const lopend = taken.filter((t) => t.status !== "afgerond" && t.stappen?.length);
  if (tab === "jou" && lopend.length) lichaam = `<div class="sectie" style="margin-top:0"><div class="sectiekop"><h2 style="font-size:15px">Wat Jarvis doet</h2><span class="tel">${lopend.length} ${lopend.length === 1 ? "taak" : "taken"}</span></div>${lopend.map((t) => taakHtml(t, p.id)).join("")}</div><div class="sectie"><div class="sectiekop"><h2 style="font-size:15px">Voor jou</h2><span class="tel">${open} open</span></div>${lichaam}</div>`;
  return `
    <button class="terug" data-actie="jou">← Alles</button>
    <div class="projkop">
      <h2>${esc(p.naam)}</h2>
      <div class="sub">
        ${p.hoofdbranch ? `<span>${esc(p.hoofdbranch.naam)} @ ${esc(p.hoofdbranch.commit)} · ${esc(datumKort(p.hoofdbranch.datum))}</span>` : `<span>geen hoofdbranch gevonden</span>`}
        <span>${p.aangesloten ? "aangesloten op Jarvis" : "niet aangesloten op Jarvis"}</span>
      </div>
    </div>
    <div class="tegels">
      <div class="paneel tegel"><span class="eyebrow">Voor jou</span><div class="n">${open}</div></div>
      <div class="paneel tegel"><span class="eyebrow">Beweging</span><div class="n">${p.recent.length}<small>/ ${RECENT_DAGEN} d</small></div></div>
      <div class="paneel tegel"><span class="eyebrow">Taken</span><div class="n">${taken.filter((t) => t.status !== "afgerond").length}</div></div>
      ${kennis.length ? `<div class="paneel tegel"><span class="eyebrow">Kennis</span><div class="n mono" style="font-size:13px;font-weight:500;line-height:1.5;font-family:var(--mono)">${kennis.map(([k, n]) => `${esc(k)} ${n}`).join(" · ")}</div></div>` : ""}
    </div>
    <div class="tabs" role="tablist">${tabs.map(([id, l, n]) => `<button class="tab" role="tab" aria-selected="${tab === id}" data-actie="tab" data-tab="${id}">${l}<span class="tel">${n}</span></button>`).join("")}</div>
    <div>${lichaam}</div>`;
}

function taakHtml(t, projectId) {
  const stappen = t.stappen ?? [];
  const gedaan = stappen.filter((x) => x.gedaan).length;
  const eersteOpen = stappen.findIndex((x) => !x.gedaan);
  return `<div class="taak"><div class="kopregel"><div><div class="id">${esc(t.id)}</div><div class="t">${esc(t.titel)}</div></div><div class="r"><span class="chip">${esc(t.status)}</span>${t.klasse ? `<span class="chip">klasse ${esc(t.klasse)}</span>` : ""}</div></div>
    ${stappen.length ? `<div class="voortgang"><div class="mono" style="font-size:11.5px;color:var(--gedempt)">${gedaan} van ${stappen.length} stappen</div><div class="balk"><i style="width:${Math.round((gedaan / stappen.length) * 100)}%"></i></div>${stappen.map((x, i) => `<div class="stap ${x.gedaan ? "gedaan" : i === eersteOpen ? "nu" : "open"}"><span class="vink">${x.gedaan ? "■" : i === eersteOpen ? "▶" : "□"}</span><span>${inlineMd(x.tekst)}</span></div>`).join("")}</div>` : ""}
    ${t.gastheer && t.gastheer !== projectId ? `<div class="gast">dossier en commits in ${esc(t.gastheer)}</div>` : ""}</div>`;
}

/* ---------- Jarvis zelf ---------- */
function jarvisHtml(tab) {
  const o = staat.overzicht;
  const j = staat.jarvis;
  const tabs = [["jou", "Voor jou", o.voor_jou.filter((i) => !staat.antwoorden.has(i.id)).length], ["activiteit", "Activiteit", (j?.agenten?.length ?? 0) + 1], ["gesprek", "Gesprek", staat.berichten.length]];
  let lichaam = "";
  if (tab === "jou") lichaam = overzichtHtml();
  else if (tab === "activiteit") lichaam = activiteitHtml();
  else lichaam = gesprekHtml();
  const live = jarvisLive();
  return `
    <div class="projkop">
      <h2>Jarvis</h2>
      <div class="sub"><span>${live.tekst}</span>${j?.sessie?.model ? `<span>${esc(j.sessie.model)}</span>` : ""}</div>
    </div>
    <div class="tabs" role="tablist">${tabs.map(([id, l, n]) => `<button class="tab" role="tab" aria-selected="${tab === id}" data-actie="tab" data-tab="${id}">${l}<span class="tel">${n}</span></button>`).join("")}</div>
    <div>${lichaam}</div>`;
}

/* Is er nu een sessie? Alleen wat de sessie zelf de laatste tien minuten heeft geschreven telt. */
function jarvisLive() {
  const j = staat.jarvis;
  const laatste = j?.sessie?.laatste ? Date.now() - new Date(j.sessie.laatste).getTime() : Infinity;
  if (laatste < 10 * 6e4) return { live: true, bezig: !!j.sessie.bezig_met, tekst: j.sessie.bezig_met ? `bezig: ${j.sessie.bezig_met}` : "sessie actief, wacht op jou" };
  if (j?.sessie?.laatste) return { live: false, bezig: false, tekst: `geen sessie actief · laatst gezien ${relatief(j.sessie.laatste)}` };
  return { live: false, bezig: false, tekst: "geen sessie gezien" };
}

function activiteitHtml() {
  const j = staat.jarvis;
  const live = jarvisLive();
  const o = staat.overzicht;
  let s = `<div class="sectie" style="margin-top:0"><div class="sectiekop"><h2 style="font-size:15px">Sessie en agents</h2><span class="tel">${live.live ? "live" : "offline"}</span></div>`;
  s += `<div class="agent ${live.bezig ? "bezig" : live.live ? "actief" : ""}"><span class="naam"><span class="dot"></span>${esc(j?.sessie?.naam ?? "Jarvis")}</span><span class="mono" style="font-size:11px;color:var(--gedempt)">${esc(j?.sessie?.rol ?? "orchestrator")}</span>
    <span class="wat">${esc(live.tekst)}</span>
    <span class="meta">${j?.sessie?.model ? esc(j.sessie.model) + " · " : ""}${j?.sessie?.sinds ? "sinds " + esc(datumKort(j.sessie.sinds)) + " " + esc(tijd(j.sessie.sinds)) : ""}${j?.sessie?.laatste ? " · laatste update " + esc(tijd(j.sessie.laatste)) : ""}</span></div>`;
  for (const a of j?.agenten ?? []) {
    s += `<div class="agent ${a.status === "bezig" ? "bezig" : a.status === "klaar" ? "" : "actief"}"><span class="naam"><span class="dot"></span>${esc(a.naam)}</span><span class="mono" style="font-size:11px;color:var(--gedempt)">${esc(a.rol ?? "")}</span><span class="wat">${esc(a.wat ?? "")}</span><span class="meta">${esc(a.status ?? "")}${a.taak ? " · " + esc(a.taak) : ""}${a.op ? " · " + esc(datumKort(a.op)) + " " + esc(tijd(a.op)) : ""}</span></div>`;
  }
  if (!(j?.agenten ?? []).length) s += `<p style="color:var(--gedempt);font-size:13.5px;padding:0 4px">Geen losse agents actief. Jarvis start die alleen voor afgebakend werk (een onafhankelijke QA-ronde, een verkenning) en meldt ze hier zodra ze lopen.</p>`;
  s += `<p style="color:var(--zacht);font-family:var(--mono);font-size:11px;padding:8px 4px 0">Eén model, vijf rollen. Alles wat Jarvis doet landt als commit onder één rol; er werkt geen andere AI mee.</p></div>`;
  // Werk per rol, 14 dagen, over alle projecten
  const perRol = new Map();
  for (const p of o.projecten) for (const c of p.recent) { const r = c.rol ?? (c.soort === "merge" ? "merge" : "zonder rol"); const e = perRol.get(r) ?? { n: 0, laatste: null, project: p.naam }; e.n += 1; if (!e.laatste) { e.laatste = c; e.project = p.naam; } perRol.set(r, e); }
  const rollen = [...perRol.entries()].sort((a, b) => b[1].n - a[1].n);
  s += `<div class="sectie"><div class="sectiekop"><h2 style="font-size:15px">Werk per rol</h2><span class="tel">${RECENT_DAGEN} dagen</span></div>${rollen.map(([rol, e]) => `<div class="rolrij"><span class="rol">${esc(rol)}</span><span class="n">${e.n} commits</span><span class="n">${esc(e.project)}</span><span class="ond">laatste: ${esc(e.laatste.onderwerp)} <span class="mono">${esc(e.laatste.hash)} · ${esc(dagLabel(e.laatste.datum))}</span></span></div>`).join("")}</div>`;
  if (staat.signaalInfo) s += `<div class="sectie"><div class="sectiekop"><h2 style="font-size:15px">Laatste signaal</h2></div><p class="mono" style="font-size:12px;color:var(--gedempt);padding:0 4px">${esc(staat.signaalInfo)}</p></div>`;
  return s;
}

function gesprekHtml() {
  const live = jarvisLive();
  const berichten = [...staat.berichten].sort((a, b) => String(a.op).localeCompare(String(b.op))).slice(-60);
  let s = `<div class="gesprek">${berichten.length ? berichten.map((b) => `<div class="bericht ${b.van === "jarvis" ? "jarvis" : "eigenaar"} ${b.status === "nieuw" && b.van !== "jarvis" ? "wacht" : ""}"><span class="van">${b.van === "jarvis" ? "Jarvis" : "Jij"}<span class="tijd">${esc(datumKort(b.op))} ${esc(tijd(b.op))}${b.van !== "jarvis" && b.status === "nieuw" ? " · wacht op Jarvis" : ""}</span></span>${inlineMd(b.tekst)}</div>`).join("") : `<div class="paneel leeg"><strong>Nog geen gesprek</strong>Stel een vraag of geef een opdracht. ${live.live ? "Er is een sessie actief; Jarvis antwoordt hier." : "Er is nu geen sessie actief; je bericht wacht tot de volgende."}</div>`}</div>`;
  s += `<div class="invoer"><textarea id="bericht-invoer" placeholder="${live.live ? "Zeg het maar…" : "Bericht voor de volgende sessie…"}" aria-label="Bericht aan Jarvis"></textarea>${"SpeechRecognition" in window || "webkitSpeechRecognition" in window ? `<button class="knop mic ${staat.luistert ? "aan" : ""}" data-actie="mic" aria-label="Spreek">${staat.luistert ? "● luistert" : "🎙 spreek"}</button>` : ""}<button class="knop" data-actie="verstuur">Verstuur</button></div>`;
  const stemmen = ("speechSynthesis" in window) ? speechSynthesis.getVoices().filter((v) => /^nl/i.test(v.lang)) : [];
  s += `<div class="stemregel"><label><input type="checkbox" data-actie="stem-aan" ${staat.stem.aan ? "checked" : ""}> Jarvis leest antwoorden voor</label>${stemmen.length ? `<label>stem <select data-actie="stem-kies">${stemmen.map((v) => `<option value="${esc(v.name)}" ${v.name === staat.stem.naam ? "selected" : ""}>${esc(v.name)}</option>`).join("")}</select></label>` : `<span>geen Nederlandse stem in deze browser</span>`}<span>bericht wekt de sessie zoals een antwoord</span></div>`;
  return s;
}

/* ---------- stem ---------- */
function spreek(tekst) {
  if (!staat.stem.aan || !("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(String(tekst).replace(/[`*_#]/g, ""));
  u.lang = "nl-NL"; u.rate = 0.98; u.pitch = 0.85;
  const v = speechSynthesis.getVoices().find((x) => x.name === staat.stem.naam) ?? speechSynthesis.getVoices().find((x) => /^nl/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
let herkenner = null;
function luister() {
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) return;
  if (staat.luistert) { herkenner?.stop(); return; }
  herkenner = new R(); herkenner.lang = "nl-NL"; herkenner.interimResults = true; herkenner.continuous = false;
  const vak = document.getElementById("bericht-invoer");
  const basis = vak ? vak.value : "";
  herkenner.onresult = (e) => { let t = ""; for (const r of e.results) t += r[0].transcript; const v = document.getElementById("bericht-invoer"); if (v) v.value = (basis ? basis + " " : "") + t; };
  herkenner.onend = () => { staat.luistert = false; render(); };
  herkenner.onerror = () => { staat.luistert = false; render(); };
  staat.luistert = true; herkenner.start(); render();
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => { if (staat.zicht.soort === "jarvis" && staat.zicht.tab === "gesprek") render(); };

/* ---------- render ---------- */
function render() {
  const o = staat.overzicht;
  if (!o) return;
  tekenKaart();
  let s = "";
  if (staat.dbFout) s += `<div class="melding fout">${esc(staat.dbFout)}</div>`;
  const leeftijdDagen = (Date.now() - new Date(o.gegenereerd_op).getTime()) / 864e5;
  if (leeftijdDagen > 3) s += `<div class="melding">Deze stand is ${Math.floor(leeftijdDagen)} dagen oud. Laat Jarvis <span class="mono">jarvis overzicht</span> draaien voor een verse.</div>`;
  if (staat.zicht.soort === "project") {
    const p = o.projecten.find((x) => x.id === staat.zicht.id);
    s += p ? projectHtml(p, staat.zicht.tab ?? "jou") : overzichtHtml();
  } else if (staat.zicht.soort === "jarvis") s += jarvisHtml(staat.zicht.tab ?? "jou");
  else s += overzichtHtml();
  s += `<div class="voet">Alles hier is afgeleid uit de repositories; GitHub blijft de bron van waarheid. Een antwoord landt bij Jarvis en wordt door een sessie verwerkt langs de gewone weg — pull request, review, record. Stand gegenereerd ${esc(datumKort(o.gegenereerd_op))} ${esc(tijd(o.gegenereerd_op))}.</div>`;
  $inhoud.innerHTML = s;
  const wachten = [...staat.antwoorden.values()].filter((a) => a.status !== "verwerkt").length + staat.berichten.filter((b) => b.van !== "jarvis" && b.status === "nieuw").length;
  const live = jarvisLive();
  $status.innerHTML = `<span class="dot ${live.bezig || wachten ? "bezig" : live.live ? "" : "uit"}"></span><b>${live.bezig ? esc(live.tekst) : wachten ? `${wachten} bij Jarvis` : live.live ? "sessie actief" : "geen sessie"}</b><br><span class="${leeftijdDagen > 3 ? "oud" : ""}">stand ${esc(relatief(o.gegenereerd_op))}</span>${staat.signaal ? `<br>${esc(staat.signaal)}` : ""}`;
  const vak = document.getElementById("bericht-invoer");
  if (vak && staat.concept) { vak.value = staat.concept; }
  document.getElementById("kop-versie").textContent = `v${o.versie ?? 1}`;
}

$inhoud.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-actie]"); if (!el) return;
  const actie = el.dataset.actie, id = el.dataset.id;
  if (actie === "toggle") { staat.open.has(id) ? staat.open.delete(id) : staat.open.add(id); render(); return; }
  if (actie === "project") { staat.zicht = { soort: "project", id, tab: "jou" }; bewaarZicht(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  if (actie === "jou") { staat.zicht = { soort: "jou" }; bewaarZicht(); render(); return; }
  if (actie === "verstuur") { const vak = document.getElementById("bericht-invoer"); const tekst = vak ? vak.value.trim() : ""; if (!tekst) { vak?.focus(); return; } el.disabled = true; staat.concept = ""; await verstuurBericht(tekst); return; }
  if (actie === "mic") { luister(); return; }
  if (actie === "tab") { staat.zicht.tab = el.dataset.tab; bewaarZicht(); render(); return; }
  if (actie === "alles") { staat.toonAlles.add(id); render(); return; }
  if (actie === "ongedaan") { await verwijderAntwoord(id); return; }
  if (actie === "antwoord") {
    const vak = $inhoud.querySelector(`textarea[data-notitie="${CSS.escape(id)}"]`);
    const notitie = vak ? vak.value.trim() : "";
    if (el.dataset.vereist && !notitie) { vak?.focus(); vak?.setAttribute("placeholder", "Schrijf eerst je beslissing op, dan kiezen"); return; }
    for (const b of $inhoud.querySelectorAll(`.optie[data-id="${CSS.escape(id)}"]`)) b.disabled = true;
    await bewaarAntwoord(id, el.dataset.keuze, el.dataset.label, notitie);
  }
});

$inhoud.addEventListener("change", (e) => {
  const el = e.target.closest("[data-actie]"); if (!el) return;
  if (el.dataset.actie === "stem-aan") { staat.stem.aan = el.checked; bewaarStem(); if (el.checked) spreek("Jarvis online."); }
  if (el.dataset.actie === "stem-kies") { staat.stem.naam = el.value; bewaarStem(); spreek("Zo klink ik."); }
});
$inhoud.addEventListener("input", (e) => { if (e.target.id === "bericht-invoer") staat.concept = e.target.value; });

/* ---------- gegevens ---------- */
const docId = (itemId) => itemId.replace(/[^A-Za-z0-9_\-.~:@+]/g, "_");
const vindItem = (itemId) => staat.overzicht.voor_jou.find((i) => i.id === itemId) ?? staat.overzicht.projecten.flatMap((p) => p.aandacht).find((i) => i.id === itemId);

/* Het signaal: één klein bestand naast de pagina, opnieuw gepubliceerd na een
   antwoord. Dat is de enige weg waarlangs een lopende Jarvis-sessie wakker
   wordt; de pagina zelf verandert er niet door en herlaadt niet. */
let signaalTimer = null;
function meldJarvis(reden) {
  if (!staat.artifact) return;
  clearTimeout(signaalTimer);
  signaalTimer = setTimeout(async () => {
    const wachten = [...staat.antwoorden.values()].filter((a) => a.status !== "verwerkt").map((a) => a.item_id);
    const berichten = staat.berichten.filter((b) => b.van !== "jarvis" && b.status === "nieuw").length;
    try {
      await staat.artifact.publish({ "signaal.json": { content: JSON.stringify({ op: new Date().toISOString(), reden, wachten, berichten }, null, 2), contentType: "application/json" } });
      staat.signaal = "Jarvis gewekt";
    } catch (err) {
      staat.signaal = err?.code === "capability_disabled" ? "wekken hier niet mogelijk" : `wekken mislukt (${err?.code ?? "onbekend"})`;
    }
    render();
    setTimeout(() => { staat.signaal = ""; render(); }, 6000);
  }, 2500);
}

async function bewaarAntwoord(itemId, keuze, keuzeLabel, notitie) {
  const item = vindItem(itemId);
  const antwoord = { item_id: itemId, project: item?.project ?? null, soort: item?.soort ?? null, titel: item?.titel ?? null, bron: item?.bron ?? null, keuze, keuze_label: keuzeLabel, notitie, op: new Date().toISOString(), status: "nieuw", overzicht_van: staat.overzicht.gegenereerd_op };
  try { await staat.db.doc(`antwoorden/${docId(itemId)}`).set(antwoord); staat.antwoorden.set(itemId, antwoord); staat.dbFout = null; meldJarvis(`antwoord ${itemId}`); }
  catch (err) { staat.dbFout = `Antwoord niet opgeslagen (${err?.code ?? "onbekend"}). Probeer het opnieuw.`; }
  render();
}
async function verstuurBericht(tekst) {
  const bericht = { van: "eigenaar", tekst, op: new Date().toISOString(), status: "nieuw", zicht: staat.zicht };
  try { await staat.db.collection("berichten").add(bericht); staat.dbFout = null; meldJarvis("bericht"); }
  catch (err) { staat.dbFout = `Bericht niet verzonden (${err?.code ?? "onbekend"}).`; staat.concept = tekst; }
  render();
}
async function verwijderAntwoord(itemId) {
  try { await staat.db.doc(`antwoorden/${docId(itemId)}`).delete(); staat.antwoorden.delete(itemId); staat.dbFout = null; meldJarvis(`ingetrokken ${itemId}`); }
  catch (err) { staat.dbFout = `Antwoord niet verwijderd (${err?.code ?? "onbekend"}).`; }
  render();
}

async function start() {
  let db = null;
  try { db = window.claude?.use ? await window.claude.use("db") : null; } catch { db = null; }
  staat.db = db;
  if (!db) {
    $inhoud.innerHTML = `<div class="paneel leeg" style="margin-top:18px"><strong>Geen verbinding</strong>Open deze pagina op claude.ai met je eigen account; daar staat het overzicht dat Jarvis vult.</div>`;
    $status.innerHTML = `<span class="dot uit"></span>geen gegevens`;
    return;
  }
  window.claude.use("artifact").then((a) => { staat.artifact = a; }).catch(() => { staat.artifact = null; });
  db.doc("overzicht/huidig").onSnapshot((snap) => {
    if (!snap.exists) {
      $inhoud.innerHTML = `<div class="paneel leeg" style="margin-top:18px"><strong>Nog geen overzicht</strong>Jarvis heeft dit overzicht nog niet gevuld. Laat <span class="mono">jarvis overzicht</span> draaien en de uitkomst naar <span class="mono">overzicht/huidig</span> schrijven.</div>`;
      $status.innerHTML = `<span class="dot uit"></span>leeg`; return;
    }
    const data = snap.data();
    staat.overzicht = { versie: data.versie, gegenereerd_op: data.gegenereerd_op, projecten: data.projecten ?? [], voor_jou: data.voor_jou ?? [] };
    render();
  }, (err) => { staat.dbFout = `Overzicht niet te lezen (${err.code}).`; if (staat.overzicht) render(); else $inhoud.innerHTML = `<div class="melding fout" style="margin-top:18px">${esc(staat.dbFout)}</div>`; });
  db.doc("jarvis/status").onSnapshot((snap) => { staat.jarvis = snap.exists ? snap.data() : null; render(); }, () => { /* geen status: offline */ });
  db.collection("berichten").onSnapshot((snap) => {
    staat.berichten = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((b) => b.tekst);
    const laatsteJarvis = [...staat.berichten].filter((b) => b.van === "jarvis").sort((a, b) => String(a.op).localeCompare(String(b.op))).pop();
    if (laatsteJarvis && laatsteJarvis.id !== staat.laatstVoorgelezen && !snap.metadata?.fromCache) { if (staat.laatstVoorgelezen) spreek(laatsteJarvis.tekst); staat.laatstVoorgelezen = laatsteJarvis.id; }
    render();
  }, (err) => { staat.dbFout = `Gesprek niet te lezen (${err.code}).`; render(); });
  db.collection("antwoorden").onSnapshot((snap) => {
    staat.antwoorden = new Map();
    for (const d of snap.docs) { const a = d.data(); if (a?.item_id) staat.antwoorden.set(a.item_id, a); }
    render();
  }, (err) => { staat.dbFout = `Antwoorden niet te lezen (${err.code}).`; render(); });
}
start();
})();
</script>
