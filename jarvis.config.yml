# Jarvis — configuratie van de engine-repository zelf.
#
# De engine is óók een project onder Jarvis: dezelfde poort, dezelfde regels.
# Wat hier staat gaat over deze repository; een consumer (een product dat de
# engine als afhankelijkheid neemt) heeft zijn eigen bestand en verder niets.

project: jarvis-engine
enabled: true

knowledge_map: knowledge
taken_map: tasks
current_state: docs/CURRENT_STATE.md
project_kaart: project/PROJECT.md

budget:
  S: 8000
  M: 20000
  L: 40000

limieten:
  qa_rondes: 3
  subagenten: 12
  besluiten_per_taak: 1
  nieuwe_dec_per_taak: 3
  wallclock_minuten: 60

context_nooit:
  - package-lock.json
  - "**/*.tsbuildinfo"
  - "**/node_modules/**"

context_symbolen: []
context_fragment_regels: 400

# De engine is gereedschap zonder projectkennis; de sanitizer scant alles wat
# mensen lezen en alles wat een consumer meekrijgt. Bewust NIET tests/: die
# bevatten de fictieve testdata waarmee de scanner zelf wordt getest.
sanitize_paden:
  - knowledge
  - tasks
  - project
  - docs
  - jarvis
  - bin
  - .github
  - README.md
  - CLAUDE.md

status_paden:
  - jarvis/src
  - jarvis/canonical
  - bin
  - package.json
  - .github/workflows

test_pad: tests

# De rolcontrole bindt vanaf de commit die deze repository als eigen project
# inricht. De historie daarvoor is de afgesplitste geschiedenis uit het
# project waarin de engine is gebouwd; die commits zijn daar al getoetst.
rol_controle_vanaf: "6cf25531ba80bd192b6539fb13897aab684920dd"

branch_voorvoegsel: jarvis/

# Attestatie (DEC-0043): waar de attestatieworkflow het akkoord van de
# eigenaar leest. URL en publishable key zijn publieke identifiers van de
# eigen database van Jarvis (ze staan in elke browser die de interface
# opent); de rechten zitten in RLS en in de leesbeelden, niet in de sleutel.
attestatie:
  url: https://mfjuaiezjtjdhahvwqzn.supabase.co
  sleutel: sb_publishable_y3QWqIKhgbuUGsXSivbG0Q_RtZgJ_b9
  bot: tovas-jarvis-bot
  extra_paden: []

rollen_map: jarvis/roles
