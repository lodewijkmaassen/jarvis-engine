<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Jarvis V3</title>
<style>
  :root { --bg:#f6f6f3; --kaart:#fff; --tekst:#1b1b19; --gedempt:#6b6b66; --lijn:#e2e1da; --accent:#1f5eff; --goed:#17794a; --fout:#b3261e; --wacht:#9a6b00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --kaart:#1d1d1b; --tekst:#efeee8; --gedempt:#a2a19a; --lijn:#2f2f2b; --accent:#7ea2ff; --goed:#5fd09a; --fout:#ff8a80; --wacht:#f0c05a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--tekst); font:16px/1.45 system-ui, sans-serif; padding:0 16px 48px; }
  main { max-width:760px; margin:0 auto; }
  h1 { font-size:20px; margin:20px 0 4px; } h2 { font-size:15px; margin:28px 0 8px; text-transform:uppercase; letter-spacing:.04em; color:var(--gedempt); }
  .kaart { background:var(--kaart); border:1px solid var(--lijn); border-radius:12px; padding:14px 16px; margin:10px 0; }
  .kaart h3 { margin:0 0 6px; font-size:16px; } .klein { color:var(--gedempt); font-size:13.5px; }
  .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--lijn); margin-left:6px; }
  .KLAAR { color:var(--goed); border-color:var(--goed); } .MISLUKT { color:var(--fout); border-color:var(--fout); }
  .AKKOORD_NODIG, .BESLISSING_NODIG { color:var(--wacht); border-color:var(--wacht); }
  button { font:inherit; padding:9px 14px; border-radius:9px; border:1px solid var(--lijn); background:var(--kaart); color:var(--tekst); cursor:pointer; margin:8px 8px 0 0; }
  button.hoofd { background:var(--accent); border-color:var(--accent); color:#fff; } button:disabled { opacity:.5; }
  input, textarea { font:inherit; width:100%; padding:9px 10px; border-radius:9px; border:1px solid var(--lijn); background:var(--kaart); color:var(--tekst); margin:6px 0; }
  ul { margin:6px 0 6px 18px; padding:0; } .melding { padding:10px 12px; border-radius:9px; border:1px solid var(--fout); color:var(--fout); margin:10px 0; }
  .leeg { color:var(--gedempt); padding:6px 0; }
</style>
</head>
<body>
<main>
  <h1>Jarvis V3</h1>
  <div id="status" class="klein">laden…</div>
  <div id="melding"></div>
  <div id="inhoud"></div>
</main>
<script src="../config.js"></script>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const lijst = (a) => `<ul>${(Array.isArray(a) ? a : []).map((x) => `<li>${esc(typeof x === "string" ? x : x.omschrijving ?? JSON.stringify(x))}</li>`).join("")}</ul>`;
  let client = null;
  const melding = (t) => { $("melding").innerHTML = t ? `<div class="melding">${esc(t)}</div>` : ""; };
  const zeg = async (f) => { try { melding(""); await f(); await laad(); } catch (e) { melding(e.message ?? String(e)); } };
  const rpc = async (naam, args) => { const { data, error } = await client.rpc(naam, args); if (error) throw error; return data; };

  function voorstelHtml(m) {
    if (!m || typeof m !== "object") return "";
    return `<div class="klein">
      <p><b>Doel:</b> ${esc(m.doel)}</p>
      <p><b>Het is klaar als:</b></p>${lijst(m.acceptatie)}
      <p><b>Jarvis mag werken in:</b> ${esc((m.repos ?? []).join(", "))}</p>
      <p><b>Alleen deze bestanden:</b></p>${lijst(m.paden_ja)}
      <p><b>Uitrollen naar productie zonder verder akkoord:</b> ${m.productie ? "ja" : "nee"} &nbsp;
         <b>Databasemigraties:</b> ${m.migraties ? "ja" : "nee"}${m.destructief ? " (ook verwijderend)" : ""} &nbsp;
         <b>Kosten:</b> € ${esc(m.kosten_max_eur ?? 0)}</p>
      <p>Wijzigingen aan de poort, workflows en beveiligingsconfiguratie vallen er nooit onder.</p></div>`;
  }

  function kaartVoorJou(v) {
    if (v.type === "akkoord") {
      return `<div class="kaart"><h3>${esc(v.titel)}<span class="badge AKKOORD_NODIG">akkoord nodig</span></h3>${voorstelHtml(v.opties)}
        <button class="hoofd" data-akkoord="${esc(v.taak_id)}">Akkoord op dit mandaat</button><button data-afwijs="${esc(v.taak_id)}">Afwijzen</button></div>`;
    }
    const opties = Array.isArray(v.opties) ? v.opties : [];
    return `<div class="kaart"><h3>${esc(v.titel)}<span class="badge BESLISSING_NODIG">beslissing nodig</span></h3><p>${esc(v.vraag)}</p>
      ${opties.map((o) => `<button data-kies="${esc(v.id)}" data-antwoord="${esc(o)}">${esc(o)}</button>`).join("")}
      <input data-vrij="${esc(v.id)}" placeholder="of een eigen antwoord"><button data-vrijstuur="${esc(v.id)}">Verstuur</button></div>`;
  }

  function kaartTaak(t) {
    const klaar = t.toestand === "KLAAR";
    const eind = klaar && Array.isArray(t.eindcontrole) ? `<ul>${t.eindcontrole.map((e) => `<li>${esc(e.criterium)}: ${esc(e.uitkomst)} — ${esc(e.bewijs)}</li>`).join("")}</ul>` : "";
    return `<div class="kaart"><h3>${esc(t.titel)}<span class="badge ${esc(t.toestand)}">${esc(t.toestand.toLowerCase().replace("_", " "))}</span></h3>
      <div class="klein">${esc(t.id)} · sinds ${esc(new Date(t.toestand_sinds).toLocaleString("nl-NL"))}${t.blokkade ? ` · technisch bezig: ${esc(t.blokkade)}` : ""}</div>${eind}</div>`;
  }

  async function laad(auto) {
    // Een verversing op de klok mag nooit een half getypte opdracht wegvegen.
    if (auto === true && document.activeElement && ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
    const [voor, taken] = await Promise.all([
      client.from("v3_voor_jou").select("*").order("geopend_op"),
      client.from("v3_actueel").select("*").order("toestand_sinds", { ascending: false }),
    ]);
    if (voor.error || taken.error) { melding(`Niet te lezen: ${(voor.error ?? taken.error).message}`); return; }
    const open = taken.data.filter((t) => !["KLAAR", "MISLUKT"].includes(t.toestand));
    const af = taken.data.filter((t) => ["KLAAR", "MISLUKT"].includes(t.toestand));
    $("status").textContent = `bijgewerkt ${new Date().toLocaleTimeString("nl-NL")} · ${voor.data.length} voor jou · ${open.length} lopend`;
    $("inhoud").innerHTML = `
      <h2>Nieuwe opdracht</h2>
      <div class="kaart"><input id="nt" placeholder="Titel"><textarea id="no" rows="4" placeholder="Wat wil je dat Jarvis doet?"></textarea><button class="hoofd" id="nv">Geef opdracht</button></div>
      <h2>Voor jou</h2>${voor.data.length ? voor.data.map(kaartVoorJou).join("") : '<div class="leeg">Niets. Jarvis werkt door.</div>'}
      <h2>Lopend</h2>${open.length ? open.map(kaartTaak).join("") : '<div class="leeg">Geen lopende opdrachten.</div>'}
      <h2>Resultaat</h2>${af.length ? af.map(kaartTaak).join("") : '<div class="leeg">Nog niets afgerond.</div>'}`;
    $("nv").onclick = () => zeg(async () => { await rpc("v3_nieuwe_opdracht", { p_titel: $("nt").value, p_opdracht: $("no").value }); });
    document.querySelectorAll("[data-akkoord]").forEach((b) => b.onclick = () => zeg(() => rpc("v3_geef_mandaat", { p_taak: b.dataset.akkoord })));
    document.querySelectorAll("[data-afwijs]").forEach((b) => b.onclick = () => zeg(() => rpc("v3_wijs_af", { p_taak: b.dataset.afwijs })));
    document.querySelectorAll("[data-kies]").forEach((b) => b.onclick = () => zeg(() => rpc("v3_beantwoord", { p_verzoek: b.dataset.kies, p_antwoord: b.dataset.antwoord })));
    document.querySelectorAll("[data-vrijstuur]").forEach((b) => b.onclick = () => zeg(() => rpc("v3_beantwoord", { p_verzoek: b.dataset.vrijstuur, p_antwoord: document.querySelector(`[data-vrij="${b.dataset.vrijstuur}"]`).value })));
  }

  function login(melding_) {
    $("status").textContent = "inloggen";
    $("inhoud").innerHTML = `<div class="kaart"><p>Log in; alleen de eigenaar ziet iets.</p>${melding_ ? `<div class="melding">${esc(melding_)}</div>` : ""}
      <form id="lf"><input name="e" type="email" placeholder="e-mail" autocomplete="username" required><input name="w" type="password" placeholder="wachtwoord" autocomplete="current-password" required><button class="hoofd" type="submit">Inloggen</button></form></div>`;
    $("lf").onsubmit = async (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const { error } = await client.auth.signInWithPassword({ email: String(f.get("e")), password: String(f.get("w")) });
      if (error) login("Inloggen mislukt: " + error.message);
    };
  }

  async function start() {
    const cfg = window.JARVIS_SUPABASE;
    if (!cfg?.url || !cfg?.key) { $("status").textContent = "config.js ontbreekt in deze uitrol — de pagina weet niet welke database ze moet lezen"; return; }
    await new Promise((ok, nee) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"; sc.onload = ok; sc.onerror = nee; document.head.appendChild(sc); });
    client = window.supabase.createClient(cfg.url, cfg.key, { db: { schema: "jarvis" } });
    const { data: { session } } = await client.auth.getSession();
    if (!session) { login(""); await new Promise((ok) => client.auth.onAuthStateChange((_e, s) => { if (s) ok(); })); }
    client.auth.onAuthStateChange((_e, s) => { if (!s) location.reload(); });
    await laad();
    setInterval(() => laad(true), 15000);
  }
  start();
})();
</script>
</body>
</html>
