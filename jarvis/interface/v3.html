<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Jarvis</title>
<style>
  :root { --bg:#f6f6f3; --kaart:#fff; --tekst:#1b1b19; --gedempt:#6b6b66; --lijn:#e2e1da; --accent:#1f5eff; --goed:#17794a; --fout:#b3261e; --wacht:#9a6b00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --kaart:#1d1d1b; --tekst:#efeee8; --gedempt:#a2a19a; --lijn:#2f2f2b; --accent:#7ea2ff; --goed:#5fd09a; --fout:#ff8a80; --wacht:#f0c05a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--tekst); font:16px/1.45 system-ui, sans-serif; padding:0 16px 48px; }
  main { max-width:760px; margin:0 auto; }
  h1 { font-size:20px; margin:20px 0 4px; } h2 { font-size:15px; margin:28px 0 8px; text-transform:uppercase; letter-spacing:.04em; color:var(--gedempt); }
  .kaart { background:var(--kaart); border:1px solid var(--lijn); border-radius:12px; padding:14px 16px; margin:10px 0; }
  .kaart h3 { margin:0 0 6px; font-size:16px; } .klein { color:var(--gedempt); font-size:13.5px; }
  .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--lijn); margin-left:6px; }
  .KLAAR { color:var(--goed); border-color:var(--goed); } .MISLUKT { color:var(--fout); border-color:var(--fout); }
  .AKKOORD_NODIG, .BESLISSING_NODIG { color:var(--wacht); border-color:var(--wacht); }
  button { font:inherit; padding:9px 14px; border-radius:9px; border:1px solid var(--lijn); background:var(--kaart); color:var(--tekst); cursor:pointer; margin:8px 8px 0 0; }
  button.hoofd { background:var(--accent); border-color:var(--accent); color:#fff; } button:disabled { opacity:.5; }
  input, textarea { font:inherit; width:100%; padding:9px 10px; border-radius:9px; border:1px solid var(--lijn); background:var(--kaart); color:var(--tekst); margin:6px 0; }
  ul { margin:6px 0 6px 18px; padding:0; } .melding { padding:10px 12px; border-radius:9px; border:1px solid var(--fout); color:var(--fout); margin:10px 0; }
  .leeg { color:var(--gedempt); padding:6px 0; }
</style>
</head>
<body>
<main>
  <h1>Jarvis</h1>
  <div class="klein">Jij bepaalt wat, Jarvis bepaalt hoe.</div>
  <div id="status" class="klein">laden…</div>
  <div id="melding"></div>
  <div id="inhoud"></div>
</main>
<script src="../config.js"></script>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let client = null;
  const melding = (t) => { $("melding").innerHTML = t ? `<div class="melding">${esc(t)}</div>` : ""; };
  const zeg = async (f) => { try { melding(""); await f(); await laad(); } catch (e) { melding(e.message ?? String(e)); } };
  const rpc = async (naam, args) => { const { data, error } = await client.rpc(naam, args); if (error) throw error; return data; };

  const LABEL = { open: "nieuw", bezig: "Jarvis bouwt", review: "in review", samengevoegd: "wordt uitgerold", klaar: "klaar", vast: "vastgelopen" };
  const KLEUR = { klaar: "KLAAR", vast: "MISLUKT" };

  function kaartDoel(d) {
    const pr = d.pr && typeof d.pr.repo === "string" && Number.isInteger(d.pr.nummer) ? ` · <a href="https://github.com/${esc(d.pr.repo)}/pull/${esc(d.pr.nummer)}">${esc(d.pr.repo.split("/")[1])} #${esc(d.pr.nummer)}</a>` : "";
    return `<div class="kaart"><h3>${esc(d.titel)}<span class="badge ${esc(KLEUR[d.status] ?? "")}">${esc(LABEL[d.status] ?? d.status)}</span></h3>
      <div class="klein">${esc(d.id)} · bijgewerkt ${esc(new Date(d.bijgewerkt).toLocaleString("nl-NL"))}${pr}</div>
      ${d.uitkomst ? `<p class="klein">${esc(d.uitkomst)}</p>` : ""}</div>`;
  }

  async function laad(auto) {
    // Een verversing op de klok mag nooit een half getypte opdracht wegvegen.
    if (auto === true && document.activeElement && ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
    const doelen = await client.from("doelen").select("*").order("aangemaakt", { ascending: false });
    if (doelen.error) { melding(`Niet te lezen: ${doelen.error.message}`); return; }
    const lopend = doelen.data.filter((d) => !["klaar", "vast"].includes(d.status));
    const vast = doelen.data.filter((d) => d.status === "vast");
    const klaar = doelen.data.filter((d) => d.status === "klaar");
    $("status").textContent = `bijgewerkt ${new Date().toLocaleTimeString("nl-NL")} · ${lopend.length} lopend`;
    $("inhoud").innerHTML = `
      <h2>Nieuw doel</h2>
      <div class="kaart"><input id="nt" placeholder="Titel"><textarea id="no" rows="4" placeholder="Wat wil je dat Jarvis bereikt?"></textarea>
        <input id="nu" placeholder="Waar het te zien is (https://…), optioneel"><button class="hoofd" id="nv">Geef doel</button></div>
      <h2>Lopend</h2>${lopend.length ? lopend.map(kaartDoel).join("") : '<div class="leeg">Geen lopende doelen.</div>'}
      ${vast.length ? `<h2>Vastgelopen</h2>${vast.map(kaartDoel).join("")}` : ""}
      <h2>Klaar</h2>${klaar.length ? klaar.map(kaartDoel).join("") : '<div class="leeg">Nog niets afgerond.</div>'}`;
    $("nv").onclick = () => zeg(async () => { await rpc("doel_nieuw", { p_titel: $("nt").value, p_opdracht: $("no").value, p_acceptatie_url: $("nu").value || null }); });
  }

  function login(melding_) {
    $("status").textContent = "inloggen";
    $("inhoud").innerHTML = `<div class="kaart"><p>Log in; alleen de eigenaar ziet iets.</p>${melding_ ? `<div class="melding">${esc(melding_)}</div>` : ""}
      <form id="lf"><input name="e" type="email" placeholder="e-mail" autocomplete="username" required><input name="w" type="password" placeholder="wachtwoord" autocomplete="current-password" required><button class="hoofd" type="submit">Inloggen</button></form></div>`;
    $("lf").onsubmit = async (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const { error } = await client.auth.signInWithPassword({ email: String(f.get("e")), password: String(f.get("w")) });
      if (error) login("Inloggen mislukt: " + error.message);
    };
  }

  async function start() {
    const cfg = window.JARVIS_SUPABASE;
    if (!cfg?.url || !cfg?.key) { $("status").textContent = "config.js ontbreekt in deze uitrol — de pagina weet niet welke database ze moet lezen"; return; }
    await new Promise((ok, nee) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"; sc.onload = ok; sc.onerror = nee; document.head.appendChild(sc); });
    client = window.supabase.createClient(cfg.url, cfg.key, { db: { schema: "jarvis" } });
    const { data: { session } } = await client.auth.getSession();
    if (!session) { login(""); await new Promise((ok) => client.auth.onAuthStateChange((_e, s) => { if (s) ok(); })); }
    client.auth.onAuthStateChange((_e, s) => { if (!s) location.reload(); });
    await laad();
    setInterval(() => laad(true), 15000);
  }
  start();
})();
</script>
</body>
</html>
