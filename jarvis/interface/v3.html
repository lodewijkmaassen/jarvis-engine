  .live::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; box-shadow:0 0 8px currentColor; }

<body>
<div class="schil">
<aside class="zijbalk">
  <div class="merk"><div class="kern" aria-hidden="true"></div><div><h1>Jarvis</h1><div class="onder">Command Center</div></div></div>
  <nav aria-label="Hoofdnavigatie"><a href="#/" id="nav-cc">Command Center</a><a href="#/projecten" id="nav-pr">Projecten</a><a href="#/ideeen" id="nav-id">Ideeën</a></nav>
  <div id="status">laden…</div>
</aside>
<main>
  <div id="melding"></div>
  <div id="inhoud"></div>
</main>
</div>
<script src="../config.js"></script>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // Een datum die niet te lezen is toont "onbekend" in plaats van "Invalid Date".
  const tijd = (t) => { const d = new Date(t); return Number.isNaN(d.getTime()) ? "onbekend" : d.toLocaleString("nl-NL"); };
  let client = null;
  const melding = (t) => { $("melding").innerHTML = t ? `<div class="melding">${esc(t)}</div>` : ""; };
  const zeg = async (f) => { try { melding(""); await f(); await laad(); } catch (e) { melding(e.message ?? String(e)); } };
  const rpc = async (naam, args) => { const { data, error } = await client.rpc(naam, args); if (error) throw error; return data; };

  const LABEL = { open: "nieuw", bezig: "Jarvis bouwt", review: "in review", samengevoegd: "wordt uitgerold", klaar: "klaar", vast: "vastgelopen", gesloten: "gesloten" };
  const KLEUR = { klaar: "KLAAR", vast: "MISLUKT" };

  const STAPPEN = ["open", "bezig", "review", "samengevoegd", "klaar"];
  const stappen = (status) => {
    const nu = STAPPEN.indexOf(status);
    return `<div class="voortgang" aria-hidden="true">${STAPPEN.map((_, i) => `<i class="${i <= nu ? "aan" : ""}${i === nu && status !== "klaar" ? " nu" : ""}"></i>`).join("")}</div>`;
  };

  // Een project is een vaste plek; zijn doelen zijn gewone doelen waarvan de opdracht begint met "Project: <sleutel>".
  // Een project kan subprojecten hebben; een doel van een subproject begint met "Project: <project>/<subproject>".
  const VASTE_PROJECTEN = [
    { sleutel: "kasboek", naam: "Kasboek", omschrijving: "Het bestaande Kasboek-project: kasstromen en saldo, met eigen repository en omgeving.", repo: "lodewijkmaassen/kasboek" },
    { sleutel: "tovas-flow", naam: "ToVas Flow", omschrijving: "ToVas Flow: van gemiste oproep tot gekwalificeerde lead, offerte en review, met eigen repository en omgeving.", repo: "lodewijkmaassen/tovas-flow",
      subprojecten: [
        { sleutel: "gemiste-oproepen", naam: "Gemiste oproepen", omschrijving: "Een gemiste oproep wordt via WhatsApp en de AI-intake een gekwalificeerde lead." },
        { sleutel: "offerte-opvolging", naam: "Offerte opvolging", omschrijving: "Verstuurde offertes bewaken en op het juiste moment opvolgen." },
        { sleutel: "reviews-verzamelen", naam: "Reviews verzamelen", omschrijving: "Na een afgeronde klus om een review vragen." },
      ] },
    // Nog zonder eigen repository: de repositoryregel op de projectpagina valt dan weg.
    { sleutel: "tobias-leert", naam: "Tobias Leert", omschrijving: "Leerprojecten voor Tobias.",
      subprojecten: [
        { sleutel: "woordbattle", naam: "WoordBattle", omschrijving: "Een woordspel om spelenderwijs woorden te leren." },
      ] },
  ];
  // Projecten en subprojecten die de eigenaar zelf aanmaakt (D-20261117-194904457). Net als een idee is dat een bericht
  // van de eigenaar met status 'verwerkt' (geen wachtrij pakt het op, geen nieuwe tabel of migratie), hier met
  // context.projectdef = { sleutel, naam, omschrijving, repo?, ouder? }. Met ouder is het een subproject van dat project.
  // Een sleutel die al bestaat telt niet: een vast project of een eerder aangemaakt project wint.
  // projecten:begin
  const sleutelVan = (naam) => String(naam ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  function bouwProjecten(vast, berichten, objectVan) {
    const lijst = vast.map((p) => ({ ...p, subprojecten: [...(p.subprojecten ?? [])] }));
    const defs = berichten.filter((b) => b.van === "eigenaar").map((b) => objectVan(b.context).projectdef)
      .filter((d) => d && typeof d.sleutel === "string" && /^[a-z0-9-]+$/.test(d.sleutel) && typeof d.naam === "string" && d.naam.trim());
    for (const d of defs.filter((d) => !d.ouder)) {
      if (lijst.some((p) => p.sleutel === d.sleutel)) continue;
      lijst.push({ sleutel: d.sleutel, naam: d.naam, omschrijving: d.omschrijving ?? "", ...(d.repo ? { repo: d.repo } : {}), subprojecten: [] });
    }
    for (const d of defs.filter((d) => d.ouder)) {
      const p = lijst.find((x) => x.sleutel === d.ouder);
      if (!p || p.subprojecten.some((sp) => sp.sleutel === d.sleutel)) continue;
      p.subprojecten.push({ sleutel: d.sleutel, naam: d.naam, omschrijving: d.omschrijving ?? "" });
    }
    return lijst;
  }
  // projecten:einde
  let PROJECTEN = bouwProjecten(VASTE_PROJECTEN, [], () => ({}));
  // Wat de eigenaar in een projectformulier typte, per formulier; een verversing op de klok tekent het opnieuw.
  const projectConcept = {};
  // Volledige plek van een doel: "kasboek", of "tovas-flow/offerte-opvolging" voor een subproject.
  // Bewust precies één subniveau: de eigenaar vroeg project → subproject. Een dieper label ("a/b/c") telt
  // nergens mee; een derde niveau is een nieuwe ontwerpbeslissing, geen uitbreiding van deze regel.
  // Een doel verplaatsen (D-20261118-192315736): de eigenaar zet een doel in een ander project of subproject, of haalt
  // het uit elk project. Net als een project of idee is dat een verwerkt bericht van de eigenaar, hier met
  // context.verplaatsing = { doel, plek } (plek "" = geen project). De opdracht van het doel blijft ongemoeid; de jongste
  // verplaatsing van een doel wint van de projectregel in zijn opdracht.
  // verplaatsen:begin
  function bouwVerplaatsingen(berichten, objectVan) {
    const plekken = new Map();
    for (const b of berichten) {
      if (b.van !== "eigenaar") continue;
      const v = objectVan(b.context).verplaatsing;
      if (!v || typeof v.doel !== "string" || !v.doel || typeof v.plek !== "string") continue;
      if (v.plek === "") plekken.set(v.doel, null);
      else if (/^[a-z0-9-]+(?:\/[a-z0-9-]+)?$/.test(v.plek)) plekken.set(v.doel, v.plek);
    }
    return plekken;
  }
  const plekLabel = (d) => { const m = /^Project:\s*([a-z0-9-]+(?:\/[a-z0-9-]+)?)\s*(\n|$)/i.exec(String(d.opdracht ?? "")); return m ? m[1].toLowerCase() : null; };
  const plekVan = (d, plekken) => (plekken.has(d.id) ? plekken.get(d.id) : plekLabel(d));
  // Alle plekken waar een doel heen kan: eerst geen project, dan elk project gevolgd door zijn subprojecten.
  const plekKeuzes = (projecten) => [{ plek: "", naam: "Geen project (alleen Command Center)" },
    ...projecten.flatMap((p) => [{ plek: p.sleutel, naam: p.naam }, ...(p.subprojecten ?? []).map((sp) => ({ plek: p.sleutel + "/" + sp.sleutel, naam: p.naam + " · " + sp.naam }))])];
  // verplaatsen:einde
  let verplaatst = new Map();
  const projectVan = (d) => plekVan(d, verplaatst);
  // Alle doelen van een project, inclusief die van zijn subprojecten.
  const doelenVanProject = (p) => alleDoelen.filter((d) => { const plek = projectVan(d); return plek === p.sleutel || (plek ?? "").startsWith(p.sleutel + "/"); });
  const doelenVanPlek = (plek) => alleDoelen.filter((d) => projectVan(d) === plek);
  const zonderLabel = (t) => String(t ?? "").replace(/^Project:[^\n]*\n+/i, "");
  let alleDoelen = [];
  // Wat de eigenaar bij een vastgelopen doel al typte, per doel; een verversing op de klok tekent de kaart opnieuw.
  const concepten = {};

  // Welke kaarten de eigenaar heeft opengeklapt; een verversing op de klok tekent ze weer open.
  const geopend = new Set();

  // Na het aanklikken van een kaart: de details en het reactieveld. Reageren kan bij elk doel (bij een afgerond of
  // gesloten doel hervat Jarvis het); sluiten alleen bij een vastgelopen doel.
  function doelActies(d) {
    const sluit = d.status === "vast" ? `<button data-actie="sluit">Sluiten</button>` : "";
    const knop = ["klaar", "vast", "gesloten"].includes(d.status) ? "Reageer en hervat" : "Reageer";
    return `<div class="acties" data-id="${esc(d.id)}">
        <div class="klein">Opdracht</div><p class="opdracht">${esc(zonderLabel(d.opdracht))}</p>
        <textarea rows="3" data-concept="${esc(d.id)}" placeholder="Aanvullende informatie of instructie voor Jarvis" aria-label="Reactie op ${esc(d.titel)}">${esc(concepten[d.id] ?? "")}</textarea>
        <button class="hoofd" data-actie="reageer">${knop}</button>${sluit}
        <div class="verplaats"><select data-plek="${esc(d.id)}" aria-label="Project of subproject voor ${esc(d.titel)}">${plekKeuzes(PROJECTEN).map((k) =>
          `<option value="${esc(k.plek)}"${k.plek === (projectVan(d) ?? "") ? " selected" : ""}>${esc(k.naam)}</option>`).join("")}</select>
          <button data-actie="verplaats">Verplaats</button></div></div>`;
  }

  function kaartDoel(d) {
    const pr = d.pr && typeof d.pr.repo === "string" && Number.isInteger(d.pr.nummer) ? ` · <a href="https://github.com/${esc(d.pr.repo)}/pull/${esc(d.pr.nummer)}">${esc(d.pr.repo.split("/")[1])} #${esc(d.pr.nummer)}</a>` : "";
    const soort = ["klaar", "vast", "gesloten"].includes(d.status) ? d.status : "lopend";
    const open = geopend.has(d.id);
    return `<div class="kaart ${esc(soort)}${open ? " open" : ""}"><h3><button type="button" class="kop" data-actie="open" aria-expanded="${esc(open)}" data-id="${esc(d.id)}">${esc(d.titel)}</button><span class="badge ${esc(KLEUR[d.status] ?? "")}">${esc(LABEL[d.status] ?? d.status)}</span></h3>
      <div class="klein">${esc(d.id)} · bijgewerkt ${esc(tijd(d.bijgewerkt))}${pr}</div>
      ${(soort === "lopend" ? stappen(d.status) : "")}
      ${d.uitkomst ? `<p class="klein${open ? "" : " samengevat"}">${esc(d.uitkomst)}</p>` : ""}
      ${(open ? doelActies(d) : "")}</div>`;
  }

  // Eigenaarsbeslissingen (DEC-0043): hetzelfde bericht met context.akkoord_pr en dezelfde tabel jarvis.autorisaties
  // als de oude interface; hier alleen zichtbaar en afhandelbaar gemaakt.
  let berichten = [], autorisaties = [], beslissingFout = null, inzichten = [];
  // Het activiteitenlogboek van de uitvoering (jarvis.activiteit), dezelfde tabel die de V2-pagina al leest.
  // Alleen lezen, begrensd op de laatste regels, en in dezelfde ronde als de doelen: geen tweede klok erbij.
  let activiteit = [], activiteitFout = null, leesFout = null;
  async function laadBeslissingen() {
    // Het geheugen van Jarvis Brein (context.kanaal = "brein") hoort niet in deze lijst: dat zou met elke sparbeurt groeien.
    const [b, a, g] = await Promise.all([
      client.from("berichten").select("*").or("context->>kanaal.is.null,context->>kanaal.neq.brein").order("op"),
      client.from("autorisaties").select("id, soort, pr_repo, pr_nummer, commit_sha, op").order("op", { ascending: false }),
      client.from("berichten").select("id, tekst, op, context").eq("context->>kanaal", "brein").eq("context->>soort", "inzicht").order("op", { ascending: false }).limit(200),
    ]);
    beslissingFout = b.error || a.error ? `Beslissingen niet te lezen: ${(b.error ?? a.error).message}` : null;
    berichten = b.data ?? []; autorisaties = a.data ?? [];
    inzichten = (g.data ?? []).filter((x) => { const c = objectVan(x.context); return !c.gewist && !c.vervallen && String(x.tekst ?? "").trim(); });
  }
  const objectVan = (c) => { if (typeof c === "string") { try { return JSON.parse(c); } catch { return {}; } } return c ?? {}; };
  const prSleutel = (v) => `${v.repo}#${v.nummer}@${v.commit_sha}`;
  // Open: een bericht van Jarvis met akkoord_pr waarop nog geen akkoord ligt en dat de eigenaar niet afwees.
  function openBeslissingen() {
    const afgewezen = new Set(berichten.filter((b) => b.van === "eigenaar").map((b) => objectVan(b.context).akkoord_pr_afgewezen).filter(Boolean).map(prSleutel));
    const gezien = new Set();
    return berichten.filter((b) => b.van === "jarvis").map((b) => ({ b, v: objectVan(b.context).akkoord_pr })).filter(({ v }) => v && v.repo && v.commit_sha).filter(({ v }) => {
      const k = prSleutel(v);
      if (gezien.has(k) || afgewezen.has(k)) return false;
      gezien.add(k);
      return !autorisaties.some((a) => a.soort === "pr" && a.pr_repo === v.repo && Number(a.pr_nummer) === Number(v.nummer) && a.commit_sha === v.commit_sha);
    }).reverse();
  }
  function beslissingenPaneel() {
    const open = openBeslissingen();
    const fout = beslissingFout ? `<div class="melding">${esc(beslissingFout)}</div>` : "";
    if (!open.length) return fout;
    return `<div class="paneel beslissing"><h2>Wacht op jou <span class="tel">${open.length}</span></h2>${fout}${open.map(({ b, v }) => `<div class="kaart" data-bericht="${esc(b.id)}">
      <h3>${esc(v.repo)} #${esc(v.nummer)}${v.taak ? ` · ${esc(v.taak)}` : ""}</h3>
      <div class="klein">Wat Jarvis nodig heeft: je akkoord op precies commit ${esc(String(v.commit_sha).slice(0, 7))}. Waarom jij: deze pull request raakt een harde uitzondering; het akkoord op het doel dekt hem niet.</div>
      ${b.tekst ? `<p class="opdracht">${esc(b.tekst)}</p>` : ""}
      <button class="hoofd" data-beslis="akkoord">Akkoord</button><button data-beslis="afwijzen">Afwijzen</button></div>`).join("")}</div>`;
  }
  async function beslis(berichtId, wat) {
    const b = berichten.find((x) => String(x.id) === berichtId); const v = objectVan(b?.context).akkoord_pr;
    if (!v) return;
    if (wat === "akkoord") {
      const r = await client.from("autorisaties").insert({ soort: "pr", project: v.project ?? null, taak: v.taak ?? null, pr_repo: v.repo, pr_nummer: Number(v.nummer), commit_sha: v.commit_sha, tekst: b.tekst, bron: "interface" });
      if (r.error) throw r.error;
    } else {
      const r = await client.from("berichten").insert({ van: "eigenaar", tekst: `Afgewezen: ${v.repo}#${v.nummer} (${String(v.commit_sha).slice(0, 7)}).`, op: new Date().toISOString(), status: "nieuw", context: { akkoord_pr_afgewezen: v, taak: v.taak ?? null, project: v.project ?? null } });
      if (r.error) throw r.error;
    }
  }

  async function laad(auto) {
    // Een verversing op de klok mag nooit een half getypte opdracht wegvegen.
    if (auto === true && document.activeElement && ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
    const [doelen, logboek] = await Promise.all([
      client.from("doelen").select("*").order("aangemaakt", { ascending: false }),
      client.from("activiteit").select("op, uitvoerder, rol, taak, project, soort, tekst, verwijzing").order("op", { ascending: false }).limit(60),
    ]);
    if (doelen.error) { leesFout = doelen.error.message; melding(`Niet te lezen: ${doelen.error.message}`); teken(); return; }
    leesFout = null;
    alleDoelen = doelen.data;
    // Een leesfout op het logboek is geen stilte: de pagina zegt dat zij het niet kon lezen.
    activiteitFout = logboek.error ? `Activiteit niet te lezen (${logboek.error.message}).` : null;
    activiteit = logboek.data ?? [];
    await laadBeslissingen();
    PROJECTEN = bouwProjecten(VASTE_PROJECTEN, berichten, objectVan);
    verplaatst = bouwVerplaatsingen(berichten, objectVan);
    const lopend = splits(alleDoelen).lopend;
    $("status").textContent = `laatste controle ${new Date().toLocaleTimeString("nl-NL")} · ${lopend.length} lopend`;
    teken();
  }

  const lijst = (arr, leeg) => (arr.length ? arr.map((x) => (x.idee ? ideeKaart(x.idee) : kaartDoel(x))).join("") : `<div class="leeg">${esc(leeg)}</div>`);
  // Een gesloten doel is af voor de eigenaar zonder dat het bereikt is: niet lopend, niet vastgelopen, niet klaar.
  const splits = (doelen) => ({
    lopend: doelen.filter((d) => !["klaar", "vast", "gesloten"].includes(d.status)),
    vast: doelen.filter((d) => d.status === "vast"),
    klaar: doelen.filter((d) => d.status === "klaar"),
    gesloten: doelen.filter((d) => d.status === "gesloten"),
  });
  // Klaar, historie en gesloten staan standaard ingeklapt en tonen hoogstens PER_PAGINA doelen tegelijk; de eigenaar klapt
  // ze uit en bladert. Sleutel = weergave + soort, zodat elk blok zijn eigen stand houdt (ook over een verversing heen).
  const PER_PAGINA = 10;
  const uitgeklapt = new Set();
  const paginas = {};
  function inklapBlok(sleutel, titel, arr, leeg) {
    const open = uitgeklapt.has(sleutel);
    const aantal = Math.max(1, Math.ceil(arr.length / PER_PAGINA));
    const nu = Math.min(Math.max(paginas[sleutel] ?? 0, 0), aantal - 1);
    paginas[sleutel] = nu;
    const bladeren = aantal > 1
      ? `<div class="bladeren"><button type="button" data-actie="pagina" data-blok="${esc(sleutel)}" data-stap="-1"${nu === 0 ? " disabled" : ""}>Vorige</button><span class="klein">Pagina ${nu + 1} van ${aantal}</span><button type="button" data-actie="pagina" data-blok="${esc(sleutel)}" data-stap="1"${nu >= aantal - 1 ? " disabled" : ""}>Volgende</button></div>`
      : "";
    return `<h2 style="margin-top:22px">${esc(titel)} <span class="tel">${arr.length}</span>
        <button type="button" data-actie="vouw" data-blok="${esc(sleutel)}" aria-expanded="${open}">${open ? "Inklappen" : "Uitklappen"}</button></h2>
      ${open ? lijst(arr.slice(nu * PER_PAGINA, (nu + 1) * PER_PAGINA), leeg) + bladeren : ""}`;
  }
  const geslotenBlok = (gesloten, ctx) => (gesloten.length ? inklapBlok(ctx + ":gesloten", "Gesloten", gesloten, "") : "");

  // plek = { naam, label } voor een project of subproject; null in het Command Center.
  function invoerBlok(plek) {
    return `<div class="invoer"><h2>${plek ? `Nieuw doel voor ${esc(plek.naam)}` : "Nieuw doel"}</h2>
        <div class="rij"><input id="nt" placeholder="Titel" aria-label="Titel"><input id="nu" placeholder="Waar het te zien is (https://…), optioneel" aria-label="Waar het te zien is, optioneel">
          <textarea class="breed" id="no" rows="4" placeholder="Wat wil je dat Jarvis bereikt?" aria-label="Opdracht"></textarea>
          <button type="button" class="bijlage" id="nspraak" aria-pressed="false" aria-label="Spraakinvoer voor de omschrijving" title="Spreek de omschrijving in" hidden>🎤 Spreek in</button></div>
        <button class="hoofd" id="nv">Geef doel</button></div>`;
  }

  // Spraakinvoer voor de omschrijving: browserdictaat (Web Speech API); zonder ondersteuning blijft de knop verborgen.
  function koppelSpraak() {
    const knop = $("nspraak"), veld = $("no");
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!knop || !veld || !SR) return;
    knop.hidden = false;
    let rec = null, basis = "";
    const stop = () => { if (rec) { try { rec.stop(); } catch {} } };
    const zet = (aan) => { knop.setAttribute("aria-pressed", String(aan)); knop.textContent = aan ? "⏹ Stop" : "🎤 Spreek in"; };
    knop.onclick = () => {
      if (rec) return stop();
      rec = new SR(); rec.lang = "nl-NL"; rec.interimResults = true; rec.continuous = true;
      basis = veld.value && !/\s$/.test(veld.value) ? veld.value + " " : veld.value;
      rec.onresult = (e) => { let t = ""; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; veld.value = basis + t; };
      rec.onend = () => { rec = null; zet(false); };
      rec.onerror = () => { rec = null; zet(false); };
      try { rec.start(); zet(true); } catch { rec = null; zet(false); }
    };
  }

  function koppelInvoer(plek) {
    koppelSpraak();
    $("nv").onclick = () => zeg(async () => {
      const opdracht = plek ? "Project: " + plek.label + "\n\n" + $("no").value : $("no").value;
      await rpc("doel_nieuw", { p_titel: $("nt").value, p_opdracht: opdracht, p_acceptatie_url: $("nu").value || null });
    });
  }

  // Hulp voor het Command Center. Alles komt uit wat de pagina al gelezen heeft: de doelen en het
  // activiteitenlogboek. Ontbreekt iets, dan staat er een neutrale stand en geen aanname.
  const tijdKort = (t) => { const d = new Date(t); return Number.isNaN(d.getTime()) ? "onbekend" : d.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" }); };
  const vandaagOp = (t) => { const d = new Date(t), n = new Date();
    return !Number.isNaN(d.getTime()) && d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate(); };
  function geleden(t) {
    const d = new Date(t);
    if (Number.isNaN(d.getTime())) return "onbekend";
    const sec = Math.max(0, Math.round((Date.now() - d.getTime()) / 1000));
    if (sec < 60) return sec === 1 ? "1 seconde geleden" : sec + " seconden geleden";
    const min = Math.round(sec / 60);
    if (min < 60) return min === 1 ? "1 minuut geleden" : min + " minuten geleden";
    const uur = Math.round(min / 60);
    if (uur < 24) return uur === 1 ? "1 uur geleden" : uur + " uur geleden";
    const dag = Math.round(uur / 24);
    return dag === 1 ? "1 dag geleden" : dag + " dagen geleden";
  }
  const prVan = (d) => (d && d.pr && typeof d.pr.repo === "string" && Number.isInteger(d.pr.nummer) ? d.pr : null);
  const prKort = (pr) => `${pr.repo.split("/")[1]} #${pr.nummer}`;
  const prKnop = (pr, label) => `<a href="https://github.com/${esc(pr.repo)}/pull/${esc(pr.nummer)}" rel="noopener">${esc(label)}</a>`;
  // Alleen een gewone webadres-link uit de database wordt een link; iets anders blijft tekst.
  const veiligeLink = (u) => (typeof u === "string" && /^https:\/\//.test(u) ? u : null);
  // De eerstvolgende stap hoort bij de status van het doel: dit is wat de keten daarna doet, niet een schatting.
  function volgendeStap(d) {
    if (!d) return null;
    const pr = prVan(d);
    if (d.status === "open") return { tekst: "Wacht op de eerstvolgende ronde van de keten.", pr: null };
    if (d.status === "bezig") return { tekst: "Jarvis werkt aan de wijziging.", pr };
    if (d.status === "review") return { tekst: pr ? `Onafhankelijke review van ${prKort(pr)}.` : "Onafhankelijke review van de pull request.", pr };
    if (d.status === "samengevoegd") return { tekst: "Uitrol en daarna de acceptatietests.", pr };
    if (d.status === "vast") return { tekst: "Wacht op jouw reactie op dit doel.", pr };
    return null;
  }

  function weergaveCommandCenter() {
    // Teller en lijst komen uit dezelfde bron: ook doelen van projecten (zoals het Kasboek) staan in de lijsten.
    const totaal = splits(alleDoelen);
    const { lopend, vast, klaar, gesloten } = totaal;
    const opTijd = (a, b) => new Date(b.bijgewerkt) - new Date(a.bijgewerkt);
    const wachtend = lopend.filter((d) => d.status === "open");
    const actief = lopend.filter((d) => d.status !== "open");
    const vandaag = klaar.filter((d) => vandaagOp(d.bijgewerkt));
    const huidig = actief.slice().sort(opTijd)[0] ?? null;
    const laatsteKlaar = klaar.slice().sort(opTijd)[0] ?? null;
    const stap = volgendeStap(huidig ?? vast.slice().sort(opTijd)[0] ?? wachtend.slice().sort(opTijd)[0] ?? null);
    const aandacht = openBeslissingen().length + vast.length;
    // De laatste zes stappen van het doel dat nu loopt, oudste bovenaan.
    const stappenNu = huidig ? activiteit.filter((a) => a.taak === huidig.id).slice(0, 6).reverse() : [];
    const nieuwste = activiteit[0] ?? null;
    const nu = new Date();

    const tegel = (soort, n, naam) => `<div class="statustegel ${soort}"><b>${n}</b><span>${naam}</span></div>`;
    const kern = (soort, waarde, naam) => `<div class="kerntegel ${soort}"><span>${esc(naam)}</span><b>${esc(waarde)}</b></div>`;

    const huidigBlok = huidig
      ? `<div class="huidig"><div class="kop"><h2 style="margin:0">Huidige activiteit</h2>
            <span class="badge">${esc(LABEL[huidig.status] ?? huidig.status)}</span>
            <span class="klein">sinds ${esc(tijdKort(huidig.bijgewerkt))}</span></div>
          <h3>${esc(huidig.titel)}</h3>
          ${stappen(huidig.status)}
          ${stappenNu.length
            ? `<ul class="tijdlijn">${stappenNu.map((a) => `<li><span class="t">${esc(tijdKort(a.op))}</span><span>${esc(a.tekst)}${a.verwijzing ? ` <span class="klein">· ${esc(a.verwijzing)}</span>` : ""}</span></li>`).join("")}</ul>`
            : `<div class="leeg" style="margin:12px 0 0">${esc(activiteitFout ?? "Nog geen stappen vastgelegd voor dit doel.")}</div>`}</div>`
      : `<div class="huidig"><div class="kop"><h2 style="margin:0">Huidige activiteit</h2><span class="badge">rust</span></div>
          <p class="klein" style="margin:8px 0 0">${esc(wachtend.length
            ? `Niets in uitvoering. ${wachtend.length} ${wachtend.length === 1 ? "doel wacht" : "doelen wachten"} op de eerstvolgende ronde.`
            : "Niets in uitvoering en niets in de wachtrij.")}</p></div>`;

    const resultaatLink = laatsteKlaar ? veiligeLink(laatsteKlaar.acceptatie_url) : null;
    const drieluik = `<div class="drieluik">
        <div class="minikaart"><h3>Volgende stap</h3><p>${stap ? esc(stap.tekst) : "Geen volgende stap: er loopt niets."}</p>${stap && stap.pr ? prKnop(stap.pr, "Bekijk " + prKort(stap.pr)) : ""}</div>
        <div class="minikaart${laatsteKlaar ? " goed" : ""}"><h3>Laatste resultaat</h3>
          ${laatsteKlaar
            ? `<p>${esc(laatsteKlaar.titel)}</p><div class="klein">afgerond ${esc(tijd(laatsteKlaar.bijgewerkt))}</div>${
                resultaatLink ? `<a href="${esc(resultaatLink)}" rel="noopener">Open applicatie</a>` : (prVan(laatsteKlaar) ? prKnop(prVan(laatsteKlaar), "Bekijk " + prKort(prVan(laatsteKlaar))) : "")}`
            : `<p>Nog niets opgeleverd.</p>`}</div>
        <div class="minikaart${aandacht ? " let" : " goed"}"><h3>Jouw aandacht</h3>
          <p>${esc(aandacht ? `${aandacht} ${aandacht === 1 ? "punt wacht" : "punten wachten"} op jou.` : "Geen. Jarvis kan zelfstandig verder.")}</p></div>
      </div>`;

    $("inhoud").innerHTML = `<div class="bovenrij">
        <div class="paneel ai-kern">
          <div class="hudkop"><div class="ai-ring" aria-hidden="true"><b></b></div>
            <div><h2>Jarvis AI Core</h2><div class="onder">Uitvoering · Resultaten · Vervolgstappen</div></div>
            <span class="live ${leesFout ? "uit" : "aan"}">${leesFout ? "Geen verbinding" : "Live"}</span>
            <div class="klok"><b>${esc(nu.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" }))}</b>${esc(nu.toLocaleDateString("nl-NL", { weekday: "short", day: "numeric", month: "short", year: "numeric" }))}</div></div>
          <div class="kerntegels">${kern("lopend nadruk", actief.length, "Actieve uitvoering")}${kern("wacht", wachtend.length, "In wachtrij")}${kern("vast", vast.length, "Vastgelopen")}${kern("klaar", vandaag.length, "Vandaag afgerond")}</div>
          <div class="klein" style="margin-top:10px;text-align:left">${esc(nieuwste ? `Laatste activiteit: ${geleden(nieuwste.op)}` : (activiteitFout ?? "Nog geen activiteit vastgelegd."))}</div>
          ${huidigBlok}
          ${drieluik}
          <div class="chatmodus" role="group" aria-label="Modus van de chat"><button type="button" id="modus-sparren" aria-pressed="false">Sparren</button><button type="button" id="modus-opdracht" aria-pressed="false">Opdracht</button><button type="button" id="chatnieuw">Nieuw gesprek</button><button type="button" id="geheugenknop" aria-expanded="false">Wat Jarvis onthoudt (${inzichten.length})</button></div>
          <div class="klein" id="modusuitleg" style="text-align:left"></div>
          <div class="geheugen" id="geheugenlijst" hidden></div>
          <div class="chatlog" id="chatlog" role="log" aria-live="polite" aria-label="Gesprek met Jarvis"></div>
          <div class="chatvoorbeeld" id="chatvoorbeeld" hidden></div>
          <form class="chatvorm" id="chatvorm"><input type="file" id="chatbestand" multiple accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,.pdf,text/*,.txt,.md,.csv,.json,.log,.xml,.yml,.yaml,.html,.sql,.ts,.js,.mjs,.css" hidden><button type="button" class="bijlage" id="chatbijlage" aria-label="Bijlagen toevoegen" title="Afbeeldingen of bestanden toevoegen (of hierheen slepen)">📎</button><div class="invoer"><textarea id="chatin" rows="2" placeholder="Stel een vraag of geef een opdracht" aria-label="Bericht aan Jarvis"></textarea></div><button class="hoofd" id="chatstuur" type="submit">Stuur</button></form></div>
        <div class="paneel"><h2>Recente activiteit</h2><div class="subtekst">Laatste activiteit van Jarvis</div>${
          activiteit.length
            ? `<ul class="activiteit">${activiteit.slice(0, 9).map((a) => `<li>${esc(a.tekst)}<div class="klein">${esc(tijd(a.op))}${a.taak ? " · " + esc(a.taak) : ""}${a.verwijzing ? " · " + esc(a.verwijzing) : ""}</div></li>`).join("")}</ul>`
            : `<div class="leeg">${esc(activiteitFout ?? "Nog geen activiteit.")}</div>`}</div>
      </div>
      <div class="dashboard">
        <div class="duo">
          <div class="paneel"><h2>Projecten <span class="tel">${PROJECTEN.length}</span></h2>
            ${PROJECTEN.map((p) => `<a class="projectkaart" style="margin-bottom:10px" href="#/projecten/${esc(p.sleutel)}"><h3>${esc(p.naam)}</h3>${telrij(splits(doelenVanProject(p)))}</a>`).join("")}
            <a class="projectkaart" href="#/projecten">Alle projecten bekijken</a></div>
          <div class="paneel"><h2>Taken</h2>
            <div class="statusrij">${tegel("lopend", actief.length, "Lopend")}${tegel("wacht", wachtend.length, "Wachtend")}${tegel("vast", totaal.vast.length, "Vastgelopen")}${tegel("klaar", totaal.klaar.length, "Klaar")}${tegel("gesloten", totaal.gesloten.length, "Gesloten")}</div>
            <h2>Lopend <span class="tel">${lopend.length}</span></h2>${lijst(lopend, "Geen lopende doelen.")}
            ${vast.length ? `<h2 style="margin-top:22px">Vastgelopen <span class="tel">${vast.length}</span></h2>${vast.map(kaartDoel).join("")}` : ""}
            ${inklapBlok("cc:klaar", "Klaar", klaar, "Nog niets afgerond.")}
            ${geslotenBlok(gesloten, "cc")}</div>
        </div>
        ${beslissingenPaneel()}
        <div class="paneel">${invoerBlok(null)}</div>
      </div>`;
    koppelInvoer(null);
    koppelChat();
  }

  // De chat is een voordeur: een vraag krijgt antwoord, een opdracht wordt via de server een gewoon doel.
  // De voortgang van zo'n doel wordt bij elke verversing uit alleDoelen getekend; de chat bewaart alleen het doel-id.
  let chat = [];
  try { chat = JSON.parse(sessionStorage.getItem("jarvis-chat") ?? "[]"); } catch { chat = []; }
  let chatBezig = false;
  let chatConcept = "";
  // Sparmodus (Jarvis Brein): standaard. Daarin maakt Jarvis nooit zelf een doel; dat doet alleen de knop "Maak hier een doel van".
  let chatModus = "sparren";
  try { chatModus = sessionStorage.getItem("jarvis-chat-modus") === "opdracht" ? "opdracht" : "sparren"; } catch { /* standaard sparren */ }
  const nieuwGesprekId = () => (crypto.randomUUID ? crypto.randomUUID() : `g-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`);
  let gesprekId = null;
  try { gesprekId = sessionStorage.getItem("jarvis-gesprek"); } catch { /* nieuw */ }
  if (!gesprekId) gesprekId = nieuwGesprekId();
  let geheugenOpen = false;
  // Bijlagen (D-20261121-092556439): meerdere afbeeldingen, PDF's en tekstbestanden per bericht. Een afbeelding wordt
  // vóór het versturen verkleind (de server accepteert maar een kleine aanvraag). Bijlagen blijven alleen in het geheugen;
  // sessionStorage bewaart het gesprek met alleen hun namen.
  let chatBijlagen = [];
  const MAX_BIJLAGEN = 6;
  // Binaire inhoud (base64) per aanvraag; de server hanteert dezelfde grens, Vercel weigert boven 4,5 MB.
  const MAX_BINAIR = 3_400_000;
  const MAX_PDF_BYTES = 2_000_000;
  const MAX_BESTAND_TEKENS = 50_000;
  const BEELDTYPEN = ["image/png", "image/jpeg", "image/gif", "image/webp"];
  const TEKSTEXTENSIES = /\.(txt|md|csv|json|log|xml|ya?ml|html?|sql|ts|js|mjs|css)$/i;
  const isTekstbestand = (f) => f.type.startsWith("text/") || ["application/json", "application/xml"].includes(f.type) || TEKSTEXTENSIES.test(f.name);
  async function maakAfbeelding(bestand) {
    const bron = await createImageBitmap(bestand);
    const f = Math.min(1, 1280 / Math.max(bron.width, bron.height));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(bron.width * f)); c.height = Math.max(1, Math.round(bron.height * f));
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(bron, 0, 0, c.width, c.height);
    const url = c.toDataURL("image/jpeg", 0.85);
    return { soort: "afbeelding", naam: bestand.name || "afbeelding", media: "image/jpeg", data: url.slice(url.indexOf(",") + 1), url };
  }
  const leesBase64 = (bestand) => new Promise((ok, mis) => {
    const r = new FileReader();
    r.onload = () => { const u = String(r.result); ok(u.slice(u.indexOf(",") + 1)); };
    r.onerror = () => mis(r.error);
    r.readAsDataURL(bestand);
  });
  async function maakBijlage(bestand) {
    if (BEELDTYPEN.includes(bestand.type)) return maakAfbeelding(bestand);
    if (bestand.type === "application/pdf" || /\.pdf$/i.test(bestand.name)) {
      if (bestand.size > MAX_PDF_BYTES) throw new Error(`${bestand.name} is te groot; een PDF mag hoogstens 2 MB zijn.`);
      return { soort: "pdf", naam: bestand.name, data: await leesBase64(bestand) };
    }
    if (isTekstbestand(bestand)) {
      let tekst = await bestand.text();
      if (!tekst.trim()) throw new Error(`${bestand.name} is leeg.`);
      if (tekst.length > MAX_BESTAND_TEKENS) tekst = tekst.slice(0, MAX_BESTAND_TEKENS - 40) + "\n…[afgekapt: bestand te lang]";
      return { soort: "tekst", naam: bestand.name, tekst };
    }
    throw new Error(`${bestand.name}: dit bestandstype kan ik niet lezen. Kies een afbeelding, PDF of tekstbestand.`);
  }
  const binairVan = (lijst) => lijst.reduce((n, x) => n + (x.data?.length ?? 0), 0);
  function tekenVoorbeeld() {
    const v = $("chatvoorbeeld");
    if (!v) return;
    v.hidden = !chatBijlagen.length;
    v.innerHTML = chatBijlagen.map((x, i) => `<div class="stuk">${x.url ? `<img src="${x.url}" alt="Voorbeeld van ${esc(x.naam)}">` : `<span aria-hidden="true">📄</span>`}<span class="bestandnaam">${esc(x.naam)}</span><button type="button" data-wis="${i}" aria-label="${esc(x.naam)} verwijderen">Verwijder</button></div>`).join("");
    v.onclick = (ev) => { const k = ev.target.closest("[data-wis]"); if (k) { chatBijlagen.splice(Number(k.dataset.wis), 1); tekenVoorbeeld(); } };
  }
  async function kiesBestanden(bestanden) {
    const lijst = [...(bestanden ?? [])];
    if (!lijst.length) return;
    const fouten = [];
    for (const bestand of lijst) {
      if (chatBijlagen.length >= MAX_BIJLAGEN) { fouten.push(`Hoogstens ${MAX_BIJLAGEN} bijlagen per bericht; de rest is niet toegevoegd.`); break; }
      try {
        const x = await maakBijlage(bestand);
        if (binairVan([...chatBijlagen, x]) > MAX_BINAIR) { fouten.push(`${bestand.name} past niet meer in dit bericht; stuur het in een volgend bericht.`); continue; }
        chatBijlagen.push(x);
      } catch (e) { fouten.push(e instanceof Error && !(e instanceof DOMException) ? e.message : `${bestand.name} kon ik niet lezen.`); }
    }
    if (fouten.length) { chat.push({ rol: "jarvis", tekst: fouten.join("\n") }); tekenChat(); }
    tekenVoorbeeld();
  }
  const bewaarChat = () => { try { sessionStorage.setItem("jarvis-chat", JSON.stringify(chat.slice(-40).map(({ beeld, afbeelding, bijlagen, ...b }) => b))); sessionStorage.setItem("jarvis-gesprek", gesprekId); sessionStorage.setItem("jarvis-chat-modus", chatModus); } catch { /* geen opslag: het gesprek blijft in het geheugen */ } };

  function berichtHtml(b) {
    let extra = "";
    if (b.doelId) {
      const d = alleDoelen.find((x) => x.id === b.doelId);
      if (d) {
        const soort = ["klaar", "vast", "gesloten"].includes(d.status) ? d.status : "lopend";
        extra = `<div class="klein">${esc(LABEL[d.status] ?? d.status)}${d.status === "klaar" ? " — KLAAR" : ""}</div>${soort === "lopend" ? stappen(d.status) : ""}${["klaar", "vast"].includes(d.status) && d.uitkomst ? `<div class="klein">${esc(d.uitkomst)}</div>` : ""}`;
      }
    }
    // Nieuwe berichten dragen hun bijlagen (met voorbeeld zolang ze in het geheugen staan) en de namen; oudere één afbeelding.
    const stukken = b.bijlagen ? b.bijlagen.map((x) => x.url ? `<img src="${x.url}" alt="${esc(x.naam)}">` : `<span class="klein">📄 ${esc(x.naam)}</span>`)
      : b.bijlageNamen?.length ? b.bijlageNamen.map((n) => `<span class="klein">📎 ${esc(n)}</span>`)
      : b.beeld ? [`<img src="${b.beeld}" alt="Bijgevoegde afbeelding">`] : b.metBeeld ? [`<span class="klein">[afbeelding]</span>`] : [];
    const beeld = stukken.length ? `<div class="bijlagen">${stukken.join("")}</div>` : "";
    if (b.spar && b.rol !== "jij") {
      if (b.onthouden?.length) extra += `<div class="klein">Onthouden: ${b.onthouden.map((o) => esc(`${o.soort}: ${o.tekst}`)).join(" · ")}</div>`;
      extra += b.doelId ? "" : `<div><button type="button" class="klein" data-doelvan="${chat.indexOf(b)}">Maak hier een doel van</button></div>`;
    }
    return `<div class="bericht ${b.rol === "jij" ? "jij" : "jarvis"}">${beeld}${esc(b.tekst)}${extra}</div>`;
  }

  // Een doel uit een sparsessie ontstaat alleen hier: de eigenaar drukt zelf op de knop (expliciete autorisatie).
  async function doelUitSpar(index) {
    const antwoord = chat[index];
    const vraag = [...chat.slice(0, index)].reverse().find((b) => b.rol === "jij");
    if (!antwoord || !vraag) return;
    const eerste = String(vraag.tekst).split("\n").map((r) => r.trim()).find(Boolean) ?? "Doel uit sparsessie";
    const titel = window.prompt("Titel van het doel", eerste.length > 80 ? `${eerste.slice(0, 77)}…` : eerste);
    if (!titel) return;
    // Bijlagen gaan met naam mee, tekstbestanden letterlijk (zolang ze nog in het geheugen staan).
    const namen = vraag.bijlageNamen ?? [];
    const teksten = (vraag.bijlagen ?? []).filter((x) => x.soort === "tekst").map((x) => `--- Inhoud van ${x.naam} ---\n${x.tekst}\n--- Einde van ${x.naam} ---`);
    const bijlageDeel = namen.length ? `\n\nBijlagen van de eigenaar (${namen.length}):\n${namen.map((n) => `- ${n}`).join("\n")}${teksten.length ? `\n\n${teksten.join("\n\n")}` : ""}` : "";
    const opdracht = `${vraag.tekst}\n\nUit een sparsessie met Jarvis; zijn laatste bijdrage:\n${antwoord.tekst}${bijlageDeel}`;
    try {
      const id = await rpc("doel_nieuw", { p_titel: titel.slice(0, 120), p_opdracht: opdracht.slice(0, 20000), p_acceptatie_url: null });
      antwoord.doelId = id;
      bewaarChat();
      await laad();
    } catch (e) {
      chat.push({ rol: "jarvis", tekst: `Doel maken lukte niet: ${e instanceof Error ? e.message : String(e)}` });
      bewaarChat(); tekenChat();
    }
  }

  function tekenGeheugen() {
    const l = $("geheugenlijst");
    if (!l) return;
    l.hidden = !geheugenOpen;
    $("geheugenknop").setAttribute("aria-expanded", String(geheugenOpen));
    $("geheugenknop").textContent = `Wat Jarvis onthoudt (${inzichten.length})`;
    l.innerHTML = inzichten.length
      ? inzichten.map((x) => { const c = objectVan(x.context); return `<div class="inzicht"><div><b>${esc(c.inzicht_soort ?? "inzicht")}</b>${c.project ? ` · ${esc(c.project)}` : ""} — ${esc(x.tekst)}<div class="klein">${esc(tijd(x.op))}${c.bron?.gesprek ? ` · uit gesprek ${esc(String(c.bron.gesprek).slice(0, 8))}` : ""}</div></div><button type="button" data-vergeet="${esc(x.id)}">Vergeet</button></div>`; }).join("")
      : `<div class="klein">Jarvis heeft nog niets onthouden. In de sparmodus legt hij besluiten, voorkeuren en feiten vast die later tellen.</div>`;
  }

  // Vergeten = de tekst wissen en het inzicht als gewist markeren; Jarvis leest het daarna nooit meer.
  async function vergeet(id) {
    const x = inzichten.find((i) => String(i.id) === id);
    if (!x || !window.confirm(`Jarvis vergeet: "${x.tekst}"?`)) return;
    const r = await client.from("berichten").update({ tekst: "", context: { ...objectVan(x.context), gewist: true, gewist_op: new Date().toISOString() } }).eq("id", x.id);
    if (r.error) throw r.error;
    inzichten = inzichten.filter((i) => i !== x);
    tekenGeheugen();
  }

  function tekenModus() {
    if (!$("modus-sparren")) return;
    $("modus-sparren").setAttribute("aria-pressed", String(chatModus === "sparren"));
    $("modus-opdracht").setAttribute("aria-pressed", String(chatModus === "opdracht"));
    $("modusuitleg").textContent = chatModus === "sparren"
      ? "Sparren: Jarvis denkt kritisch mee en onthoudt besluiten, maar start nooit zelf werk."
      : "Opdracht: Jarvis maakt van een concrete opdracht een doel en de keten bouwt het.";
    $("chatin").placeholder = chatModus === "sparren" ? "Waar wil je over sparren?" : "Stel een vraag of geef een opdracht";
  }

  function tekenChat() {
    const log = $("chatlog");
    if (!log) return;
    const onderaan = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    log.innerHTML = chat.length ? chat.map(berichtHtml).join("") + (chatBezig ? `<div class="bericht jarvis klein">Jarvis denkt na…</div>` : "") : `<div class="klein">Jij bepaalt wat, Jarvis bepaalt hoe. Stel een vraag of geef een opdracht.</div>`;
    if (onderaan || chatBezig) log.scrollTop = log.scrollHeight;
  }

  // Wat er per bericht naar de server gaat. Bijlagen van oudere berichten gaan alleen mee zolang ze binnen de grens passen
  // (nieuwste eerst); daarbuiten blijft alleen hun naam in de tekst staan.
  function gesprekVoorServer() {
    let ruimte = MAX_BINAIR;
    return [...chat].reverse().map((b) => {
      const uit = { rol: b.rol, tekst: b.tekst };
      if (b.bijlagen?.length) {
        const mee = [];
        const weg = [];
        for (const x of b.bijlagen) {
          const n = x.data?.length ?? 0;
          if (n > ruimte) { weg.push(x.naam); continue; }
          ruimte -= n;
          mee.push(x.soort === "tekst" ? { soort: "tekst", naam: x.naam, tekst: x.tekst } : { soort: x.soort, naam: x.naam, ...(x.media ? { media: x.media } : {}), data: x.data });
        }
        if (mee.length) uit.bijlagen = mee;
        if (weg.length) uit.tekst = `${uit.tekst}\n[eerder meegestuurd: ${weg.join(", ")}]`.trim();
      } else if (b.afbeelding && b.afbeelding.data.length <= ruimte) {
        ruimte -= b.afbeelding.data.length;
        uit.afbeelding = b.afbeelding;
      }
      return uit;
    }).reverse();
  }

  async function stuurChat(tekst, bijlagen) {
    chat.push({ rol: "jij", tekst, ...(bijlagen.length ? { bijlagen, bijlageNamen: bijlagen.map((x) => x.naam) } : {}) });
    chatBezig = true; bewaarChat(); tekenChat();
    try {
      const { data: { session } } = await client.auth.getSession();
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "content-type": "application/json", authorization: `Bearer ${session?.access_token ?? ""}` },
        body: JSON.stringify({ modus: chatModus, gesprek_id: gesprekId, gesprek: gesprekVoorServer() }),
      });
      const uit = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(uit.fout ?? `Chat gaf ${r.status}`);
      chat.push({ rol: "jarvis", tekst: uit.antwoord, doelId: uit.doel?.id ?? null, ...(uit.modus === "sparren" ? { spar: true, onthouden: uit.onthouden ?? [] } : {}) });
      if (uit.doel || uit.onthouden?.length) await laad();
    } catch (e) {
      chat.push({ rol: "jarvis", tekst: `Dat lukte niet: ${e instanceof Error ? e.message : String(e)}` });
    } finally {
      chatBezig = false; bewaarChat(); tekenChat();
    }
  }

  function koppelChat() {
    $("chatin").value = chatConcept;
    $("chatin").oninput = (ev) => { chatConcept = ev.target.value; };
    $("chatin").onkeydown = (ev) => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("chatvorm").requestSubmit(); } };
    $("chatvorm").onsubmit = (ev) => {
      ev.preventDefault();
      const tekst = $("chatin").value.trim();
      if ((!tekst && !chatBijlagen.length) || chatBezig) return;
      const mee = chatBijlagen;
      $("chatin").value = ""; chatConcept = ""; chatBijlagen = []; tekenVoorbeeld();
      stuurChat(tekst, mee);
    };
    $("chatbijlage").onclick = () => $("chatbestand").click();
    $("chatbestand").onchange = (ev) => { kiesBestanden(ev.target.files).finally(() => { ev.target.value = ""; }); };
    const vorm = $("chatvorm");
    vorm.ondragover = (ev) => { ev.preventDefault(); vorm.classList.add("sleep"); };
    vorm.ondragleave = () => vorm.classList.remove("sleep");
    vorm.ondrop = (ev) => { ev.preventDefault(); vorm.classList.remove("sleep"); kiesBestanden(ev.dataTransfer.files); };
    $("chatin").onpaste = (ev) => { const f = [...ev.clipboardData.files]; if (f.length) { ev.preventDefault(); kiesBestanden(f); } };
    $("modus-sparren").onclick = () => { chatModus = "sparren"; bewaarChat(); tekenModus(); };
    $("modus-opdracht").onclick = () => { chatModus = "opdracht"; bewaarChat(); tekenModus(); };
    $("chatnieuw").onclick = () => { if (chatBezig) return; chat = []; gesprekId = nieuwGesprekId(); bewaarChat(); tekenChat(); };
    $("geheugenknop").onclick = () => { geheugenOpen = !geheugenOpen; tekenGeheugen(); };
    $("geheugenlijst").onclick = (ev) => { const k = ev.target.closest("[data-vergeet]"); if (k) vergeet(k.dataset.vergeet).catch((e) => melding(e.message ?? String(e))); };
    $("chatlog").onclick = (ev) => { const k = ev.target.closest("[data-doelvan]"); if (k) doelUitSpar(Number(k.dataset.doelvan)); };
    tekenModus();
    tekenGeheugen();
    tekenVoorbeeld();
    tekenChat();
  }

  // Ideeën (D-20261117-194518764): een eigen plek om een idee vast te houden zonder dat Jarvis eraan begint. Een idee is
  // een bericht van de eigenaar met context.idee, dat meteen de status 'verwerkt' krijgt: de berichtenwachtrij (status
  // 'nieuw') pakt het dus nooit op, en er is geen nieuwe tabel of migratie nodig. Pas "Maak er een doel van" start werk.
  const ideeen = () => berichten.filter((b) => b.van === "eigenaar" && objectVan(b.context).idee === true).reverse();
  const ideeOpen = (b) => { const c = objectVan(b.context); return !c.gearchiveerd && !c.doel; };
  const ideeConcept = { tekst: "", titel: "" };
  function ideeKaart(b) {
    const c = objectVan(b.context);
    const doel = c.doel ? alleDoelen.find((d) => d.id === c.doel) : null;
    const stand = c.doel ? `<span class="badge">${doel ? esc(LABEL[doel.status] ?? doel.status) : "doel"}</span>` : c.gearchiveerd ? `<span class="badge">gearchiveerd</span>` : "";
    const knoppen = ideeOpen(b)
      ? `<button class="hoofd" data-idee="doel">Maak er een doel van</button><button data-idee="archiveer">Archiveer</button>`
      : c.gearchiveerd ? `<button data-idee="terug">Terugzetten</button>` : "";
    return `<div class="kaart" data-idee-id="${esc(b.id)}"><h3>${esc(c.titel || String(b.tekst).split("\n")[0].slice(0, 80))}${stand}</h3>
      <div class="klein">${esc(tijd(b.op))}${c.doel ? ` · doel ${esc(c.doel)}` : ""}</div>
      <p class="opdracht">${esc(b.tekst)}</p>${knoppen}</div>`;
  }
  function weergaveIdeeen() {
    const alle = ideeen();
    const open = alle.filter(ideeOpen), verder = alle.filter((b) => !ideeOpen(b));
    const fout = beslissingFout ? `<div class="melding">${esc(beslissingFout)}</div>` : "";
    $("inhoud").innerHTML = `<h2 style="margin-top:18px">Ideeën <span class="tel">${open.length}</span></h2>
      <div class="subtekst">Hier bewaar je een idee zonder dat Jarvis eraan begint. Maak er een doel van zodra je het wilt laten bouwen.</div>${fout}
      <div class="invoer"><h2>Nieuw idee</h2>
        <div class="rij"><input id="it" placeholder="Titel, optioneel" aria-label="Titel van het idee" value="${esc(ideeConcept.titel)}">
          <textarea class="breed" id="io" rows="3" placeholder="Wat is het idee?" aria-label="Idee">${esc(ideeConcept.tekst)}</textarea></div>
        <button class="hoofd" id="iv">Bewaar idee</button></div>
      ${open.length ? open.map(ideeKaart).join("") : `<div class="leeg">Nog geen ideeën.</div>`}
      ${verder.length ? inklapBlok("ideeen:verder", "Omgezet en gearchiveerd", verder.map((b) => ({ id: b.id, idee: b })), "") : ""}`;
    $("io").oninput = (ev) => { ideeConcept.tekst = ev.target.value; };
    $("it").oninput = (ev) => { ideeConcept.titel = ev.target.value; };
    $("iv").onclick = () => zeg(async () => {
      const tekst = $("io").value.trim(), titel = $("it").value.trim();
      if (!tekst) throw new Error("Schrijf eerst het idee op.");
      const r = await client.from("berichten").insert({ van: "eigenaar", tekst, status: "verwerkt", verwerkt_op: new Date().toISOString(),
        verwerking: "Idee van de eigenaar; geen opdracht.", context: { idee: true, ...(titel ? { titel } : {}) } });
      if (r.error) throw r.error;
      ideeConcept.tekst = ""; ideeConcept.titel = "";
    });
  }
  async function ideeActie(id, wat) {
    const b = berichten.find((x) => String(x.id) === id);
    if (!b) return;
    const c = objectVan(b.context);
    let nieuw;
    if (wat === "doel") {
      const titel = c.titel || String(b.tekst).split("\n")[0].slice(0, 80);
      const doel = await rpc("doel_nieuw", { p_titel: titel, p_opdracht: b.tekst, p_acceptatie_url: null });
      nieuw = { ...c, doel: doel ?? true };
    } else if (wat === "archiveer") nieuw = { ...c, gearchiveerd: true };
    else if (wat === "terug") { nieuw = { ...c }; delete nieuw.gearchiveerd; }
    else return;
    const r = await client.from("berichten").update({ context: nieuw }).eq("id", b.id);
    if (r.error) throw r.error;
  }

  function weergaveProjecten() {
    $("inhoud").innerHTML = `<h2 style="margin-top:18px">Projecten <span class="tel">${PROJECTEN.length}</span></h2>
      <div class="projecten">${PROJECTEN.map((p) => {
        const t = splits(doelenVanProject(p));
        const subs = p.subprojecten ?? [];
        return `<a class="projectkaart" href="#/projecten/${esc(p.sleutel)}"><h3>${esc(p.naam)}</h3><div class="klein">${esc(p.omschrijving)}</div>
          ${subs.length ? `<div class="klein">Subprojecten: ${subs.map((s) => esc(s.naam)).join(" · ")}</div>` : ""}
          ${telrij(t)}</a>`;
      }).join("")}</div>
      ${projectFormulier(null)}`;
    koppelProjectFormulier(null);
  }

  // Formulier voor een nieuw project (ouder = null) of een nieuw subproject van project ouder.
  function projectFormulier(ouder) {
    const k = ouder ? ouder.sleutel : "", c = projectConcept[k] ?? {};
    return `<div class="invoer"><h2>${ouder ? `Nieuw subproject voor ${esc(ouder.naam)}` : "Nieuw project"}</h2>
        <div class="rij"><input id="pn" placeholder="Naam" aria-label="Naam van het ${ouder ? "subproject" : "project"}" value="${esc(c.naam ?? "")}">
          ${ouder ? "" : `<input id="pr" placeholder="Repository (eigenaar/naam), optioneel" aria-label="Repository, optioneel" value="${esc(c.repo ?? "")}">`}
          <textarea class="breed" id="po" rows="2" placeholder="Korte omschrijving" aria-label="Omschrijving">${esc(c.omschrijving ?? "")}</textarea></div>
        <button class="hoofd" id="pv">${ouder ? "Maak subproject" : "Maak project"}</button></div>`;
  }
  function koppelProjectFormulier(ouder) {
    const k = ouder ? ouder.sleutel : "";
    const c = (projectConcept[k] ??= {});
    $("pn").oninput = (ev) => { c.naam = ev.target.value; };
    $("po").oninput = (ev) => { c.omschrijving = ev.target.value; };
    if ($("pr")) $("pr").oninput = (ev) => { c.repo = ev.target.value; };
    $("pv").onclick = () => zeg(async () => {
      const naam = $("pn").value.trim(), omschrijving = $("po").value.trim(), repo = $("pr") ? $("pr").value.trim() : "";
      const sleutel = sleutelVan(naam);
      if (!sleutel) throw new Error("Geef het " + (ouder ? "subproject" : "project") + " eerst een naam.");
      if (repo && !/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo)) throw new Error("Schrijf de repository als eigenaar/naam, of laat hem leeg.");
      const bestaand = ouder ? (ouder.subprojecten ?? []) : PROJECTEN;
      if (bestaand.some((x) => x.sleutel === sleutel)) throw new Error(`Er is al een ${ouder ? "subproject" : "project"} met de naam ${naam}.`);
      const projectdef = { sleutel, naam, omschrijving, ...(repo ? { repo } : {}), ...(ouder ? { ouder: ouder.sleutel } : {}) };
      const r = await client.from("berichten").insert({ van: "eigenaar", tekst: (ouder ? `Nieuw subproject van ${ouder.naam}: ` : "Nieuw project: ") + naam,
        status: "verwerkt", verwerkt_op: new Date().toISOString(), verwerking: "Project van de eigenaar; geen opdracht.", context: { projectdef } });
      if (r.error) throw r.error;
      delete projectConcept[k];
    });
  }

  const telrij = (t) => `<div class="telrij"><span class="badge">${t.lopend.length} lopend</span><span class="badge ${t.vast.length ? "MISLUKT" : ""}">${t.vast.length} vastgelopen</span><span class="badge KLAAR">${t.klaar.length} klaar</span></div>`;

  // Projectpagina en subprojectpagina hebben dezelfde opbouw; alleen de doelen en de terugweg verschillen.
  function weergavePlek({ terug, terugLabel, naam, omschrijving, repo, extra, doelen, plek }) {
    const { lopend, vast, klaar, gesloten } = splits(doelen);
    const status = vast.length ? "Aandacht nodig: er is vastgelopen werk." : lopend.length ? "In ontwikkeling." : "Rustig: er loopt nu niets.";
    const recent = klaar.slice(0, 3);
    $("inhoud").innerHTML = `<a class="terug" href="${esc(terug)}">← ${esc(terugLabel)}</a>
      <div class="kaart"><h3 style="font-size:22px">${esc(naam)}</h3><div class="klein">${esc(omschrijving)}</div>
        <p><span class="badge ${vast.length ? "MISLUKT" : "KLAAR"}">${esc(status)}</span></p>
        ${repo ? `<p class="klein">Repository: <a href="https://github.com/${esc(repo)}">${esc(repo)}</a></p>` : ""}</div>
      ${extra}
      ${invoerBlok(plek)}
      <div class="raster">
        <section><h2>Nu in ontwikkeling <span class="tel">${lopend.length}</span></h2>${lijst(lopend, "Niets in ontwikkeling.")}
          <h2 style="margin-top:22px">Vastgelopen <span class="tel">${vast.length}</span></h2>${lijst(vast, "Niets vastgelopen.")}</section>
        <section><h2>Recent afgerond <span class="tel">${recent.length}</span></h2>${lijst(recent, "Nog niets afgerond.")}
          ${inklapBlok(plek.label + ":klaar", "Historie", klaar.slice(3), "Geen oudere doelen.")}
          ${geslotenBlok(gesloten, plek.label)}</section>
      </div>`;
    koppelInvoer(plek);
  }

  function weergaveProject(p) {
    const subs = p.subprojecten ?? [];
    const extra = subs.length
      ? `<h2 style="margin-top:18px">Subprojecten <span class="tel">${subs.length}</span></h2>
        <div class="projecten">${subs.map((sp) => `<a class="projectkaart" href="#/projecten/${esc(p.sleutel)}/${esc(sp.sleutel)}"><h3>${esc(sp.naam)}</h3><div class="klein">${esc(sp.omschrijving)}</div>
          ${telrij(splits(doelenVanPlek(p.sleutel + "/" + sp.sleutel)))}</a>`).join("")}</div>`
      : "";
    // Op de projectpagina staan alle doelen van het project, ook die van zijn subprojecten.
    weergavePlek({ terug: "#/projecten", terugLabel: "Projecten", naam: p.naam, omschrijving: p.omschrijving, repo: p.repo, extra: extra + projectFormulier(p),
      doelen: doelenVanProject(p), plek: { naam: p.naam, label: p.sleutel } });
    koppelProjectFormulier(p);
  }

  function weergaveSubproject(p, sp) {
    weergavePlek({ terug: "#/projecten/" + p.sleutel, terugLabel: p.naam, naam: `${p.naam} · ${sp.naam}`, omschrijving: sp.omschrijving, repo: p.repo, extra: "",
      doelen: doelenVanPlek(p.sleutel + "/" + sp.sleutel), plek: { naam: sp.naam, label: p.sleutel + "/" + sp.sleutel } });
  }

  // Drie routes onder #/projecten: het overzicht, één project (#/projecten/<project>) en één subproject
  // (#/projecten/<project>/<subproject>). Een onbekende sleutel valt terug op het overzicht. #/ideeen is de ideeënlijst.
  function teken() {
    const route = location.hash.replace(/^#\/?/, "");
    const [deel, sleutel, subsleutel] = route.split("/");
    for (const n of ["nav-cc", "nav-pr", "nav-id"]) $(n).removeAttribute("aria-current");
    const project = deel === "projecten" ? PROJECTEN.find((p) => p.sleutel === sleutel) : null;
    const sub = project && subsleutel ? (project.subprojecten ?? []).find((sp) => sp.sleutel === subsleutel) : null;
    $("nav-" + (deel === "projecten" ? "pr" : deel === "ideeen" ? "id" : "cc")).setAttribute("aria-current", "page");
    if (deel === "ideeen") weergaveIdeeen(); else if (sub) weergaveSubproject(project, sub); else if (project) weergaveProject(project); else if (deel === "projecten") weergaveProjecten(); else weergaveCommandCenter();
  }

  // Eén luisteraar voor het openklappen en de knoppen op alle doelkaarten, in elke weergave.
  $("inhoud").addEventListener("input", (ev) => { const id = ev.target.dataset?.concept; if (id) concepten[id] = ev.target.value; });
  $("inhoud").addEventListener("click", (ev) => {
    const bk = ev.target.closest("button[data-beslis]");
    if (bk) {
      const wat = bk.dataset.beslis;
      if (wat === "afwijzen" && !confirm("Dit akkoord afwijzen? Jarvis voegt deze pull request dan niet samen.")) return;
      bk.disabled = true;
      zeg(() => beslis(bk.closest("[data-bericht]").dataset.bericht, wat));
      return;
    }
    const ik = ev.target.closest("button[data-idee]");
    if (ik) {
      const wat = ik.dataset.idee;
      if (wat === "doel" && !confirm("Van dit idee een doel maken? Jarvis gaat het dan bouwen.")) return;
      ik.disabled = true;
      zeg(() => ideeActie(ik.closest("[data-idee-id]").dataset.ideeId, wat));
      return;
    }
    const knop = ev.target.closest("button[data-actie]");
    if (knop?.dataset.actie === "vouw") {
      const blok = knop.dataset.blok;
      if (uitgeklapt.has(blok)) uitgeklapt.delete(blok); else uitgeklapt.add(blok);
      teken();
      return;
    }
    if (knop?.dataset.actie === "pagina") {
      paginas[knop.dataset.blok] = (paginas[knop.dataset.blok] ?? 0) + Number(knop.dataset.stap);
      teken();
      return;
    }
    if (knop?.dataset.actie === "open") {
      const wie = knop.dataset.id;
      if (geopend.has(wie)) geopend.delete(wie); else geopend.add(wie);
      teken();
      return;
    }
    const blok = knop?.closest(".acties");
    if (!blok) return;
    const id = blok.dataset.id;
    if (knop.dataset.actie === "reageer") {
      const reactie = blok.querySelector("textarea").value.trim();
      if (!reactie) { melding("Schrijf eerst je reactie; Jarvis pakt het doel daarmee weer op."); return; }
      zeg(async () => { await rpc("doel_reageer", { p_id: id, p_reactie: reactie }); delete concepten[id]; geopend.delete(id); });
    } else if (knop.dataset.actie === "verplaats") {
      const plek = blok.querySelector("select[data-plek]").value;
      const d = alleDoelen.find((x) => x.id === id);
      if (!d) return;
      if (plek === (projectVan(d) ?? "")) { melding("Dit doel staat daar al."); return; }
      const keuze = plekKeuzes(PROJECTEN).find((k) => k.plek === plek);
      zeg(async () => {
        const r = await client.from("berichten").insert({ van: "eigenaar", tekst: `Doel ${d.titel} verplaatst naar ${keuze ? keuze.naam : plek}.`,
          status: "verwerkt", verwerkt_op: new Date().toISOString(), verwerking: "Verplaatsing door de eigenaar; geen opdracht.", context: { verplaatsing: { doel: id, plek } } });
        if (r.error) throw r.error;
      });
    } else if (knop.dataset.actie === "sluit" && confirm("Dit doel sluiten? Jarvis werkt er niet meer aan en het verdwijnt uit Vastgelopen.")) {
      zeg(async () => { await rpc("doel_sluit", { p_id: id }); delete concepten[id]; geopend.delete(id); });
    }
  });

  function login(melding_) {
    $("status").textContent = "inloggen";
    $("inhoud").innerHTML = `<div class="kaart inlog"><p>Log in; alleen de eigenaar ziet iets.</p>${melding_ ? `<div class="melding">${esc(melding_)}</div>` : ""}
      <form id="lf"><input name="e" type="email" placeholder="e-mail" autocomplete="username" required><input name="w" type="password" placeholder="wachtwoord" autocomplete="current-password" required><button class="hoofd" type="submit">Inloggen</button></form></div>`;
    $("lf").onsubmit = async (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const { error } = await client.auth.signInWithPassword({ email: String(f.get("e")), password: String(f.get("w")) });
      if (error) login("Inloggen mislukt: " + error.message);
    };
  }

  async function start() {
    const cfg = window.JARVIS_SUPABASE;
    if (!cfg?.url || !cfg?.key) { $("status").textContent = "config.js ontbreekt in deze uitrol — de pagina weet niet welke database ze moet lezen"; return; }
    await new Promise((ok, nee) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"; sc.onload = ok; sc.onerror = nee; document.head.appendChild(sc); });
    client = window.supabase.createClient(cfg.url, cfg.key, { db: { schema: "jarvis" } });
    const { data: { session } } = await client.auth.getSession();
    if (!session) { login(""); await new Promise((ok) => client.auth.onAuthStateChange((_e, s) => { if (s) ok(); })); }
    client.auth.onAuthStateChange((_e, s) => { if (!s) location.reload(); });
    window.addEventListener("hashchange", teken);
    await laad();
    setInterval(() => laad(true), 15000);
  }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/v3/sw.js", { scope: "/v3/" }).catch(() => {});
  start();
})();
</script>
</body>
</html>
