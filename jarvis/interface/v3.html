<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070b12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="manifest" href="/v3/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Jarvis</title>
<style>
  :root { color-scheme:dark; --bg:#050a14; --bg2:#08111f; --kaart:#0b1626; --kaart2:#0f1d33; --tekst:#e6edf7; --gedempt:#8a9bb4; --lijn:#1f2d44; --accent:#4cc3ff; --accent2:#2b7bff; --goed:#3ddc97; --fout:#ff6b6b; --wacht:#f2c14e; }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body { margin:0; color:var(--tekst); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; min-height:100vh;
    background:radial-gradient(900px 500px at 50% -120px, rgba(76,195,255,.13), transparent 70%), linear-gradient(var(--bg), var(--bg2)); padding:0 16px 56px; }
  .schil { display:block; }
  .zijbalk { position:fixed; top:0; left:0; bottom:0; width:220px; padding:18px 14px; display:flex; flex-direction:column; gap:18px; background:linear-gradient(180deg, rgba(8,17,31,.96), rgba(5,10,20,.96)); border-right:1px solid rgba(76,195,255,.28); box-shadow:0 0 30px rgba(76,195,255,.08); z-index:5; }
  .zijbalk nav { flex-direction:column; border:0; margin:0; gap:6px; }
  .zijbalk nav a { border:1px solid transparent; border-radius:8px; padding:10px 12px; }
  .zijbalk nav a[aria-current="page"] { border-color:rgba(76,195,255,.55); background:rgba(76,195,255,.08); box-shadow:0 0 12px rgba(76,195,255,.18) inset; }
  .zijbalk #status { margin-top:auto; line-height:1.4; align-items:flex-start; }
  .zijbalk #status::before { margin-top:5px; flex:none; }
  main { margin-left:220px; padding:18px 22px 56px; max-width:1500px; }
  @media (max-width:820px) { .zijbalk { position:static; width:auto; flex-direction:row; flex-wrap:wrap; align-items:center; padding:12px 16px; } .zijbalk nav { flex-direction:row; flex-wrap:wrap; } .zijbalk #status { margin:0; } main { margin-left:0; padding:12px 16px 56px; } }
  .bovenrij { display:grid; grid-template-columns:1fr; gap:14px; margin-bottom:14px; }
  @media (min-width:1000px) { .bovenrij { grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); } }
  .paneel { background:linear-gradient(160deg, var(--kaart2), var(--kaart)); border:1px solid rgba(76,195,255,.28); border-radius:12px; padding:14px 16px; box-shadow:0 0 22px rgba(76,195,255,.06), inset 0 0 30px rgba(76,195,255,.03); min-width:0; }
  .paneel > .invoer { margin:0; padding:0; border:0; background:none; box-shadow:none; }
  .ai-kern { display:flex; flex-direction:column; align-items:stretch; text-align:center; min-height:420px; background:radial-gradient(circle at 50% 50%, rgba(76,195,255,.16), transparent 62%), linear-gradient(160deg, var(--kaart2), var(--kaart)); }
  .ai-ring { width:76px; height:76px; margin:14px auto 0; border-radius:50%; position:relative; border:2px solid var(--accent); box-shadow:0 0 34px rgba(76,195,255,.55), inset 0 0 30px rgba(76,195,255,.35); display:flex; align-items:center; justify-content:center; }
  .ai-ring::before { content:""; position:absolute; inset:-9px; border-radius:50%; border:1px dashed rgba(76,195,255,.55); animation:draai 24s linear infinite; }
  .ai-ring::after { content:""; position:absolute; inset:11px; border-radius:50%; border:1px solid rgba(76,195,255,.6); }
  .ai-ring b { width:30px; height:30px; border-radius:50%; background:radial-gradient(circle, #d8f3ff, var(--accent) 55%, var(--accent2)); box-shadow:0 0 30px var(--accent); animation:puls 3s ease-in-out infinite; }
  @keyframes draai { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ai-ring::before, .ai-ring b { animation:none; } }
  .ai-kern h2 { margin:12px 0 4px; justify-content:center; color:var(--accent); letter-spacing:.3em; font-size:14px; }
  .chatlog { flex:1; min-height:160px; max-height:340px; overflow-y:auto; text-align:left; display:flex; flex-direction:column; gap:8px; margin:10px 0; padding:2px; }
  .bericht { max-width:88%; padding:8px 12px; border-radius:12px; border:1px solid var(--lijn); background:var(--bg); font-size:14.5px; overflow-wrap:anywhere; white-space:pre-wrap; }
  .bericht.jij { align-self:flex-end; border-color:rgba(76,195,255,.45); background:rgba(76,195,255,.08); }
  .bericht.jarvis { align-self:flex-start; }
  .bericht .voortgang { margin:8px 0 2px; }
  .chatvorm { display:flex; gap:8px; align-items:flex-end; }
  .chatvorm textarea { resize:none; }
  .chatvorm button { margin:0; flex:none; }
  .chatvorm .invoer { flex:1; min-width:0; }
  .chatvorm .invoer textarea { width:100%; }
  .chatvorm.sleep { outline:2px dashed var(--accent); outline-offset:3px; border-radius:10px; }
  .chatvoorbeeld { display:flex; align-items:center; gap:8px; margin:0 0 8px; }
  .chatvoorbeeld[hidden] { display:none; }
  .chatvoorbeeld img, .bericht img { max-width:160px; max-height:120px; border-radius:8px; border:1px solid var(--lijn); display:block; }
  .bericht img { margin-bottom:6px; }
  .chatvorm .bijlage { padding:8px 10px; }
  .subtekst { color:var(--gedempt); font-size:12px; opacity:.8; margin:-8px 0 12px; }
  .activiteit { list-style:none; margin:0; padding:0; }
  .activiteit li { padding:7px 0; border-bottom:1px solid var(--lijn); font-size:14px; overflow-wrap:anywhere; }
  .activiteit li:last-child { border-bottom:0; }
  .statusrij { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
  .statustegel { border:1px solid var(--lijn); border-radius:10px; padding:8px; text-align:center; background:var(--bg); }
  .statustegel b { display:block; font-size:24px; line-height:1.2; }
  .statustegel span { font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--gedempt); }
  .statustegel.lopend b { color:var(--accent); } .statustegel.vast b { color:var(--fout); } .statustegel.klaar b { color:var(--goed); }
  .dashboard { display:grid; grid-template-columns:1fr; gap:14px; align-items:start; }
  @media (min-width:1000px) { .dashboard { grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr); } }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:22px 0 8px; flex-wrap:wrap; }
  .merk { display:flex; align-items:center; gap:12px; }
  .kern { width:34px; height:34px; border-radius:50%; border:2px solid var(--accent); box-shadow:0 0 18px rgba(76,195,255,.45), inset 0 0 10px rgba(76,195,255,.35); position:relative; flex:none; }
  .kern::after { content:""; position:absolute; inset:9px; border-radius:50%; background:var(--accent); opacity:.85; }
  h1 { font-size:22px; letter-spacing:.14em; text-transform:uppercase; margin:0; font-weight:600; }
  .onder { color:var(--gedempt); font-size:14px; margin:2px 0 0; }
  #status { color:var(--gedempt); font-size:13px; display:flex; align-items:center; gap:8px; }
  #status::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--goed); box-shadow:0 0 8px var(--goed); }
  h2 { font-size:12.5px; margin:0 0 12px; text-transform:uppercase; letter-spacing:.14em; color:var(--gedempt); font-weight:600; display:flex; align-items:center; gap:8px; }
  .tel { background:var(--kaart2); border:1px solid var(--lijn); color:var(--tekst); border-radius:99px; padding:0 8px; font-size:12px; letter-spacing:0; }
  .invoer { margin:18px 0 26px; padding:20px; border-radius:16px; border:1px solid rgba(76,195,255,.35); background:linear-gradient(160deg, var(--kaart2), var(--kaart)); box-shadow:0 0 0 1px rgba(76,195,255,.05), 0 12px 40px rgba(0,0,0,.45), 0 0 40px rgba(76,195,255,.08); }
  .invoer .rij { display:grid; grid-template-columns:1fr; gap:10px; }
  @media (min-width:760px) { .invoer .rij { grid-template-columns:1fr 1fr; } .invoer .breed { grid-column:1 / -1; } }
  .raster { display:grid; grid-template-columns:1fr; gap:22px; align-items:start; }
  @media (min-width:900px) { .raster { grid-template-columns:1.25fr 1fr; } }
  section { min-width:0; }
  .kaart { background:var(--kaart); border:1px solid var(--lijn); border-radius:14px; padding:14px 16px; margin:0 0 10px; }
  .kaart.lopend { border-left:3px solid var(--accent); } .kaart.vast { border-left:3px solid var(--fout); } .kaart.klaar { border-left:3px solid var(--goed); }
  .kaart h3 { margin:0 0 6px; font-size:16px; font-weight:600; overflow-wrap:anywhere; } .klein { color:var(--gedempt); font-size:13px; overflow-wrap:anywhere; }
  .kaart p { margin:8px 0 0; }
  .kaart h3 .kop { font:inherit; font-weight:600; color:inherit; background:none; border:0; padding:0; margin:0; min-height:44px; text-align:left; cursor:pointer; overflow-wrap:anywhere; }
  .kaart h3 .kop::after { content:"▾"; margin-left:8px; color:var(--gedempt); font-size:12px; } .kaart.open h3 .kop::after { content:"▴"; }
  .kaart .samengevat { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .kaart .opdracht { white-space:pre-wrap; overflow-wrap:anywhere; }
  a { color:var(--accent); }
  .badge { display:inline-block; font-size:11.5px; padding:2px 9px; border-radius:99px; border:1px solid var(--lijn); margin-left:8px; vertical-align:middle; letter-spacing:.03em; white-space:nowrap; }
  .KLAAR { color:var(--goed); border-color:var(--goed); } .MISLUKT { color:var(--fout); border-color:var(--fout); }
  .AKKOORD_NODIG, .BESLISSING_NODIG { color:var(--wacht); border-color:var(--wacht); }
  .voortgang { display:flex; gap:4px; margin:10px 0 4px; }
  .voortgang i { flex:1; height:5px; border-radius:3px; background:var(--lijn); }
  .voortgang i.aan { background:linear-gradient(90deg, var(--accent2), var(--accent)); box-shadow:0 0 8px rgba(76,195,255,.4); }
  .voortgang i.nu { animation:puls 1.6s ease-in-out infinite; }
  @keyframes puls { 50% { opacity:.45; } }
  @media (prefers-reduced-motion: reduce) { .voortgang i.nu { animation:none; } }
  button { font:inherit; padding:10px 18px; border-radius:10px; border:1px solid var(--lijn); background:var(--kaart2); color:var(--tekst); cursor:pointer; margin:10px 8px 0 0; min-height:44px; }
  button.hoofd { background:linear-gradient(135deg, var(--accent2), var(--accent)); border-color:transparent; color:#04101f; font-weight:600; }
  button:disabled { opacity:.5; } button:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  input, textarea { font:inherit; width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--lijn); background:var(--bg); color:var(--tekst); margin:0; }
  input::placeholder, textarea::placeholder { color:#5d6e88; }
  .melding { padding:10px 12px; border-radius:10px; border:1px solid var(--fout); color:var(--fout); margin:10px 0; }
  .leeg { color:var(--gedempt); padding:14px; border:1px dashed var(--lijn); border-radius:14px; text-align:center; margin-bottom:10px; }
  .inlog { max-width:420px; margin:12vh auto 0; }
  .inlog input { margin:6px 0; }
  nav { display:flex; gap:6px; margin:6px 0 0; border-bottom:1px solid var(--lijn); }
  nav a { padding:10px 16px; color:var(--gedempt); text-decoration:none; border-bottom:2px solid transparent; min-height:44px; display:flex; align-items:center; letter-spacing:.06em; text-transform:uppercase; font-size:13px; }
  nav a[aria-current="page"] { color:var(--tekst); border-bottom-color:var(--accent); }
  .projecten { display:grid; grid-template-columns:1fr; gap:12px; margin-bottom:14px; }
  @media (min-width:760px) { .projecten { grid-template-columns:1fr 1fr; } }
  a.projectkaart { display:block; text-decoration:none; color:inherit; background:var(--kaart); border:1px solid var(--lijn); border-left:3px solid var(--accent); border-radius:14px; padding:16px; }
  a.projectkaart:hover, a.projectkaart:focus-visible { border-color:var(--accent); }
  a.projectkaart h3 { margin:0 0 6px; font-size:18px; }
  .terug { display:inline-block; margin:14px 0 4px; font-size:14px; }
  .telrij { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .acties { margin-top:12px; padding-top:12px; border-top:1px solid var(--lijn); }
  .kaart.gesloten { opacity:.75; }
  h2 button[data-actie="vouw"] { margin:0 0 0 10px; padding:4px 12px; min-height:32px; font-size:13px; letter-spacing:0; text-transform:none; }
  .bladeren { display:flex; align-items:center; gap:12px; margin:6px 0 10px; }
  .bladeren button { margin:0; }
</style>
</head>
<body>
<div class="schil">
<aside class="zijbalk">
  <div class="merk"><div class="kern" aria-hidden="true"></div><div><h1>Jarvis</h1><div class="onder">Command Center</div></div></div>
  <nav aria-label="Hoofdnavigatie"><a href="#/" id="nav-cc">Command Center</a><a href="#/projecten" id="nav-pr">Projecten</a></nav>
  <div id="status">laden…</div>
</aside>
<main>
  <div id="melding"></div>
  <div id="inhoud"></div>
</main>
</div>
<script src="../config.js"></script>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // Een datum die niet te lezen is toont "onbekend" in plaats van "Invalid Date".
  const tijd = (t) => { const d = new Date(t); return Number.isNaN(d.getTime()) ? "onbekend" : d.toLocaleString("nl-NL"); };
  let client = null;
  const melding = (t) => { $("melding").innerHTML = t ? `<div class="melding">${esc(t)}</div>` : ""; };
  const zeg = async (f) => { try { melding(""); await f(); await laad(); } catch (e) { melding(e.message ?? String(e)); } };
  const rpc = async (naam, args) => { const { data, error } = await client.rpc(naam, args); if (error) throw error; return data; };

  const LABEL = { open: "nieuw", bezig: "Jarvis bouwt", review: "in review", samengevoegd: "wordt uitgerold", klaar: "klaar", vast: "vastgelopen", gesloten: "gesloten" };
  const KLEUR = { klaar: "KLAAR", vast: "MISLUKT" };

  const STAPPEN = ["open", "bezig", "review", "samengevoegd", "klaar"];
  const stappen = (status) => {
    const nu = STAPPEN.indexOf(status);
    return `<div class="voortgang" aria-hidden="true">${STAPPEN.map((_, i) => `<i class="${i <= nu ? "aan" : ""}${i === nu && status !== "klaar" ? " nu" : ""}"></i>`).join("")}</div>`;
  };

  // Een project is een vaste plek; zijn doelen zijn gewone doelen waarvan de opdracht begint met "Project: <sleutel>".
  // Een project kan subprojecten hebben; een doel van een subproject begint met "Project: <project>/<subproject>".
  const PROJECTEN = [
    { sleutel: "kasboek", naam: "Kasboek", omschrijving: "Het bestaande Kasboek-project: kasstromen en saldo, met eigen repository en omgeving.", repo: "lodewijkmaassen/kasboek" },
    { sleutel: "tovas-flow", naam: "ToVas Flow", omschrijving: "ToVas Flow: van gemiste oproep tot gekwalificeerde lead, offerte en review, met eigen repository en omgeving.", repo: "lodewijkmaassen/tovas-flow",
      subprojecten: [
        { sleutel: "gemiste-oproepen", naam: "Gemiste oproepen", omschrijving: "Een gemiste oproep wordt via WhatsApp en de AI-intake een gekwalificeerde lead." },
        { sleutel: "offerte-opvolging", naam: "Offerte opvolging", omschrijving: "Verstuurde offertes bewaken en op het juiste moment opvolgen." },
        { sleutel: "reviews-verzamelen", naam: "Reviews verzamelen", omschrijving: "Na een afgeronde klus om een review vragen." },
      ] },
  ];
  // Volledige plek van een doel: "kasboek", of "tovas-flow/offerte-opvolging" voor een subproject.
  // Bewust precies één subniveau: de eigenaar vroeg project → subproject. Een dieper label ("a/b/c") telt
  // nergens mee; een derde niveau is een nieuwe ontwerpbeslissing, geen uitbreiding van deze regel.
  const projectVan = (d) => { const m = /^Project:\s*([a-z0-9-]+(?:\/[a-z0-9-]+)?)\s*(\n|$)/i.exec(String(d.opdracht ?? "")); return m ? m[1].toLowerCase() : null; };
  // Alle doelen van een project, inclusief die van zijn subprojecten.
  const doelenVanProject = (p) => alleDoelen.filter((d) => { const plek = projectVan(d); return plek === p.sleutel || (plek ?? "").startsWith(p.sleutel + "/"); });
  const doelenVanPlek = (plek) => alleDoelen.filter((d) => projectVan(d) === plek);
  const zonderLabel = (t) => String(t ?? "").replace(/^Project:[^\n]*\n+/i, "");
  let alleDoelen = [];
  // Wat de eigenaar bij een vastgelopen doel al typte, per doel; een verversing op de klok tekent de kaart opnieuw.
  const concepten = {};

  // Welke kaarten de eigenaar heeft opengeklapt; een verversing op de klok tekent ze weer open.
  const geopend = new Set();

  // Na het aanklikken van een kaart: de details en het reactieveld. Reageren kan bij elk doel (bij een afgerond of
  // gesloten doel hervat Jarvis het); sluiten alleen bij een vastgelopen doel.
  function doelActies(d) {
    const sluit = d.status === "vast" ? `<button data-actie="sluit">Sluiten</button>` : "";
    const knop = ["klaar", "vast", "gesloten"].includes(d.status) ? "Reageer en hervat" : "Reageer";
    return `<div class="acties" data-id="${esc(d.id)}">
        <div class="klein">Opdracht</div><p class="opdracht">${esc(zonderLabel(d.opdracht))}</p>
        <textarea rows="3" data-concept="${esc(d.id)}" placeholder="Aanvullende informatie of instructie voor Jarvis" aria-label="Reactie op ${esc(d.titel)}">${esc(concepten[d.id] ?? "")}</textarea>
        <button class="hoofd" data-actie="reageer">${knop}</button>${sluit}</div>`;
  }

  function kaartDoel(d) {
    const pr = d.pr && typeof d.pr.repo === "string" && Number.isInteger(d.pr.nummer) ? ` · <a href="https://github.com/${esc(d.pr.repo)}/pull/${esc(d.pr.nummer)}">${esc(d.pr.repo.split("/")[1])} #${esc(d.pr.nummer)}</a>` : "";
    const soort = ["klaar", "vast", "gesloten"].includes(d.status) ? d.status : "lopend";
    const open = geopend.has(d.id);
    return `<div class="kaart ${esc(soort)}${open ? " open" : ""}"><h3><button type="button" class="kop" data-actie="open" aria-expanded="${esc(open)}" data-id="${esc(d.id)}">${esc(d.titel)}</button><span class="badge ${esc(KLEUR[d.status] ?? "")}">${esc(LABEL[d.status] ?? d.status)}</span></h3>
      <div class="klein">${esc(d.id)} · bijgewerkt ${esc(tijd(d.bijgewerkt))}${pr}</div>
      ${(soort === "lopend" ? stappen(d.status) : "")}
      ${d.uitkomst ? `<p class="klein${open ? "" : " samengevat"}">${esc(d.uitkomst)}</p>` : ""}
      ${(open ? doelActies(d) : "")}</div>`;
  }

  async function laad(auto) {
    // Een verversing op de klok mag nooit een half getypte opdracht wegvegen.
    if (auto === true && document.activeElement && ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
    const doelen = await client.from("doelen").select("*").order("aangemaakt", { ascending: false });
    if (doelen.error) { melding(`Niet te lezen: ${doelen.error.message}`); return; }
    alleDoelen = doelen.data;
    const lopend = splits(alleDoelen).lopend;
    $("status").textContent = `bijgewerkt ${new Date().toLocaleTimeString("nl-NL")} · ${lopend.length} lopend`;
    teken();
  }

  const lijst = (arr, leeg) => (arr.length ? arr.map(kaartDoel).join("") : `<div class="leeg">${esc(leeg)}</div>`);
  // Een gesloten doel is af voor de eigenaar zonder dat het bereikt is: niet lopend, niet vastgelopen, niet klaar.
  const splits = (doelen) => ({
    lopend: doelen.filter((d) => !["klaar", "vast", "gesloten"].includes(d.status)),
    vast: doelen.filter((d) => d.status === "vast"),
    klaar: doelen.filter((d) => d.status === "klaar"),
    gesloten: doelen.filter((d) => d.status === "gesloten"),
  });
  // Klaar, historie en gesloten staan standaard ingeklapt en tonen hoogstens PER_PAGINA doelen tegelijk; de eigenaar klapt
  // ze uit en bladert. Sleutel = weergave + soort, zodat elk blok zijn eigen stand houdt (ook over een verversing heen).
  const PER_PAGINA = 10;
  const uitgeklapt = new Set();
  const paginas = {};
  function inklapBlok(sleutel, titel, arr, leeg) {
    const open = uitgeklapt.has(sleutel);
    const aantal = Math.max(1, Math.ceil(arr.length / PER_PAGINA));
    const nu = Math.min(Math.max(paginas[sleutel] ?? 0, 0), aantal - 1);
    paginas[sleutel] = nu;
    const bladeren = aantal > 1
      ? `<div class="bladeren"><button type="button" data-actie="pagina" data-blok="${esc(sleutel)}" data-stap="-1"${nu === 0 ? " disabled" : ""}>Vorige</button><span class="klein">Pagina ${nu + 1} van ${aantal}</span><button type="button" data-actie="pagina" data-blok="${esc(sleutel)}" data-stap="1"${nu >= aantal - 1 ? " disabled" : ""}>Volgende</button></div>`
      : "";
    return `<h2 style="margin-top:22px">${esc(titel)} <span class="tel">${arr.length}</span>
        <button type="button" data-actie="vouw" data-blok="${esc(sleutel)}" aria-expanded="${open}">${open ? "Inklappen" : "Uitklappen"}</button></h2>
      ${open ? lijst(arr.slice(nu * PER_PAGINA, (nu + 1) * PER_PAGINA), leeg) + bladeren : ""}`;
  }
  const geslotenBlok = (gesloten, ctx) => (gesloten.length ? inklapBlok(ctx + ":gesloten", "Gesloten", gesloten, "") : "");

  // plek = { naam, label } voor een project of subproject; null in het Command Center.
  function invoerBlok(plek) {
    return `<div class="invoer"><h2>${plek ? `Nieuw doel voor ${esc(plek.naam)}` : "Nieuw doel"}</h2>
        <div class="rij"><input id="nt" placeholder="Titel" aria-label="Titel"><input id="nu" placeholder="Waar het te zien is (https://…), optioneel" aria-label="Waar het te zien is, optioneel">
          <textarea class="breed" id="no" rows="4" placeholder="Wat wil je dat Jarvis bereikt?" aria-label="Opdracht"></textarea></div>
        <button class="hoofd" id="nv">Geef doel</button></div>`;
  }

  function koppelInvoer(plek) {
    $("nv").onclick = () => zeg(async () => {
      const opdracht = plek ? "Project: " + plek.label + "\n\n" + $("no").value : $("no").value;
      await rpc("doel_nieuw", { p_titel: $("nt").value, p_opdracht: opdracht, p_acceptatie_url: $("nu").value || null });
    });
  }

  function weergaveCommandCenter() {
    // Teller en lijst komen uit dezelfde bron: ook doelen van projecten (zoals het Kasboek) staan in de lijsten.
    const totaal = splits(alleDoelen);
    const { lopend, vast, klaar, gesloten } = totaal;
    const recent = alleDoelen.slice().sort((x, y) => new Date(y.bijgewerkt) - new Date(x.bijgewerkt)).slice(0, 6);
    const tegel = (soort, n, naam) => `<div class="statustegel ${soort}"><b>${n}</b><span>${naam}</span></div>`;
    $("inhoud").innerHTML = `<div class="bovenrij">
        <div class="paneel ai-kern"><div class="ai-ring" aria-hidden="true"><b></b></div><h2>Jarvis AI Core</h2>
          <div class="chatlog" id="chatlog" role="log" aria-live="polite" aria-label="Gesprek met Jarvis"></div>
          <div class="chatvoorbeeld" id="chatvoorbeeld" hidden></div>
          <form class="chatvorm" id="chatvorm"><input type="file" id="chatbestand" accept="image/png,image/jpeg,image/gif,image/webp" hidden><button type="button" class="bijlage" id="chatbijlage" aria-label="Afbeelding toevoegen" title="Afbeelding toevoegen of hierheen slepen">📎</button><div class="invoer"><textarea id="chatin" rows="2" placeholder="Stel een vraag of geef een opdracht" aria-label="Bericht aan Jarvis"></textarea></div><button class="hoofd" id="chatstuur" type="submit">Stuur</button></form></div>
        <div class="paneel"><h2>Recente activiteit</h2><div class="subtekst">Laatste activiteit van Jarvis</div>${recent.length ? `<ul class="activiteit">${recent.map((d) => `<li>${esc(d.titel)}<span class="badge ${esc(KLEUR[d.status] ?? "")}">${esc(LABEL[d.status] ?? d.status)}</span><div class="klein">${esc(tijd(d.bijgewerkt))}</div></li>`).join("")}</ul>` : `<div class="leeg">Nog geen activiteit.</div>`}</div>
      </div>
      <div class="dashboard">
        <div class="paneel"><h2>Projecten <span class="tel">${PROJECTEN.length}</span></h2>
          ${PROJECTEN.map((p) => `<a class="projectkaart" style="margin-bottom:10px" href="#/projecten/${esc(p.sleutel)}"><h3>${esc(p.naam)}</h3>${telrij(splits(doelenVanProject(p)))}</a>`).join("")}
          <a class="projectkaart" href="#/projecten">Alle projecten bekijken</a></div>
        <div class="paneel"><h2>Taken</h2>
          <div class="statusrij">${tegel("lopend", totaal.lopend.length, "Lopend")}${tegel("vast", totaal.vast.length, "Vastgelopen")}${tegel("klaar", totaal.klaar.length, "Klaar")}${tegel("gesloten", totaal.gesloten.length, "Gesloten")}</div>
          <h2>Lopend <span class="tel">${lopend.length}</span></h2>${lijst(lopend, "Geen lopende doelen.")}
          ${vast.length ? `<h2 style="margin-top:22px">Vastgelopen <span class="tel">${vast.length}</span></h2>${vast.map(kaartDoel).join("")}` : ""}
          ${inklapBlok("cc:klaar", "Klaar", klaar, "Nog niets afgerond.")}
          ${geslotenBlok(gesloten, "cc")}</div>
        <div class="paneel">${invoerBlok(null)}</div>
      </div>`;
    koppelInvoer(null);
    koppelChat();
  }

  // De chat is een voordeur: een vraag krijgt antwoord, een opdracht wordt via de server een gewoon doel.
  // De voortgang van zo'n doel wordt bij elke verversing uit alleDoelen getekend; de chat bewaart alleen het doel-id.
  let chat = [];
  try { chat = JSON.parse(sessionStorage.getItem("jarvis-chat") ?? "[]"); } catch { chat = []; }
  let chatBezig = false;
  let chatConcept = "";
  // De afbeelding wordt vóór het versturen verkleind (de server accepteert maar een kleine aanvraag) en blijft alleen in het
  // geheugen; sessionStorage bewaart het gesprek zonder afbeeldingen.
  let chatAfbeelding = null;
  const BEELDTYPEN = ["image/png", "image/jpeg", "image/gif", "image/webp"];
  async function maakAfbeelding(bestand) {
    if (!BEELDTYPEN.includes(bestand.type)) throw new Error("Kies een PNG-, JPEG-, GIF- of WebP-afbeelding.");
    const bron = await createImageBitmap(bestand);
    const f = Math.min(1, 1280 / Math.max(bron.width, bron.height));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(bron.width * f)); c.height = Math.max(1, Math.round(bron.height * f));
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(bron, 0, 0, c.width, c.height);
    const url = c.toDataURL("image/jpeg", 0.85);
    return { media: "image/jpeg", data: url.slice(url.indexOf(",") + 1), url };
  }
  function tekenVoorbeeld() {
    const v = $("chatvoorbeeld");
    if (!v) return;
    v.hidden = !chatAfbeelding;
    v.innerHTML = chatAfbeelding ? `<img src="${chatAfbeelding.url}" alt="Voorbeeld van de bijgevoegde afbeelding"><button type="button" id="chatwis" aria-label="Afbeelding verwijderen">Verwijder</button>` : "";
    if ($("chatwis")) $("chatwis").onclick = () => { chatAfbeelding = null; tekenVoorbeeld(); };
  }
  async function kiesBestand(bestand) {
    if (!bestand) return;
    try { chatAfbeelding = await maakAfbeelding(bestand); }
    catch (e) { chat.push({ rol: "jarvis", tekst: e instanceof Error && !(e instanceof DOMException) ? e.message : "Die afbeelding kon ik niet lezen." }); tekenChat(); }
    tekenVoorbeeld();
  }
  const bewaarChat = () => { try { sessionStorage.setItem("jarvis-chat", JSON.stringify(chat.slice(-40).map(({ beeld, afbeelding, ...b }) => b))); } catch { /* geen opslag: het gesprek blijft in het geheugen */ } };

  function berichtHtml(b) {
    let extra = "";
    if (b.doelId) {
      const d = alleDoelen.find((x) => x.id === b.doelId);
      if (d) {
        const soort = ["klaar", "vast", "gesloten"].includes(d.status) ? d.status : "lopend";
        extra = `<div class="klein">${esc(LABEL[d.status] ?? d.status)}${d.status === "klaar" ? " — KLAAR" : ""}</div>${soort === "lopend" ? stappen(d.status) : ""}${["klaar", "vast"].includes(d.status) && d.uitkomst ? `<div class="klein">${esc(d.uitkomst)}</div>` : ""}`;
      }
    }
    const beeld = b.beeld ? `<img src="${b.beeld}" alt="Bijgevoegde afbeelding">` : b.metBeeld ? `<div class="klein">[afbeelding]</div>` : "";
    return `<div class="bericht ${b.rol === "jij" ? "jij" : "jarvis"}">${beeld}${esc(b.tekst)}${extra}</div>`;
  }

  function tekenChat() {
    const log = $("chatlog");
    if (!log) return;
    const onderaan = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    log.innerHTML = chat.length ? chat.map(berichtHtml).join("") + (chatBezig ? `<div class="bericht jarvis klein">Jarvis denkt na…</div>` : "") : `<div class="klein">Jij bepaalt wat, Jarvis bepaalt hoe. Stel een vraag of geef een opdracht.</div>`;
    if (onderaan || chatBezig) log.scrollTop = log.scrollHeight;
  }

  async function stuurChat(tekst, afb) {
    chat.push({ rol: "jij", tekst, ...(afb ? { beeld: afb.url, afbeelding: { media: afb.media, data: afb.data }, metBeeld: true } : {}) });
    chatBezig = true; bewaarChat(); tekenChat();
    try {
      const { data: { session } } = await client.auth.getSession();
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "content-type": "application/json", authorization: `Bearer ${session?.access_token ?? ""}` },
        body: JSON.stringify({ gesprek: chat.map((b) => ({ rol: b.rol, tekst: b.tekst, ...(b.afbeelding ? { afbeelding: b.afbeelding } : {}) })) }),
      });
      const uit = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(uit.fout ?? `Chat gaf ${r.status}`);
      chat.push({ rol: "jarvis", tekst: uit.antwoord, doelId: uit.doel?.id ?? null });
      if (uit.doel) await laad();
    } catch (e) {
      chat.push({ rol: "jarvis", tekst: `Dat lukte niet: ${e instanceof Error ? e.message : String(e)}` });
    } finally {
      chatBezig = false; bewaarChat(); tekenChat();
    }
  }

  function koppelChat() {
    $("chatin").value = chatConcept;
    $("chatin").oninput = (ev) => { chatConcept = ev.target.value; };
    $("chatin").onkeydown = (ev) => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("chatvorm").requestSubmit(); } };
    $("chatvorm").onsubmit = (ev) => {
      ev.preventDefault();
      const tekst = $("chatin").value.trim();
      if ((!tekst && !chatAfbeelding) || chatBezig) return;
      const afb = chatAfbeelding;
      $("chatin").value = ""; chatConcept = ""; chatAfbeelding = null; tekenVoorbeeld();
      stuurChat(tekst, afb);
    };
    $("chatbijlage").onclick = () => $("chatbestand").click();
    $("chatbestand").onchange = (ev) => { kiesBestand(ev.target.files[0]); ev.target.value = ""; };
    const vorm = $("chatvorm");
    vorm.ondragover = (ev) => { ev.preventDefault(); vorm.classList.add("sleep"); };
    vorm.ondragleave = () => vorm.classList.remove("sleep");
    vorm.ondrop = (ev) => { ev.preventDefault(); vorm.classList.remove("sleep"); kiesBestand(ev.dataTransfer.files[0]); };
    $("chatin").onpaste = (ev) => { const f = [...ev.clipboardData.files].find((x) => x.type.startsWith("image/")); if (f) { ev.preventDefault(); kiesBestand(f); } };
    tekenVoorbeeld();
    tekenChat();
  }

  function weergaveProjecten() {
    $("inhoud").innerHTML = `<h2 style="margin-top:18px">Projecten <span class="tel">${PROJECTEN.length}</span></h2>
      <div class="projecten">${PROJECTEN.map((p) => {
        const t = splits(doelenVanProject(p));
        const subs = p.subprojecten ?? [];
        return `<a class="projectkaart" href="#/projecten/${esc(p.sleutel)}"><h3>${esc(p.naam)}</h3><div class="klein">${esc(p.omschrijving)}</div>
          ${subs.length ? `<div class="klein">Subprojecten: ${subs.map((s) => esc(s.naam)).join(" · ")}</div>` : ""}
          ${telrij(t)}</a>`;
      }).join("")}</div>`;
  }

  const telrij = (t) => `<div class="telrij"><span class="badge">${t.lopend.length} lopend</span><span class="badge ${t.vast.length ? "MISLUKT" : ""}">${t.vast.length} vastgelopen</span><span class="badge KLAAR">${t.klaar.length} klaar</span></div>`;

  // Projectpagina en subprojectpagina hebben dezelfde opbouw; alleen de doelen en de terugweg verschillen.
  function weergavePlek({ terug, terugLabel, naam, omschrijving, repo, extra, doelen, plek }) {
    const { lopend, vast, klaar, gesloten } = splits(doelen);
    const status = vast.length ? "Aandacht nodig: er is vastgelopen werk." : lopend.length ? "In ontwikkeling." : "Rustig: er loopt nu niets.";
    const recent = klaar.slice(0, 3);
    $("inhoud").innerHTML = `<a class="terug" href="${esc(terug)}">← ${esc(terugLabel)}</a>
      <div class="kaart"><h3 style="font-size:22px">${esc(naam)}</h3><div class="klein">${esc(omschrijving)}</div>
        <p><span class="badge ${vast.length ? "MISLUKT" : "KLAAR"}">${esc(status)}</span></p>
        <p class="klein">Repository: <a href="https://github.com/${esc(repo)}">${esc(repo)}</a></p></div>
      ${extra}
      ${invoerBlok(plek)}
      <div class="raster">
        <section><h2>Nu in ontwikkeling <span class="tel">${lopend.length}</span></h2>${lijst(lopend, "Niets in ontwikkeling.")}
          <h2 style="margin-top:22px">Vastgelopen <span class="tel">${vast.length}</span></h2>${lijst(vast, "Niets vastgelopen.")}</section>
        <section><h2>Recent afgerond <span class="tel">${recent.length}</span></h2>${lijst(recent, "Nog niets afgerond.")}
          ${inklapBlok(plek.label + ":klaar", "Historie", klaar.slice(3), "Geen oudere doelen.")}
          ${geslotenBlok(gesloten, plek.label)}</section>
      </div>`;
    koppelInvoer(plek);
  }

  function weergaveProject(p) {
    const subs = p.subprojecten ?? [];
    const extra = subs.length
      ? `<h2 style="margin-top:18px">Subprojecten <span class="tel">${subs.length}</span></h2>
        <div class="projecten">${subs.map((sp) => `<a class="projectkaart" href="#/projecten/${esc(p.sleutel)}/${esc(sp.sleutel)}"><h3>${esc(sp.naam)}</h3><div class="klein">${esc(sp.omschrijving)}</div>
          ${telrij(splits(doelenVanPlek(p.sleutel + "/" + sp.sleutel)))}</a>`).join("")}</div>`
      : "";
    // Op de projectpagina staan alle doelen van het project, ook die van zijn subprojecten.
    weergavePlek({ terug: "#/projecten", terugLabel: "Projecten", naam: p.naam, omschrijving: p.omschrijving, repo: p.repo, extra,
      doelen: doelenVanProject(p), plek: { naam: p.naam, label: p.sleutel } });
  }

  function weergaveSubproject(p, sp) {
    weergavePlek({ terug: "#/projecten/" + p.sleutel, terugLabel: p.naam, naam: `${p.naam} · ${sp.naam}`, omschrijving: sp.omschrijving, repo: p.repo, extra: "",
      doelen: doelenVanPlek(p.sleutel + "/" + sp.sleutel), plek: { naam: sp.naam, label: p.sleutel + "/" + sp.sleutel } });
  }

  // Drie routes onder #/projecten: het overzicht, één project (#/projecten/<project>) en één subproject
  // (#/projecten/<project>/<subproject>). Een onbekende sleutel valt terug op het overzicht.
  function teken() {
    const route = location.hash.replace(/^#\/?/, "");
    const [deel, sleutel, subsleutel] = route.split("/");
    $("nav-cc").removeAttribute("aria-current"); $("nav-pr").removeAttribute("aria-current");
    const project = deel === "projecten" ? PROJECTEN.find((p) => p.sleutel === sleutel) : null;
    const sub = project && subsleutel ? (project.subprojecten ?? []).find((sp) => sp.sleutel === subsleutel) : null;
    $("nav-" + (deel === "projecten" ? "pr" : "cc")).setAttribute("aria-current", "page");
    if (sub) weergaveSubproject(project, sub); else if (project) weergaveProject(project); else if (deel === "projecten") weergaveProjecten(); else weergaveCommandCenter();
  }

  // Eén luisteraar voor het openklappen en de knoppen op alle doelkaarten, in elke weergave.
  $("inhoud").addEventListener("input", (ev) => { const id = ev.target.dataset?.concept; if (id) concepten[id] = ev.target.value; });
  $("inhoud").addEventListener("click", (ev) => {
    const knop = ev.target.closest("button[data-actie]");
    if (knop?.dataset.actie === "vouw") {
      const blok = knop.dataset.blok;
      if (uitgeklapt.has(blok)) uitgeklapt.delete(blok); else uitgeklapt.add(blok);
      teken();
      return;
    }
    if (knop?.dataset.actie === "pagina") {
      paginas[knop.dataset.blok] = (paginas[knop.dataset.blok] ?? 0) + Number(knop.dataset.stap);
      teken();
      return;
    }
    if (knop?.dataset.actie === "open") {
      const wie = knop.dataset.id;
      if (geopend.has(wie)) geopend.delete(wie); else geopend.add(wie);
      teken();
      return;
    }
    const blok = knop?.closest(".acties");
    if (!blok) return;
    const id = blok.dataset.id;
    if (knop.dataset.actie === "reageer") {
      const reactie = blok.querySelector("textarea").value.trim();
      if (!reactie) { melding("Schrijf eerst je reactie; Jarvis pakt het doel daarmee weer op."); return; }
      zeg(async () => { await rpc("doel_reageer", { p_id: id, p_reactie: reactie }); delete concepten[id]; geopend.delete(id); });
    } else if (knop.dataset.actie === "sluit" && confirm("Dit doel sluiten? Jarvis werkt er niet meer aan en het verdwijnt uit Vastgelopen.")) {
      zeg(async () => { await rpc("doel_sluit", { p_id: id }); delete concepten[id]; geopend.delete(id); });
    }
  });

  function login(melding_) {
    $("status").textContent = "inloggen";
    $("inhoud").innerHTML = `<div class="kaart inlog"><p>Log in; alleen de eigenaar ziet iets.</p>${melding_ ? `<div class="melding">${esc(melding_)}</div>` : ""}
      <form id="lf"><input name="e" type="email" placeholder="e-mail" autocomplete="username" required><input name="w" type="password" placeholder="wachtwoord" autocomplete="current-password" required><button class="hoofd" type="submit">Inloggen</button></form></div>`;
    $("lf").onsubmit = async (ev) => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const { error } = await client.auth.signInWithPassword({ email: String(f.get("e")), password: String(f.get("w")) });
      if (error) login("Inloggen mislukt: " + error.message);
    };
  }

  async function start() {
    const cfg = window.JARVIS_SUPABASE;
    if (!cfg?.url || !cfg?.key) { $("status").textContent = "config.js ontbreekt in deze uitrol — de pagina weet niet welke database ze moet lezen"; return; }
    await new Promise((ok, nee) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"; sc.onload = ok; sc.onerror = nee; document.head.appendChild(sc); });
    client = window.supabase.createClient(cfg.url, cfg.key, { db: { schema: "jarvis" } });
    const { data: { session } } = await client.auth.getSession();
    if (!session) { login(""); await new Promise((ok) => client.auth.onAuthStateChange((_e, s) => { if (s) ok(); })); }
    client.auth.onAuthStateChange((_e, s) => { if (!s) location.reload(); });
    window.addEventListener("hashchange", teken);
    await laad();
    setInterval(() => laad(true), 15000);
  }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/v3/sw.js", { scope: "/v3/" }).catch(() => {});
  start();
})();
</script>
</body>
</html>
