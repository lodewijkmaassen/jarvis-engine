<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<meta name="theme-color" content="#060A10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Eén visuele wereld, bewust: een donkere HUD. De kaart is de interface; al het andere schuift eroverheen. */
:root{
  --grond:#060A10; --vlak:rgba(11,19,29,.9); --vlak2:rgba(18,30,44,.92); --lijn:rgba(95,227,255,.16); --lijn2:rgba(95,227,255,.34);
  --inkt:#D9E6F2; --gedempt:#8CA2B8; --zacht:#5D7288;
  --cyaan:#5FE3FF; --cyaan-zacht:rgba(95,227,255,.12); --cyaan-gloed:0 0 18px rgba(95,227,255,.35);
  --hoog:#FF5C6C; --hoog-zacht:rgba(255,92,108,.14); --midden:#FFB454; --midden-zacht:rgba(255,180,84,.14); --laag:#6F86A0; --laag-zacht:rgba(111,134,160,.16);
  --ok:#3DDC97; --ok-zacht:rgba(61,220,151,.14);
  --display:"Rajdhani","Bahnschrift","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--grond);color:var(--inkt);font:15px/1.5 var(--body);overflow:hidden;
  background-image:radial-gradient(ellipse 70% 60% at 50% 45%,rgba(95,227,255,.08),transparent 65%),
    linear-gradient(rgba(95,227,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(95,227,255,.035) 1px,transparent 1px);
  background-size:100% 100%,28px 28px,28px 28px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,textarea:focus-visible{outline:2px solid var(--cyaan);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---- canvas ---- */
#canvas{position:fixed;inset:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#canvas.sleept{cursor:grabbing}
#canvas svg{width:100%;height:100%;display:block}
.tak{fill:none;stroke:var(--lijn2);stroke-width:1.2}
.tak.los{stroke-dasharray:3 6}
.tak.hoog{stroke:rgba(255,92,108,.5)}
.knoop{cursor:pointer}
.knoop .schijf{fill:rgba(11,19,29,.94);stroke:var(--lijn2);stroke-width:1.2;transition:stroke .15s}
.knoop.actief .schijf{stroke:var(--cyaan);stroke-width:2;filter:drop-shadow(0 0 8px rgba(95,227,255,.5))}
.knoop.los .schijf{stroke-dasharray:4 3}
.knoop.u-hoog .schijf{stroke:var(--hoog)}
.knoop.u-midden .schijf{stroke:var(--midden)}
.knoop.beantwoord .schijf{stroke:var(--ok)}
.knoop.stil .schijf{stroke:var(--hoog);stroke-dasharray:2 3}
.zet{display:inline-flex;gap:6px;align-items:center;font-family:var(--mono);font-size:11.5px;color:var(--gedempt);margin-top:6px}
.zet b{font-weight:500;color:var(--cyaan)}
.zet.eigenaar b{color:var(--midden)}
.zet.stil b{color:var(--hoog)}
.scope{max-height:180px;overflow:auto;white-space:pre-wrap;font-family:var(--mono);font-size:11px;line-height:1.45;color:var(--gedempt);background:rgba(6,10,16,.5);border:1px solid var(--lijn);border-radius:8px;padding:8px 10px;margin:6px 0}
.akkoord{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.knoop.beantwoord text{fill:var(--zacht)}
.knoop text{font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;fill:var(--inkt);pointer-events:none}
.knoop text.sub{font-family:var(--mono);font-weight:400;letter-spacing:0;text-transform:none;fill:var(--gedempt)}
.knoop text.blad{font-family:var(--body);font-weight:500;letter-spacing:0;text-transform:none;fill:var(--inkt)}
.knoop.kern .schijf{fill:rgba(95,227,255,.14);stroke:var(--cyaan);stroke-width:2;filter:drop-shadow(0 0 12px rgba(95,227,255,.6))}
.knoop.kern text{fill:#fff;font-weight:700;letter-spacing:.16em}
.knoop.kern text.sub{fill:var(--cyaan)}
.knoop .draai{fill:none;stroke:var(--cyaan);stroke-width:1.5;stroke-dasharray:40 26 8 26;opacity:.7;transform-origin:center;transform-box:fill-box}
@media(prefers-reduced-motion:no-preference){.knoop .draai{animation:draai 24s linear infinite}.knoop .draai.terug{animation-direction:reverse;animation-duration:38s}}
@keyframes draai{to{transform:rotate(360deg)}}
.knoop .buiten{fill:none;stroke:var(--cyaan);stroke-width:1;opacity:.35;stroke-dasharray:6 4}
.knoop .voortgang{fill:none;stroke:var(--cyaan);stroke-width:3;stroke-linecap:round;opacity:.9}
.knoop .voortgang-rest{fill:none;stroke:var(--lijn);stroke-width:3}
.badge circle{fill:var(--hoog);filter:drop-shadow(0 0 6px rgba(255,92,108,.7))}
.badge.rustig circle{fill:var(--laag)}
.badge text{fill:#fff;font-family:var(--mono);font-size:10.5px;font-weight:500;pointer-events:none}
.praat{fill:var(--cyaan);opacity:.9}
.plus{fill:var(--zacht);font-family:var(--mono);font-size:11px;pointer-events:none}

/* ---- kop over de kaart ---- */
.kop{position:fixed;left:12px;top:10px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none;z-index:5}
.kop h1{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 0 14px rgba(95,227,255,.55)}
.kop h1 small{font:600 11px/1 var(--display);color:var(--cyaan);margin-left:10px;letter-spacing:.2em}
.status{font-family:var(--mono);font-size:11.5px;color:var(--gedempt);text-align:right;line-height:1.5;background:rgba(6,10,16,.6);padding:4px 8px;border:1px solid var(--lijn);pointer-events:auto}
.status b{font-weight:500;color:var(--cyaan)}
.status .oud{color:var(--midden)}
.status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);margin-right:6px;vertical-align:1px}
.status .dot.uit{background:var(--hoog);box-shadow:0 0 8px var(--hoog)}
.status .dot.bezig{background:var(--midden);box-shadow:0 0 8px var(--midden)}
@media(prefers-reduced-motion:no-preference){.status .dot.bezig{animation:knip 1.2s ease-in-out infinite}}
@keyframes knip{50%{opacity:.35}}
.gereedschap{position:fixed;left:12px;bottom:12px;display:flex;gap:6px;z-index:5}
.gereedschap .knop{min-width:44px;min-height:44px;background:rgba(6,10,16,.7)}
.legenda{position:fixed;right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--mono);font-size:10.5px;color:var(--gedempt);background:rgba(6,10,16,.6);padding:4px 8px;border:1px solid var(--lijn);z-index:5;max-width:52vw}
.legenda span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;border:1.5px solid var(--lijn2)}
.legenda .l-hoog::before{border-color:var(--hoog)}
.legenda .l-midden::before{border-color:var(--midden)}
.legenda .l-ok::before{border-color:var(--ok)}
.legenda .l-los::before{border-style:dashed}
@media(max-width:899px){.legenda{display:none}.status{max-width:62vw;font-size:10.5px}.kop h1{font-size:20px}.gereedschap{top:52px;bottom:auto;flex-direction:column}.gereedschap .knop{min-width:38px;min-height:38px}}

/* ---- schuifkaart ---- */
.kaart{position:fixed;z-index:10;background:var(--vlak);border:1px solid var(--lijn2);backdrop-filter:blur(8px);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.kaart::before,.kaart::after{content:"";position:absolute;width:12px;height:12px;border-color:var(--cyaan);border-style:solid;opacity:.8;pointer-events:none}
.kaart::before{left:-1px;top:-1px;border-width:2px 0 0 2px}
.kaart::after{right:-1px;bottom:-1px;border-width:0 2px 2px 0}
.kaart[hidden]{display:none}
@media(max-width:899px){
  .kaart{left:0;right:0;bottom:0;max-height:62vh;border-left:0;border-right:0;border-bottom:0}
  .kaart .greep{height:18px;display:flex;align-items:center;justify-content:center;cursor:grab}
  .kaart .greep::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--lijn2)}
}
@media(min-width:900px){
  .kaart{top:12px;right:12px;bottom:12px;width:min(520px,46vw)}
  .kaart .greep{display:none}
}
.kaart .kopregel{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:8px 14px 8px;border-bottom:1px solid var(--lijn)}
.kaart .kopregel h2{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.1em;text-transform:uppercase;color:#fff;line-height:1.15}
.kaart .pad{font-family:var(--mono);font-size:11px;color:var(--zacht);margin-bottom:2px}
.kaart .pad button{color:var(--cyaan)}
.kaart .sluit{min-width:40px;min-height:40px;font-family:var(--mono);color:var(--gedempt);flex-shrink:0}
.kaart .inhoud{overflow:auto;padding:0 14px 14px;flex:1;min-height:0}
.itemmeta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:10px 0 4px}
.chip{display:inline-flex;align-items:center;font-family:var(--display);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:1px 7px;border:1px solid var(--lijn2);color:var(--gedempt);line-height:1.5}
.chip.soort-beslissing,.chip.soort-conflict,.chip.soort-blokkade{border-color:var(--hoog);color:var(--hoog)}
.chip.soort-actie{border-color:var(--midden);color:var(--midden)}
.chip.project{border-color:var(--cyaan);color:var(--cyaan)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.wacht{border-color:var(--midden);color:var(--midden)}
.eyebrow{font-family:var(--display);font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--cyaan)}
.blok{margin-top:12px}
.blok .eyebrow{display:block;margin-bottom:3px}
.blok p{color:var(--gedempt);max-width:64ch}
.blok p strong{color:var(--inkt)}
.bron{font-family:var(--mono);font-size:11px;color:var(--zacht);margin-top:10px}
.opties{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.optie{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:10px 12px;background:var(--vlak2);border:1px solid var(--lijn);text-align:left;min-height:44px;width:100%}
.optie.advies{border-color:var(--cyaan);box-shadow:var(--cyaan-gloed)}
.optie .lbl{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.optie .lbl .adv{font-size:10.5px;color:var(--cyaan);margin-left:8px;letter-spacing:.18em}
.optie .gevolg{grid-column:1;font-size:13.5px;color:var(--gedempt);line-height:1.45}
.optie .kies{grid-column:2;grid-row:1/3;font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyaan);border:1px solid var(--cyaan);padding:6px 10px;white-space:nowrap}
.optie:disabled{opacity:.45;cursor:default}
.stappen{margin:6px 0 0;padding:0;list-style:none;counter-reset:stap}
.stappen li{counter-increment:stap;display:grid;grid-template-columns:28px 1fr;gap:10px;padding:8px 10px;border:1px solid var(--lijn);background:var(--vlak2);margin-bottom:6px;font-size:14px;line-height:1.5;color:var(--inkt)}
.stappen li::before{content:counter(stap);font-family:var(--display);font-weight:700;font-size:16px;color:var(--cyaan);line-height:1.3}
.stappen li code,.md code,.bericht code{font-family:var(--mono);font-size:.9em;background:rgba(6,10,16,.7);padding:1px 5px;color:var(--cyaan)}
.controle{margin-top:8px;padding:8px 10px;border-left:3px solid var(--ok);background:var(--ok-zacht);font-size:13.5px;color:var(--inkt)}
.adviestekst{margin-top:10px;padding:10px 12px;border:1px solid var(--cyaan);border-left-width:3px;background:var(--cyaan-zacht);font-size:14px;color:var(--inkt)}
.adviestekst .eyebrow{display:block;margin-bottom:2px}
.antwoordvak{margin-top:12px;display:flex;flex-direction:column;gap:8px}
textarea{width:100%;min-height:56px;resize:vertical;padding:8px 10px;border:1px solid var(--lijn2);background:rgba(6,10,16,.7);color:var(--inkt);font:inherit;font-size:14px}
textarea::placeholder{color:var(--zacht)}
.knop{min-height:40px;padding:0 14px;border:1px solid var(--lijn2);background:var(--vlak2);font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.knop.stil{background:none;border-color:transparent;color:var(--gedempt)}
.knop:disabled{opacity:.5;cursor:default}
.antwoordstatus{margin-top:12px;padding:10px 12px;border:1px solid var(--lijn);background:var(--vlak2);font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.antwoordstatus .rij{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.antwoordstatus .mono{color:var(--zacht);font-size:11.5px}
.antwoordstatus .verw{color:var(--inkt)}
.antwoordstatus .verw::before{content:"Jarvis: ";color:var(--cyaan);font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;font-size:12px}
.leeg{padding:16px;color:var(--gedempt);text-align:center;border:1px dashed var(--lijn)}
/* ---- acties: alleen wat werkelijk bij de eigenaar ligt ---- */
.acties{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.actie{border:1px solid var(--midden);border-left-width:3px;background:var(--vlak2)}
.actie.rustig{border-color:var(--lijn2);border-left-color:var(--laag)}
.actie summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;min-height:48px;align-items:center}
.actie summary::-webkit-details-marker{display:none}
.actie summary .kopje{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#fff;line-height:1.2}
.actie summary .sub{grid-column:1;font-family:var(--mono);font-size:11px;color:var(--gedempt)}
.actie summary .pijl{grid-column:2;grid-row:1/3;font-family:var(--mono);color:var(--cyaan)}
.actie[open] summary .pijl{transform:rotate(90deg)}
.actie .lijf{padding:0 12px 12px;border-top:1px solid var(--lijn)}
.actie .lijf .blok{margin-top:10px}
.actie .lijf p{font-size:13.5px}
.actie ul.kaal{margin:4px 0 0;padding-left:18px;color:var(--gedempt);font-size:13.5px}
.actie ul.kaal li{margin:2px 0}
.actie .knop.groot{min-height:48px;width:100%;background:var(--cyaan-zacht);border-color:var(--cyaan);color:#fff;box-shadow:var(--cyaan-gloed)}
.status .acties-knop{display:block;margin-top:4px;padding:6px 10px;border:1px solid var(--midden);color:#fff;background:var(--midden-zacht);font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px;min-height:36px}
.status .acties-knop.leeg{border-color:var(--lijn);background:none;color:var(--gedempt)}
.leeg strong{display:block;color:#fff;font-family:var(--display);font-size:16px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.tegels{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-top:10px}
.tegel{padding:8px 10px;border:1px solid var(--lijn);background:var(--vlak2)}
.tegel .eyebrow{display:block;margin-bottom:2px;font-size:10.5px}
.tegel .n{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.05;color:#fff}
.tegel .n small{font:400 11px/1 var(--mono);color:var(--gedempt);margin-left:4px}
.regel{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--lijn);background:var(--vlak2);margin-top:6px;width:100%;text-align:left;min-height:44px}
.regel .t{flex:1;font-size:14px;color:var(--inkt)}
.regel .t small{display:block;font-family:var(--mono);font-size:11px;color:var(--zacht)}
.regel .m{font-family:var(--mono);font-size:11px;color:var(--gedempt);white-space:nowrap}
.regel.u-hoog{border-left:3px solid var(--hoog)}
.regel.u-midden{border-left:3px solid var(--midden)}
.regel.u-laag{border-left:3px solid var(--laag)}
.regel.beantwoord{border-left:3px solid var(--ok);opacity:.75}
.md{max-width:66ch;color:var(--inkt)}
.md p{margin:0 0 10px}
.md ul{margin:0 0 10px;padding-left:20px}
.md li{margin:4px 0}
.md em{color:var(--gedempt)}
details.stand{border:1px solid var(--lijn);margin-top:8px;background:var(--vlak2)}
details.stand summary{cursor:pointer;list-style:none;padding:10px 12px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:#fff;display:flex;justify-content:space-between;min-height:44px;align-items:center}
details.stand summary::-webkit-details-marker{display:none}
details.stand summary::after{content:"+";font-family:var(--mono);color:var(--cyaan)}
details.stand[open] summary::after{content:"–"}
details.stand .md{padding:0 12px 10px}
.stap{display:grid;grid-template-columns:18px 1fr;gap:8px;padding:3px 0;font-size:13.5px;color:var(--gedempt);align-items:start}
.stap.gedaan{color:var(--zacht);text-decoration:line-through}
.stap .vink{font-family:var(--mono);color:var(--ok)}
.stap.open .vink{color:var(--midden)}
.stap.nu .vink{color:var(--cyaan)}
.stap.nu{color:var(--inkt)}
.balk{height:4px;background:var(--lijn);position:relative;margin:6px 0 8px}
.balk i{position:absolute;left:0;top:0;bottom:0;background:var(--cyaan);box-shadow:0 0 8px var(--cyaan)}
.agent{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 12px;border:1px solid var(--lijn);background:var(--vlak2);margin-top:8px;align-items:center}
.agent .naam{font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff}
.agent .naam .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--zacht);vertical-align:1px}
.agent.actief .naam .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.agent.bezig .naam .dot{background:var(--cyaan);box-shadow:0 0 8px var(--cyaan)}
.agent .wat{grid-column:1/3;font-size:14px;color:var(--inkt)}
.agent .meta{grid-column:1/3;font-family:var(--mono);font-size:11px;color:var(--zacht)}
.commit{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:6px 10px;border:1px solid var(--lijn);background:var(--vlak2);margin-top:6px;align-items:baseline}
.commit .hash{font-family:var(--mono);font-size:12px;color:var(--cyaan)}
.commit .ond{font-size:13.5px;line-height:1.4;overflow-wrap:anywhere}
.melding{background:var(--midden-zacht);color:var(--inkt);border:1px solid var(--midden);padding:10px 12px;margin:10px 0;font-size:13.5px}
.melding.fout{background:var(--hoog-zacht);border-color:var(--hoog)}

/* ---- draad (gesprek per knoop) ---- */
.draad{margin-top:16px;border-top:1px solid var(--lijn);padding-top:10px}
.draad .eyebrow{display:block;margin-bottom:6px}
.berichten{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.bericht{max-width:92%;padding:9px 11px;border:1px solid var(--lijn);background:var(--vlak2);font-size:14px;line-height:1.5}
.bericht.jarvis{border-left:3px solid var(--cyaan);align-self:flex-start}
.bericht.eigenaar{border-right:3px solid var(--midden);align-self:flex-end}
.bericht .van{font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyaan);display:block;margin-bottom:2px}
.bericht.eigenaar .van{color:var(--midden)}
.bericht .tijd{font-family:var(--mono);font-size:10.5px;color:var(--zacht);margin-left:8px}
.bericht.wacht{opacity:.7}
.invoer{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:end}
.invoer textarea{min-height:48px}
.invoer .knop{min-height:48px}
.stemregel{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--gedempt)}
.stemregel label{display:inline-flex;gap:6px;align-items:center;min-height:32px;cursor:pointer}
.stemregel select{background:var(--vlak2);color:var(--inkt);border:1px solid var(--lijn2);font:inherit;font-size:12px;padding:4px 6px;max-width:100%}
</style>
</head>
<body>
<div id="canvas"><svg id="kaart" role="group" aria-label="Jarvis-kaart"></svg></div>
<div class="kop">
  <h1>Jarvis<small id="kop-versie"></small></h1>
  <div class="status" id="status">laden…</div>
</div>
<div class="gereedschap">
  <button class="knop" data-actie="centreer" aria-label="Terug naar het midden">⌂</button>
  <button class="knop" data-actie="zoom-in" aria-label="Inzoomen">+</button>
  <button class="knop" data-actie="zoom-uit" aria-label="Uitzoomen">−</button>
</div>
<div class="legenda"><span class="l-hoog">hoog</span><span class="l-midden">midden</span><span>laag</span><span class="l-ok">beantwoord</span><span class="l-los">niet aangesloten</span></div>
<div class="kaart" id="paneel" hidden>
  <div class="greep" id="greep"></div>
  <div class="kopregel"><div><div class="pad" id="paneel-pad"></div><h2 id="paneel-titel"></h2></div><button class="sluit" data-actie="sluit" aria-label="Sluiten">✕</button></div>
  <div class="inhoud" id="paneel-inhoud"></div>
</div>

<script src="config.js" onerror="void 0"></script>
<script>
(() => {
"use strict";
const $svg = document.getElementById("kaart");
const $canvas = document.getElementById("canvas");
const $status = document.getElementById("status");
const $paneel = document.getElementById("paneel");
const $ptitel = document.getElementById("paneel-titel");
const $ppad = document.getElementById("paneel-pad");
const $pinhoud = document.getElementById("paneel-inhoud");
const RECENT_DAGEN = 14;

const staat = { overzicht: null, antwoorden: new Map(), berichten: [], autorisaties: [], jarvis: null, db: null, artifact: null,
  open: new Set(), gekozen: null, zoom: { k: 1, x: 0, y: 0 }, dbFout: null, signaal: "", stem: { aan: false, naam: "" }, concept: new Map(), laatstVoorgelezen: "", eersteFit: false };
try { const st = localStorage.getItem("jarvis.stem"); if (st) staat.stem = JSON.parse(st); } catch { /* geen opslag */ }
const bewaarStem = () => { try { localStorage.setItem("jarvis.stem", JSON.stringify(staat.stem)); } catch { /* geen opslag */ } };
try { const z = sessionStorage.getItem("jarvis.v2"); if (z) { const j = JSON.parse(z); staat.open = new Set(j.open ?? []); staat.gekozen = j.gekozen ?? null; } } catch { /* geen opslag */ }
const bewaarZicht = () => { try { sessionStorage.setItem("jarvis.v2", JSON.stringify({ open: [...staat.open], gekozen: staat.gekozen })); } catch { /* geen opslag */ } };

/* ---------- hulpjes ---------- */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MAANDEN = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
function datumKort(iso) { const d = new Date(iso); if (isNaN(d)) return esc(iso); return `${d.getDate()} ${MAANDEN[d.getMonth()]}`; }
function tijd(iso) { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" }); }
function dagLabel(iso) {
  const d = new Date(iso), nu = new Date();
  const dag = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const verschil = Math.round((dag(nu) - dag(d)) / 864e5);
  if (verschil === 0) return "Vandaag"; if (verschil === 1) return "Gisteren";
  if (verschil < 7) return d.toLocaleDateString("nl-NL", { weekday: "long" }).replace(/^./, (c) => c.toUpperCase());
  return `${d.getDate()} ${MAANDEN[d.getMonth()]}`;
}
function relatief(iso) {
  const ms = Date.now() - new Date(iso).getTime();
  const m = Math.round(ms / 6e4), u = Math.round(ms / 36e5), d = Math.round(ms / 864e5);
  if (m < 2) return "zojuist"; if (m < 60) return `${m} min geleden`;
  if (u < 24) return `${u} uur geleden`; if (d === 1) return "gisteren"; return `${d} dagen geleden`;
}
const kort = (t, n) => (t.length > n ? t.slice(0, n - 1).trimEnd() + "…" : t);
const SOORT = { beslissing: "beslissing", conflict: "conflict", actie: "actie", risico: "risico", blokkade: "blokkade" };
const URG = { hoog: 0, midden: 1, laag: 2 };

function md(tekst) {
  const regels = String(tekst).replace(/\r\n/g, "\n").replace(/<!--[\s\S]*?-->/g, "").split("\n");
  const uit = []; let para = []; let lijst = null;
  const inline = (t) => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[\s(])_([^_]+)_(?=[\s.,;:)]|$)/g, "$1<em>$2</em>");
  const sluitPara = () => { if (para.length) { uit.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
  const sluitLijst = () => { if (lijst) { uit.push(`<ul>${lijst.map((l) => `<li>${inline(l)}</li>`).join("")}</ul>`); lijst = null; } };
  for (const r of regels) {
    const punt = /^\s*[-*]\s+(.*)$/.exec(r);
    if (punt) { sluitPara(); (lijst ??= []).push(punt[1]); continue; }
    if (/^\s{2,}\S/.test(r) && lijst) { lijst[lijst.length - 1] += " " + r.trim(); continue; }
    if (r.trim() === "") { sluitPara(); sluitLijst(); continue; }
    if (/^\|/.test(r)) continue;
    sluitLijst(); para.push(r.trim());
  }
  sluitPara(); sluitLijst();
  return uit.join("");
}
const inlineMd = (t) => md(t).replace(/^<p>|<\/p>$/g, "").replace(/<\/p><p>/g, " ");
const isOpen = (item) => !staat.antwoorden.has(item.id);

/* ---------- de boom ----------
   Eén boom uit het overzicht: de kern in het midden, projecten eromheen,
   onder een project de taken (het werk) met daaronder de punten die eruit
   voortkomen, en los een tak risico's. Punten die bij geen taak horen
   (een conflict, de aansluiting) hangen direct onder het project. */
function bouwBoom() {
  const o = staat.overzicht;
  const kern = o.projecten.find((p) => p.id === o.centraal) ?? null;
  const root = { id: "root", soort: "root", label: kern ? kern.naam : "Jarvis", project: kern, kinderen: [] };
  const projectTakken = (p) => {
    const kinderen = [];
    const taakIds = new Set(p.taken.map((t) => t.id));
    for (const t of p.taken.filter((t) => t.status !== "afgerond")) {
      const items = p.aandacht.filter((a) => a.bron.startsWith(`tasks/${t.id}/`));
      kinderen.push({ id: `t:${t.id}`, soort: "taak", label: t.titel, taak: t, project: p, kinderen: items.map((a) => bladVan(a, p)) });
    }
    const risicos = p.aandacht.filter((a) => a.soort === "risico");
    if (risicos.length) kinderen.push({ id: `c:${p.id}:risico`, soort: "cluster", label: "Risico's", project: p, kinderen: risicos.map((a) => bladVan(a, p)) });
    for (const a of p.aandacht) {
      if (a.soort === "risico") continue;
      const uitTaak = [...taakIds].some((id) => a.bron.startsWith(`tasks/${id}/`));
      if (!uitTaak) kinderen.push(bladVan(a, p));
    }
    return kinderen;
  };
  const bladVan = (a, p) => ({ id: `i:${a.id}`, soort: "item", label: a.titel, item: a, project: p, kinderen: [] });
  for (const p of o.projecten.filter((p) => p.id !== o.centraal)) {
    root.kinderen.push({ id: `p:${p.id}`, soort: "project", label: p.naam, project: p, kinderen: projectTakken(p) });
  }
  if (kern) root.kinderen.push(...projectTakken(kern));
  const ouder = (n, pa) => { n.ouder = pa; for (const k of n.kinderen) ouder(k, n); };
  ouder(root, null);
  return root;
}
function vindKnoop(root, id) { if (root.id === id) return root; for (const k of root.kinderen) { const r = vindKnoop(k, id); if (r) return r; } return null; }
function openItems(n) { if (n.soort === "item") return isOpen(n.item) ? 1 : 0; return n.kinderen.reduce((s, k) => s + openItems(k), 0); }
function hoogsteUrg(n) { if (n.soort === "item") return isOpen(n.item) ? URG[n.item.urgentie] ?? 2 : 9; return Math.min(9, ...n.kinderen.map(hoogsteUrg)); }
function draadVan(id) { return staat.berichten.filter((b) => (b.context?.node ?? "root") === id).sort((a, b) => String(a.op).localeCompare(String(b.op))); }

/* ---------- radiale lay-out ----------
   Elk kind van de kern krijgt een sector naar rato van wat er zichtbaar
   onder hangt; dieper wordt dezelfde sector verder verdeeld. Straal per
   diepte is een ondergrens: past de tekst van de kinderen niet op de boog
   van hun sector, dan schuift die ring naar buiten tot ze past (de eigenaar
   zag labels over elkaar heen). Teksten van taken en takken staan aan de
   buitenkant, weg van de buren op dezelfde ring. */
const STRAAL = [0, 175, 300, 405, 490];
const PLAT = 0.82;
/* Hoeveel boog (px) een knoop langs zijn ring nodig heeft: de schijf plus de
   tekst, die vlak bij boven/onder horizontaal naast de buren komt te staan. */
function ruimteNodig(n, hoek) {
  const tekst = n.soort === "project" ? 100 : n.soort === "taak" ? Math.min(30, (n.taak.titel || "").length) * 6.4 + 24 : n.soort === "cluster" ? (n.label || "").length * 6.4 + 20 : Math.min(34, (n.item?.titel || "").length) * 6 + 20;
  const schijf = n.soort === "project" ? 80 : n.soort === "taak" ? 48 : n.soort === "cluster" ? 40 : 22;
  return schijf + Math.abs(Math.sin(hoek)) * tekst;
}
function gewicht(n) {
  if (n.soort === "item") return 1;
  const uitgevouwen = staat.open.has(n.id) && n.kinderen.length > 0;
  const eigen = n.soort === "project" ? 2.2 : n.soort === "taak" ? 1.4 : 1;
  return uitgevouwen ? Math.max(eigen, n.kinderen.reduce((s, k) => s + gewicht(k), 0)) : eigen;
}
function legUit(root) {
  root.x = 0; root.y = 0; root.hoek = 0; root.diepte = 0; root.r = 0;
  const plaats = (n, van, tot, diepte) => {
    const zichtbaar = staat.open.has(n.id) || n.soort === "root" ? n.kinderen : [];
    const totaal = zichtbaar.reduce((s, k) => s + gewicht(k), 0) || 1;
    // Eerste ronde: hoeken. Tweede ronde: de straal die nodig is om alle
    // kinderen zonder overlap op de boog van deze sector te zetten.
    let a = van;
    for (const k of zichtbaar) {
      const deel = ((tot - van) * gewicht(k)) / totaal;
      k.hoek = a + deel / 2; k.deel = deel; k.diepte = diepte;
      a += deel;
    }
    const basis = STRAAL[Math.min(diepte, STRAAL.length - 1)];
    const boogNodig = zichtbaar.reduce((s, k) => s + ruimteNodig(k, k.hoek), 0);
    const sector = tot - van;
    const r = Math.max(basis, n.r + 95, boogNodig / (sector * PLAT));
    for (const k of zichtbaar) {
      k.r = r;
      k.x = Math.cos(k.hoek) * r; k.y = Math.sin(k.hoek) * r * PLAT;
      plaats(k, k.hoek - k.deel / 2, k.hoek + k.deel / 2, diepte + 1);
    }
  };
  // Projecten links en rechts, de takken van de kern ertussen: begin bij 180°.
  plaats(root, Math.PI, 3 * Math.PI, 1);
}

/* ---------- tekenen ---------- */
function tekenKaart() {
  const o = staat.overzicht; if (!o) return;
  const root = bouwBoom(); staat.boom = root;
  legUit(root);
  const W = $canvas.clientWidth, H = $canvas.clientHeight;
  $svg.setAttribute("viewBox", `${-W / 2} ${-H / 2} ${W} ${H}`);
  let takken = "", knopen = "";
  const teken = (n) => {
    const zichtbaar = staat.open.has(n.id) || n.soort === "root" ? n.kinderen : [];
    for (const k of zichtbaar) {
      const urg = hoogsteUrg(k);
      const los = k.soort === "project" && !k.project.aangesloten;
      const mx = (n.x + k.x) / 2, my = (n.y + k.y) / 2;
      takken += `<path class="tak ${los ? "los" : ""} ${urg === 0 ? "hoog" : ""}" d="M${n.x.toFixed(1)},${n.y.toFixed(1)} Q${(mx + (k.x - n.x) * 0.15).toFixed(1)},${(my - (k.y - n.y) * 0.15).toFixed(1)} ${k.x.toFixed(1)},${k.y.toFixed(1)}"/>`;
      knopen += knoopSvg(k);
      teken(k);
    }
  };
  teken(root);
  knopen = kernSvg(root) + knopen;
  $svg.innerHTML = `<g id="wereld" transform="translate(${staat.zoom.x} ${staat.zoom.y}) scale(${staat.zoom.k})"><circle r="${STRAAL[1] - 40}" fill="none" stroke="var(--lijn)"/><circle r="${STRAAL[1] + 55}" fill="none" stroke="var(--lijn)" stroke-dasharray="2 10"/>${takken}${knopen}</g>`;
  if (!staat.eersteFit) { staat.eersteFit = true; centreer(); if (staat.gekozen) focusOp(vindKnoop(root, staat.gekozen)); }
}
function kernSvg(root) {
  const open = root.project ? openItems({ kinderen: root.kinderen.filter((k) => k.soort !== "project") }) : 0;
  const totaal = staat.overzicht.voor_jou.filter(isOpen).length;
  const actief = staat.gekozen === "root";
  const draad = draadVan("root").length;
  return `<g class="knoop kern ${actief ? "actief" : ""}" data-id="root" tabindex="0" role="button" aria-label="${esc(root.label)}, ${open} voor jou, ${totaal} in totaal">
    <circle class="draai" r="46"/><circle class="draai terug" r="53" style="stroke-dasharray:14 30;opacity:.35"/>
    <circle class="buiten" r="40"/><circle class="schijf" r="34"/>
    <text y="-2" text-anchor="middle" style="font-size:15px">${esc(root.label)}</text>
    <text class="sub" y="13" text-anchor="middle" style="font-size:10px">${open} · alles ${totaal}</text>
    ${draad ? `<circle class="praat" cx="-30" cy="-26" r="4"/>` : ""}
    ${open ? `<g class="badge"><circle cx="28" cy="-26" r="10"/><text x="28" y="-22.5" text-anchor="middle">${open}</text></g>` : ""}
  </g>`;
}
/* Waar de tekst van een knoop staat: aan de buitenkant van de ring, dus
   rechts van een knoop rechts, links van een knoop links, en boven/onder bij
   de polen. Zo raakt hij de buren op dezelfde ring niet. */
function labelPlek(n, afstand) {
  const c = Math.cos(n.hoek || 0), sn = Math.sin(n.hoek || 0);
  if (Math.abs(c) < 0.35) {
    const onder = sn > 0;
    return { x: 0, anchor: "middle", y1: onder ? afstand + 10 : -afstand - 12, y2: onder ? afstand + 21 : -afstand - 1 };
  }
  const rechts = c > 0;
  return { x: rechts ? afstand : -afstand, anchor: rechts ? "start" : "end", y1: -1, y2: 10 };
}
function knoopSvg(n) {
  const actief = staat.gekozen === n.id;
  const draad = draadVan(n.id).length;
  const uitgevouwen = staat.open.has(n.id);
  const x = n.x.toFixed(1), y = n.y.toFixed(1);
  if (n.soort === "project") {
    const p = n.project;
    const open = openItems(n);
    const r = 26 + Math.min(10, Math.round(p.recent.length / 25));
    return `<g class="knoop ${actief ? "actief" : ""} ${p.aangesloten ? "" : "los"}" data-id="${esc(n.id)}" transform="translate(${x} ${y})" tabindex="0" role="button" aria-label="${esc(p.naam)}, ${open} voor jou">
      <circle class="buiten" r="${r + 5}"/><circle class="schijf" r="${r}"/>
      <text y="4" text-anchor="middle" style="font-size:12px">${esc(kort(p.naam, 12))}</text>
      <text class="sub" y="${r + 14}" text-anchor="middle" style="font-size:10px">${p.recent.length} commits${p.aangesloten ? "" : " · los"}</text>
      ${!uitgevouwen && n.kinderen.length ? `<text class="plus" x="${r - 4}" y="${r + 2}">+${n.kinderen.length}</text>` : ""}
      ${draad ? `<circle class="praat" cx="${-r * 0.72}" cy="${-r * 0.72}" r="4"/>` : ""}
      ${open ? `<g class="badge"><circle cx="${r * 0.72}" cy="${-r * 0.72}" r="9.5"/><text x="${r * 0.72}" y="${-r * 0.72 + 3.5}" text-anchor="middle">${open}</text></g>` : ""}
    </g>`;
  }
  if (n.soort === "taak") {
    const t = n.taak; const st = t.stappen ?? []; const gedaan = st.filter((s) => s.gedaan).length; const frac = st.length ? gedaan / st.length : 0;
    const open = openItems(n); const r = 16; const C = 2 * Math.PI * (r + 4);
    const urg = hoogsteUrg(n);
    return `<g class="knoop ${actief ? "actief" : ""} ${t.stil ? "stil" : urg === 0 ? "u-hoog" : urg === 1 ? "u-midden" : ""}" data-id="${esc(n.id)}" transform="translate(${x} ${y})" tabindex="0" role="button" aria-label="Taak ${esc(t.titel)}">
      <circle class="voortgang-rest" r="${r + 4}"/>${st.length ? `<circle class="voortgang" r="${r + 4}" stroke-dasharray="${(C * frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90)"/>` : ""}
      <circle class="schijf" r="${r}"/>
      <text class="sub" y="4" text-anchor="middle" style="font-size:9px">${st.length ? `${gedaan}/${st.length}` : "taak"}</text>
      ${(() => { const L = labelPlek(n, r + 6); return `<text class="blad" x="${L.x}" y="${L.y1}" text-anchor="${L.anchor}" style="font-size:10.5px">${esc(kort(t.titel, 30))}</text>
      <text class="sub" x="${L.x}" y="${L.y2}" text-anchor="${L.anchor}" style="font-size:8.5px;fill:${t.stil ? "var(--hoog)" : t.aan_zet === "eigenaar" ? "var(--midden)" : "var(--gedempt)"}">${t.stil ? "stil · " : ""}${t.aan_zet === "eigenaar" ? "wacht op jou" : t.aan_zet === "jarvis" ? "Jarvis aan zet" : ""}${t.laatste_beweging ? " · " + esc(relatief(t.laatste_beweging)) : ""}</text>`; })()}
      ${!uitgevouwen && n.kinderen.length ? `<text class="plus" x="${r}" y="${r + 4}">+${n.kinderen.length}</text>` : ""}
      ${draad ? `<circle class="praat" cx="${-r - 2}" cy="${-r - 2}" r="3.5"/>` : ""}
      ${open ? `<g class="badge"><circle cx="${r}" cy="${-r}" r="8"/><text x="${r}" y="${-r + 3}" text-anchor="middle" style="font-size:9.5px">${open}</text></g>` : ""}
    </g>`;
  }
  if (n.soort === "cluster") {
    const open = openItems(n); const r = 13;
    const urg = hoogsteUrg(n);
    return `<g class="knoop ${actief ? "actief" : ""} ${urg === 0 ? "u-hoog" : urg === 1 ? "u-midden" : ""}" data-id="${esc(n.id)}" transform="translate(${x} ${y})" tabindex="0" role="button" aria-label="${esc(n.label)}">
      <circle class="schijf" r="${r}"/><text class="sub" y="3.5" text-anchor="middle" style="font-size:9px">${n.kinderen.length}</text>
      ${(() => { const L = labelPlek(n, r + 6); return `<text class="blad" x="${L.x}" y="${L.y1 + (L.anchor === "middle" ? 0 : 4)}" text-anchor="${L.anchor}" style="font-size:10.5px">${esc(n.label)}</text>`; })()}
      ${!uitgevouwen ? `<text class="plus" x="${r}" y="${r + 2}">+</text>` : ""}
      ${draad ? `<circle class="praat" cx="${-r}" cy="${-r}" r="3.5"/>` : ""}
      ${open ? `<g class="badge ${urg > 1 ? "rustig" : ""}"><circle cx="${r}" cy="${-r}" r="7.5"/><text x="${r}" y="${-r + 3}" text-anchor="middle" style="font-size:9px">${open}</text></g>` : ""}
    </g>`;
  }
  // item
  const a = n.item; const antwoord = staat.antwoorden.get(a.id); const r = 8;
  const links = n.x < -20, rechts = n.x > 20;
  const tx = links ? -r - 6 : rechts ? r + 6 : 0; const anchor = links ? "end" : rechts ? "start" : "middle"; const ty = links || rechts ? 4 : r + 13;
  return `<g class="knoop ${actief ? "actief" : ""} ${antwoord ? "beantwoord" : `u-${esc(a.urgentie)}`}" data-id="${esc(n.id)}" transform="translate(${x} ${y})" tabindex="0" role="button" aria-label="${esc(a.titel)}">
    <circle class="schijf" r="${r}"/>
    ${a.soort === "beslissing" || a.soort === "conflict" ? `<text class="sub" y="3" text-anchor="middle" style="font-size:8px;fill:var(--inkt)">?</text>` : a.soort === "risico" ? `<text class="sub" y="3" text-anchor="middle" style="font-size:8px;fill:var(--inkt)">!</text>` : `<text class="sub" y="3" text-anchor="middle" style="font-size:8px;fill:var(--inkt)">→</text>`}
    <text class="blad" x="${tx}" y="${ty}" text-anchor="${anchor}" style="font-size:10px">${esc(kort(a.titel, 34))}</text>
    ${draad ? `<circle class="praat" cx="${-r}" cy="${-r}" r="3"/>` : ""}
  </g>`;
}

/* ---------- pannen en zoomen ---------- */
function pasZoomToe() { const w = document.getElementById("wereld"); if (w) w.setAttribute("transform", `translate(${staat.zoom.x} ${staat.zoom.y}) scale(${staat.zoom.k})`); }
/* De omvang van wat zichtbaar is, met ruimte voor de labels; de kaart groeit

/* ---------- gegevens ---------- */
const docId = (itemId) => itemId.replace(/[^A-Za-z0-9_\-.~:@+]/g, "_");

/* ---------- gegevensbron: de artifact-database (claude.ai) of de eigen database (Supabase, DEC-0042) ----------
   Dezelfde pagina, twee bronnen. Op claude.ai leeft ze in de artifact-database en wekt ze de laptopsessie met een
   signaalbestand; als eigen app (config.js met JARVIS_SUPABASE) schrijft ze in schema jarvis en geeft de database
   zelf de gebeurtenis af die de cloud-uitvoerder start. */
function bronArtifact(db, artifact) {
  return {
    soort: "artifact",
    overzicht(cb, fout) { db.doc("overzicht/huidig").onSnapshot((snap) => cb(snap.exists ? snap.data() : null), fout); },
    status(cb) { db.doc("jarvis/status").onSnapshot((snap) => cb(snap.exists ? snap.data() : null), () => {}); },
    berichten(cb, fout) { db.collection("berichten").onSnapshot((snap) => cb(snap.docs.map((d) => ({ id: d.id, ...d.data() })), !!snap.metadata?.fromCache), fout); },
    antwoorden(cb, fout) { db.collection("antwoorden").onSnapshot((snap) => cb(snap.docs.map((d) => d.data())), fout); },
    async antwoord(itemId, a) { await db.doc(`antwoorden/${docId(itemId)}`).set(a); },
    async bericht(b) { await db.collection("berichten").add(b); },
    async intrekken(itemId) { await db.doc(`antwoorden/${docId(itemId)}`).delete(); },
    autorisaties(cb) { cb([]); },
    async autoriseer() { throw Object.assign(new Error("akkoord alleen in de eigen app"), { code: "alleen_eigen_app" }); },
    async wek(reden, lading) { if (!artifact()) throw Object.assign(new Error("geen artifact"), { code: "capability_disabled" }); await artifact().publish({ "signaal.json": { content: JSON.stringify({ op: new Date().toISOString(), reden, ...lading }, null, 2), contentType: "application/json" } }); },
  };
}
const alsObject = (x) => { if (typeof x !== "string") return x; try { return JSON.parse(x); } catch { return null; } };
function bronSupabase(client) {
  const tabel = (naam) => client.schema("jarvis").from(naam);
  const luister = (naam, laad) => {
    client.channel(`jarvis-${naam}`).on("postgres_changes", { event: "*", schema: "jarvis", table: naam }, () => laad()).subscribe();
  };
  return {
    soort: "supabase",
    overzicht(cb, fout) {
      const laad = async () => { const { data, error } = await tabel("documenten").select("inhoud").eq("id", "overzicht/huidig").maybeSingle(); if (error) fout(error); else cb(alsObject(data?.inhoud) ?? null); };
      laad(); luister("documenten", laad);
    },
    status(cb) {
      const laad = async () => { const { data } = await tabel("documenten").select("inhoud").eq("id", "jarvis/status").maybeSingle(); cb(alsObject(data?.inhoud) ?? null); };
      laad(); luister("documenten", laad);
    },
    berichten(cb, fout) {
      let eerste = true;
      const laad = async () => { const { data, error } = await tabel("berichten").select("*").order("op"); if (error) fout(error); else { cb((data ?? []).map((b) => ({ ...b, context: alsObject(b.context) ?? {} })), eerste); eerste = false; } };
      laad(); luister("berichten", laad);
    },
    antwoorden(cb, fout) {
      const laad = async () => { const { data, error } = await tabel("antwoorden").select("*").order("op"); if (error) fout(error); else cb(data ?? []); };
      laad(); luister("antwoorden", laad);
    },
    async antwoord(itemId, a) { const { error } = await tabel("antwoorden").insert({ id: `${docId(itemId)}:${Date.now().toString(36)}`, ...a }); if (error) throw Object.assign(new Error(error.message), { code: error.code }); },
    async bericht(b) { const { error } = await tabel("berichten").insert(b); if (error) throw Object.assign(new Error(error.message), { code: error.code }); },
    async intrekken(itemId) { const { error } = await tabel("antwoorden").delete().eq("item_id", itemId).eq("status", "nieuw"); if (error) throw Object.assign(new Error(error.message), { code: error.code }); },
    autorisaties(cb, fout) {
      const laad = async () => { const { data, error } = await tabel("autorisaties").select("id, soort, project, taak, scope_hash, pr_repo, pr_nummer, commit_sha, op").order("op", { ascending: false }); if (error) fout(error); else cb(data ?? []); };
      laad(); luister("autorisaties", laad);
    },
    async autoriseer(rij) { const { error } = await tabel("autorisaties").insert(rij); if (error) throw Object.assign(new Error(error.message), { code: error.code }); },
    async wek() { /* de database geeft de gebeurtenis zelf af */ },
  };
}
const vindItem = (itemId) => staat.overzicht.voor_jou.find((i) => i.id === itemId) ?? staat.overzicht.projecten.flatMap((p) => p.aandacht).find((i) => i.id === itemId);
let signaalTimer = null;
function meldJarvis(reden) {
  if (!staat.bron) return;
  if (staat.bron.soort !== "artifact") { staat.signaal = "Jarvis gewekt"; render(); setTimeout(() => { staat.signaal = ""; render(); }, 6000); return; }
  clearTimeout(signaalTimer);
  signaalTimer = setTimeout(async () => {
    const wachten = [...staat.antwoorden.values()].filter((a) => a.status !== "verwerkt").map((a) => a.item_id);
    const berichten = staat.berichten.filter((b) => b.van !== "jarvis" && b.status === "nieuw").length;

  const antwoord = { item_id: itemId, project: item?.project ?? null, soort: item?.soort ?? null, titel: item?.titel ?? null, bron: item?.bron ?? null, keuze, keuze_label: keuzeLabel, notitie, op: new Date().toISOString(), status: "nieuw", overzicht_van: staat.overzicht.gegenereerd_op };
  try { await staat.bron.antwoord(itemId, antwoord); staat.antwoorden.set(itemId, antwoord); staat.dbFout = null; meldJarvis(`antwoord ${itemId}`); }
  catch (err) { staat.dbFout = `Antwoord niet opgeslagen (${err?.code ?? "onbekend"}). Probeer het opnieuw.`; }
  render();
}
async function verstuurBericht(nodeId, tekst) {
  const n = vindKnoop(staat.boom, nodeId);
  const context = { node: nodeId, soort: n?.soort ?? "root", titel: n?.label ?? "Jarvis", project: n?.project?.id ?? null, item_id: n?.item?.id ?? null, taak: n?.taak?.id ?? null };
  const bericht = { van: "eigenaar", tekst, op: new Date().toISOString(), status: "nieuw", context };
  try { await staat.bron.bericht(bericht); staat.dbFout = null; meldJarvis("bericht"); }
  catch (err) { staat.dbFout = `Bericht niet verzonden (${err?.code ?? "onbekend"}).`; staat.concept.set(nodeId, tekst); }
  render();
}
async function sha256Hex(tekst) {
  const bytes = new TextEncoder().encode(tekst.replace(/\r\n/g, "\n"));
  const hash = await crypto.subtle.digest("SHA-256", bytes);
  return [...new Uint8Array(hash)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
function vindTaak(taakId) { return staat.overzicht.projecten.flatMap((p) => p.taken).find((t) => t.id === taakId) ?? null; }
async function geefAkkoordTaak(taakId) {
  const t = vindTaak(taakId);
  if (!t?.scope) { staat.dbFout = "Geen scope bekend voor deze taak."; render(); return; }
  // De pagina hasht wat ze toont; de hash uit het overzicht is alleen een controle.
  const hash = await sha256Hex(t.scope);
  if (t.scope_hash && hash !== t.scope_hash) { staat.dbFout = "De getoonde scope komt niet overeen met het overzicht; ververs de pagina."; render(); return; }
  const rij = { soort: "taak", project: t.project ?? null, taak: t.id, scope_hash: hash, tekst: t.scope, bron: "interface" };
  try { await staat.bron.autoriseer(rij); staat.dbFout = null; meldJarvis(`akkoord ${t.id}`); }
  catch (err) { staat.dbFout = `Akkoord niet vastgelegd (${err?.code ?? err?.message ?? "onbekend"}).`; }
  render();
}
async function geefAkkoordPr(berichtId) {
  const b = staat.berichten.find((x) => x.id === berichtId); const v = b?.context?.akkoord_pr;
  if (!v) return;
  const rij = { soort: "pr", project: v.project ?? null, taak: v.taak ?? null, pr_repo: v.repo, pr_nummer: Number(v.nummer), commit_sha: v.commit_sha, tekst: b.tekst, bron: "interface" };
  try { await staat.bron.autoriseer(rij); staat.dbFout = null; meldJarvis(`akkoord pr ${v.repo}#${v.nummer}`); }
  catch (err) { staat.dbFout = `Akkoord niet vastgelegd (${err?.code ?? err?.message ?? "onbekend"}).`; }
  render();
}
async function verwijderAntwoord(itemId) {
  try { await staat.bron.intrekken(itemId); staat.antwoorden.delete(itemId); staat.dbFout = null; meldJarvis(`ingetrokken ${itemId}`); }
  catch (err) { staat.dbFout = `Antwoord niet verwijderd (${err?.code ?? "onbekend"}).`; }
  render();
}
function toonLogin(client, melding) {
  $status.innerHTML = `<span class="dot uit"></span>inloggen`;
  $pinhoud.innerHTML = `<div class="blok"><span class="eyebrow">Jarvis — eigen app</span><p>Log in met je Kasboek-account; alleen de eigenaar ziet iets.</p>${melding ? `<div class="melding fout">${esc(melding)}</div>` : ""}
    <form id="login" class="antwoordvak"><input name="email" type="email" placeholder="e-mail" autocomplete="username" required><input name="wachtwoord" type="password" placeholder="wachtwoord" autocomplete="current-password" required><button class="knop" type="submit">Inloggen</button></form></div>`;
  $paneel.hidden = false;
  document.getElementById("login").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    const { error } = await client.auth.signInWithPassword({ email: String(f.get("email")), password: String(f.get("wachtwoord")) });
    if (error) toonLogin(client, "Inloggen mislukt: " + error.message);
  });
}
function bronProef(gegevens) {
  const weiger = async () => { throw Object.assign(new Error("proefbron: alleen lezen"), { code: "proef" }); };
  return {
    soort: "proef",
    overzicht(cb) { cb(gegevens.overzicht ?? null); },
    status(cb) { cb(gegevens.status ?? null); },
    berichten(cb) { cb(gegevens.berichten ?? [], false); },
    antwoorden(cb) { cb(gegevens.antwoorden ?? []); },
    autorisaties(cb) { cb(gegevens.autorisaties ?? []); },
    antwoord: weiger, bericht: weiger, intrekken: weiger, autoriseer: weiger, async wek() {},
  };
}
async function maakBron() {
  if (window.JARVIS_PROEF) return bronProef(window.JARVIS_PROEF);
  const cfg = window.JARVIS_SUPABASE;
  if (cfg?.url && cfg?.key) {
    await new Promise((ok, nee) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"; sc.onload = ok; sc.onerror = nee; document.head.appendChild(sc); });
    const client = window.supabase.createClient(cfg.url, cfg.key, { db: { schema: "jarvis" } });
    const { data: { session } } = await client.auth.getSession();
    if (!session) {
      toonLogin(client, "");
      await new Promise((ok) => { client.auth.onAuthStateChange((_ev, s) => { if (s) ok(); }); });
    }
    client.auth.onAuthStateChange((_ev, s) => { if (!s) location.reload(); });
    return bronSupabase(client);
  }
  let db = null;
  try { db = window.claude?.use ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) return null;
  window.claude.use("artifact").then((a) => { staat.artifact = a; }).catch(() => { staat.artifact = null; });
  return bronArtifact(db, () => staat.artifact);
}
async function start() {
  if (window.JARVIS_SUPABASE && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  const bron = await maakBron();
  staat.bron = bron; staat.db = bron;
  if (!staat.gekozen) staat.gekozen = "root";
  if (!bron) { $status.innerHTML = `<span class="dot uit"></span>geen gegevens — open dit op claude.ai of als eigen app`; return; }
  bron.overzicht((data) => {
    if (!data) { $status.innerHTML = `<span class="dot uit"></span>nog geen overzicht`; return; }
    staat.overzicht = { versie: data.versie, gegenereerd_op: data.gegenereerd_op, centraal: data.centraal ?? null, projecten: data.projecten ?? [], voor_jou: data.voor_jou ?? [] };
    render();
  }, (err) => { staat.dbFout = `Overzicht niet te lezen (${err.code ?? err.message}).`; render(); });
  bron.status((data) => { staat.jarvis = data; render(); });
  bron.autorisaties((rijen) => { staat.autorisaties = rijen; render(); }, (err) => { staat.dbFout = `Akkoorden niet te lezen (${err.code ?? err.message}).`; render(); });
  bron.berichten((rijen, uitCache) => {
    staat.berichten = rijen.filter((b) => b.tekst);
    const laatsteJarvis = [...staat.berichten].filter((b) => b.van === "jarvis").sort((a, b) => String(a.op).localeCompare(String(b.op))).pop();
    if (laatsteJarvis && laatsteJarvis.id !== staat.laatstVoorgelezen && !uitCache) { if (staat.laatstVoorgelezen) spreek(laatsteJarvis.tekst); staat.laatstVoorgelezen = laatsteJarvis.id; }
    render();
  }, (err) => { staat.dbFout = `Gesprek niet te lezen (${err.code ?? err.message}).`; render(); });
  bron.antwoorden((rijen) => {
    staat.antwoorden = new Map();
    for (const a of rijen) if (a?.item_id) staat.antwoorden.set(a.item_id, a);
    render();
  }, (err) => { staat.dbFout = `Antwoorden niet te lezen (${err.code ?? err.message}).`; render(); });
}
start();
})();
