name: jarvis-attestatie

# De attestatie van Jarvis (DEC-0043): de poort geeft de goedkeurende review af.
#
# De eigenaar autoriseert per taak in de Jarvis-interface; dat akkoord staat
# in de eigen database van Jarvis en kan alleen door zijn ingelogde account
# zijn geschreven. De ruleset op de hoofdbranch eist daarnaast een
# goedkeurende review van iemand anders dan de auteur. Die review is
# techniek: deze workflow verifieert deterministisch dat het akkoord bestaat,
# dat de scope van de taak sindsdien niet veranderde, dat een onafhankelijke
# toetsing GO gaf op precies deze commit, dat er geen harde uitzondering
# speelt zonder apart akkoord, en dat de poort groen is. Pas dan keurt hij
# goed, met het kortlevende GITHUB_TOKEN van deze run.
#
# Waarom een workflow en geen tweede botaccount: GITHUB_TOKEN bestaat alleen
# tijdens de run, kan buiten deze repository niets, en hoeft nergens bewaard
# of geroteerd te worden. De code die beslist staat op main; een pull request
# kan haar niet aanpassen om zichzelf goed te keuren, want `workflow_dispatch`
# draait altijd de versie op de opgegeven ref (main).
#
# GitHub telt deze goedkeuring alleen mee wanneer de repository-instelling
# "Allow GitHub Actions to create and approve pull requests" aanstaat. Dat is
# een bewuste keuze van de eigenaar, per repository.
#
# Deze workflow bevat geen logica. Hij zet één invoer in de omgeving en roept
# een vaste opdracht aan; die leest, beoordeelt en handelt.
#
# Twee jobs, en dat is geen opsmuk. De tweede voegt samen wat de eerste heeft
# goedgekeurd — de uitvoerder kan dat zelf niet, omdat de
# permissieclassificatie van zijn omgeving de opdrachtregel leest en de
# autorisatietoestand niet kan zien. Samenvoegen vraagt `contents: write`, en
# rechten gelden per job: in één job zou elke repository die deze workflow
# spiegelt dat recht krijgen, ook zonder de functie te gebruiken. Nu draait de
# tweede job alleen wanneer de projectconfiguratie het aanzet, en bestaat het
# recht alleen daar. De tweede job neemt niets aan uit de eerste: dezelfde
# beoordeling draait er opnieuw op de huidige feiten.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Nummer van de pull request"
        required: true
        type: string

concurrency:
  group: jarvis-attestatie-${{ inputs.pr }}
  cancel-in-progress: false

# Geen rechten op workflowniveau. Elke job vraagt wat hij nodig heeft, en
# niets meer: het samenvoegen vraagt `contents: write`, en GitHub verleent
# rechten per job. Stond dat recht hierboven, dan kreeg élke repository die
# deze workflow spiegelt schrijfrecht op haar hoofdbranch — ook de
# repositories die `attestatie.samenvoegen` niet aanzetten en er dus niets aan
# hebben. Dat is een verruiming zonder tegenwaarde, en die hoort er niet te
# zijn.
permissions: {}

jobs:
  attestatie:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # De poortstatus lezen: in een privé-repository weigert GitHub dat zonder
      # checks:read (gemeten 2026-09-14 bij Kasboek #5: 403 "Resource not
      # accessible by integration"; in de publieke engine-repository werkte het wel).
      checks: read
    outputs:
      samenvoegen: ${{ steps.attesteren.outputs.samenvoegen }}
    steps:
      # Gepind op een commit-SHA (RSK-0020), net als in de poort.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Bewust de standaardbranch: de attestatiecode komt van main, niet
          # van de pull request die beoordeeld wordt.
          ref: main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: geen lifecycle-scripts, om dezelfde reden als in de
      # poort. Deze job leest bestanden en praat met twee API's; meer niet.
      - run: npm ci --ignore-scripts

      - name: Jarvis-attestatie
        id: attesteren
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMMER: ${{ inputs.pr }}
        run: node node_modules/jarvis-engine/bin/jarvis.mjs attestatie --pr "$PR_NUMMER"

  # Alleen voor een repository die het zelf heeft aangezet. Draait deze job
  # niet, dan bestaat het schrijfrecht ook niet.
  samenvoegen:
    needs: attestatie
    if: needs.attestatie.outputs.samenvoegen == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # Neemt niets aan uit de vorige job: dezelfde beoordeling draait hier
      # opnieuw op de huidige feiten, en de configuratie moet het hier ook nog
      # toestaan.
      - name: Samenvoegen na attestatie
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMMER: ${{ inputs.pr }}
        run: node node_modules/jarvis-engine/bin/jarvis.mjs attestatie --pr "$PR_NUMMER" --samenvoegen
