# Jarvis — allowlist voor de sanitizer (jarvis/src/sanitize.ts).
#
# Uitsluitend aantoonbaar PUBLIEKE bedrijfsgegevens: waarden die al op de
# website, op briefpapier of in het handelsregister staan. Interne identifiers
# horen hier NIET, ook niet "even tijdelijk".
#
# Drie sleutels, allemaal optioneel; alles daarbuiten laat het laden falen.
#   emails            publieke contactadressen
#   telefoonnummers   publieke nummers (E.164 of NL-notatie, beide matchen)
#   tokens            aantoonbaar publieke hoge-entropiestrings (bv. een
#                     publieke site-key), NOOIT een secret
#
# HARDE REGEL: UUID's kunnen hier NOOIT in. Interne tenant- en klant-UUID's
# zijn het gevoeligste dat in deze repo kan lekken, dus laadAllowlist() weigert
# elk item dat een UUID bevat. Hetzelfde geldt voor herkenbare
# leverancierssecrets (sb_secret_, sk-, SG., re_, AC/SK + 32 hex): die zijn per
# definitie fout en zijn niet vrij te geven.

emails:
  - info@tovas.nl
  - flow@tovas.nl

telefoonnummers:
  - "+31612686292"

# Vorm: `<waarde> in <padvoorvoegsel>`. Het padgedeelte is niet optioneel in
# de praktijk: zonder " in " geldt de uitzondering repo-breed en is de scanner
# overal blind voor die string. Schrijf dus het smalste pad dat werkt.
#
# Leeg houden tenzij aantoonbaar publiek. Een string van 32+ tekens die je hier
# wilt zetten omdat "de scan zeurt" hoort in negen van de tien gevallen gewoon
# uit het bestand verwijderd te worden.
tokens:
  # Naam van een databaseconstraint, letterlijk geciteerd in een
  # analysedocument. Geen geheim, wel lang genoeg om de entropiecontrole te
  # halen. Bewust hier als expliciete uitzondering per waarde, in plaats van
  # een vormheuristiek die ook wachtwoorden zou doorlaten.
  - offerte_config_opvolg_2_positief in docs/
  - offerte_config_opvolg_2_positief in tasks/T-20260910-jarvis-v1/
  # Twee verzonnen wachtwoorden uit het QA-rapport van T-20260910-jarvis-v1.
  # Ze staan daar als BEWIJS dat de scanner ze moet vangen, en dat doet hij nu
  # ook - vandaar dat het rapport zelf erop afketst. Het zijn geen credentials
  # van enig systeem. Verwijder deze twee regels zodra dat rapport is
  # gearchiveerd.
  - correct-horse-battery-staple-amsterdam-2026 in tasks/T-20260910-jarvis-v1/qa-rapport.md
  - zomer_regen_kabel_vlieger_2026_geheim in tasks/T-20260910-jarvis-v1/qa-rapport.md
